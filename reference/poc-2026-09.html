          if (Math.random() < dt * 4) emettre(p.x, p.y - D.taille * 0.75, '#ff7a6b', 1, 34, 'trait');

        } else {
          p.enAlerte = false;
          // ronde : elle va d'un point de passage au suivant, et le regard
          // balaye autour de sa direction de marche
          // elle recule jusqu'à être NETTEMENT hors de la braise : s'arrêter à
          // sa frontière la faisait osciller entre gênée et pas gênée
          const b = zone.braises.find((q) => Math.hypot(q.x - p.x, q.y - p.y) < q.r * 1.3);
          if (b) {
            const bx = p.x - b.x, by = p.y - b.y, bd = Math.hypot(bx, by) || 1;
            p.vx += (bx / bd) * 300 * dt;
            p.vy += (by / bd) * 300 * dt;
            p.humeur = HUMEURS.INTRIGUE;
          } else if (p.ronde && p.ronde.length) {
            const c = p.ronde[p.etape % p.ronde.length];

            // détecteur de blocage : si elle n'avance plus, elle recalcule
            // plutôt que de pousser contre la pierre
            p.immobile = Math.hypot(p.x - (p.dernierX || 0), p.y - (p.dernierY || 0)) < 0.4
              ? (p.immobile || 0) + dt : 0;
            p.dernierX = p.x; p.dernierY = p.y;

            if (Math.hypot(c.x - p.x, c.y - p.y) < CASE * 0.6) {
              // arrivée : on passe au point suivant, une seule fois
              p.etape++; p.route = null; p.immobile = 0;
            } else {
              if (!p.route || !p.route.length || p.immobile > 1.1) {
                p.route = routeVers(p.x, p.y, c.x, c.y, true);
                p.immobile = 0;
              }
              // Un chemin vide alors qu'on n'est PAS arrivé veut dire que la
              // cible est dans notre propre case : le parcours en largeur n'a
              // rien à renvoyer. On y va alors en ligne droite — c'est sans
              // risque à cette distance. Sans ce cas, la sentinelle sautait au
              // point suivant à chaque frame et ne partait jamais nulle part.
              const w = (p.route && p.route.length) ? p.route[0] : c;
              const rx = w.x - p.x, ry = w.y - p.y;
              const rd = Math.hypot(rx, ry) || 1;
              if (p.route && p.route.length && rd < CASE * 0.45) p.route.shift();
              else { p.vx += (rx / rd) * 430 * dt; p.vy += (ry / rd) * 430 * dt; }
              p.cap = Math.atan2(ry, rx);
            }
            p.humeur = p.aveugle > 0 ? HUMEURS.INTRIGUE : HUMEURS.ACHARNE;
          }
          p.phase += p.balayage * 0.8 * dt;
          const cap = p.cap === undefined ? p.regardRepos : p.cap;
          p.regard += ecartAngle(p.regard, cap + Math.sin(p.phase) * 0.9) * 3.2 * dt;
        }

        // aveuglée : elle ferme les yeux et stresse
        if (p.aveugle > 0 && Math.random() < dt * 9) {
          emettre(p.x + (Math.random() - 0.5) * D.taille, p.y - D.taille * 0.8,
                  Math.random() < 0.5 ? '#ffffff' : '#ff7a6b', 1, 30);
        }
      }

      const f = Math.pow(0.0016, dt);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = clamp(p.x, demi, zone.largeur - demi);
      p.y = clamp(p.y, demi, zone.hauteur - demi);
      degager(p, demi, p.emotion === EMOTIONS.COLERE);

      // séparation d'avec le joueur : un rouge logé dedans est illisible
      const sx = p.x - joueur.x, sy = p.y - joueur.y;
      const sd = Math.hypot(sx, sy);
      const mini = D.taille * 0.95;
      if (sd > 0.01 && sd < mini) {
        const k = (mini - sd) * 0.5;
        p.x += (sx / sd) * k; p.y += (sy / sd) * k;
        joueur.x -= (sx / sd) * k; joueur.y -= (sy / sd) * k;
        degager(joueur, demi);
        // Toucher une sentinelle est fatal (voir majRegles) ; ici on se contente
        // de la réveiller, pour le cas où elle serait aveuglée.
        if (p.emotion === EMOTIONS.COLERE) {
          p.alerte = 2.8;
          p.route = null;
        }
      }

      majJelly(p, dt);
    }
  }

  /* ==================================================== règles =========== */

  // Formes déjà expliquées une fois dans la session : on ne réexplique pas.
  const dejaVues = new Set();

  function evoluer() {
    const suivant = FORMES[joueur.niveau + 1];
    if (!suivant || joueur.sommet < suivant.seuil) return;
    joueur.niveau++;
    // le palier élargit la poche : on la remplit tout de suite, sinon la
    // récompense ne se sent qu'au bout d'une recharge complète
    joueur.galets = rangCaillou().reserve;
    majBoutons();
    emettre(joueur.x, joueur.y - D.taille * 0.7, suivant.couleur, 16, 90);
    // Le bandeau modal met le jeu en pause. Acceptable pour découvrir un verbe,
    // insupportable au milieu d'une escorte — et comme la forme repart à zéro à
    // chaque zone, on le reverrait à chaque fois. Une seule explication par
    // forme et par session ; ensuite un simple bandeau passager.
    // Plus de bandeau modal : il coupait le jeu pour expliquer ce que le bouton
    // peut montrer tout seul. Le caillou prend la couleur de la forme, pulse, et
    // une ligne passagère nomme ce qu'il sait faire de plus.
    elCaillou.classList.remove('evolue');
    void elCaillou.offsetWidth;                 // pour rejouer l'animation
    elCaillou.classList.add('evolue');
    elCaillou.style.color = suivant.couleur;
    elCaillou.style.borderColor = rgba(suivant.couleur, 0.75);
    elCaillou.style.setProperty('--aura', `${6 + joueur.niveau * 5}px`);
    montrerToast(`${suivant.nom} — ${suivant.verbe.toLowerCase()}`, suivant.couleur);
  }

  function majBoutons() {
    elCaillou.disabled = joueur.galets <= 0;
    elCaillouN.textContent = joueur.galets;
    // l'anneau montre le galet en cours de retour ; poche pleine, il est plein
    const plein = joueur.galets >= rangCaillou().reserve;
    elCaillou.style.setProperty('--recharge', plein ? '1' : joueur.caillouDispo.toFixed(2));
  }

  function gagnerEclat(n) {
    joueur.eclat += n;
    joueur.sommet = Math.max(joueur.sommet, joueur.eclat);
    evoluer();
  }

  // Un membre du convoi repéré s'enfuit et redevient farouche. Il reste
  // récupérable : il faut retourner le calmer, ce qui coûte du temps.
  function paniquer(q) {
    q.suit = false; q.calme = false; q.compteCalme = 0;
    q.fuit = 1.2;
    const a = Math.atan2(q.y - joueur.y, q.x - joueur.x);
    q.vx += Math.cos(a) * 420; q.vy += Math.sin(a) * 420;
    q.baseX = q.x; q.baseY = q.y;
    emettre(q.x, q.y - D.taille * 0.8, '#8fd0ff', 8, 70);
    montrerToast('Une âme t\'échappe !', '#8fd0ff');
    for (const r of zone.persos) if (r.suit && r.rang > q.rang) r.rang--;
  }

  // Un point de sol libre au plus près d'une position : les âmes lâchées ne
  // doivent pas se retrouver dans la pierre.
  // Elles se répandent autour du point de chute plutôt que de s'y empiler :
  // cinq âmes sur un même pixel, on n'en voit qu'une et on croit en avoir perdu
  // quatre pour de bon. On balaye en spirale et on refuse une place déjà prise —
  // un cap figé par âme ne suffisait pas, celle dont le cap pointait dans la
  // pierre restait plantée au centre avec les autres.
  function solLibrePres(x, y, rang, prises) {
    const ecart = CASE * 0.45;
    for (let anneau = 1; anneau <= 4; anneau++) {
      for (let k = 0; k < 12; k++) {
        const a = (k / 12) * TAU + rang * 0.52;      // chacune commence ailleurs
        const cx = x + Math.cos(a) * CASE * 0.55 * anneau;
        const cy = y + Math.sin(a) * CASE * 0.55 * anneau;
        if (solide(Math.floor(cx / CASE), Math.floor(cy / CASE))) continue;
        if (prises.some((q) => Math.hypot(q.x - cx, q.y - cy) < ecart)) continue;
        return { x: cx, y: cy };
      }
    }
    return { x, y };                    // cul-de-sac d'une case : tant pis
  }

  function eteindre() {
    // L'éclat n'est JAMAIS repris : la progression ne se perd pas, sinon la
    // mort punit deux fois. Et c'est un bandeau qui s'efface, pas une fenêtre à
    // valider : ça casserait le rythme.
    joueur.souffle = 1;
    for (const p of zone.persos) p.charge = 0;

    // On perd le CONVOI, jamais la banque. Ce qui est entré dans le portail y
    // reste : le travail déjà fait ne se défait pas, sinon une mort tardive
    // renvoie à la case départ et l'escorte devient décourageante. Ce qu'on
    // portait sur le dos, en revanche, se disperse là où on est tombé, et il
    // faut retourner le chercher à l'endroit exact de l'échec.
    const mx = joueur.x, my = joueur.y;
    const prises = [];
    let perdues = 0;
    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE || !p.suit || p.livre) continue;
      const pos = solLibrePres(mx, my, ++perdues, prises);
      prises.push(pos);
      p.x = p.baseX = pos.x; p.y = p.baseY = pos.y;
      p.vx = p.vy = 0;
      p.suit = false; p.calme = false;
      p.compteCalme = 0; p.rang = 0; p.fuit = 0.8;
      emettre(p.x, p.y - D.taille * 0.8, '#8fd0ff', 8, 60);
    }

    joueur.x = zone.depart.x; joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    joueur.repit = 1.6;
    fil.push(null);                     // coupure : on ne relie pas la mort au seuil
    filDernier = { x: zone.depart.x, y: zone.depart.y };
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      p.x = p.baseX; p.y = p.baseY; p.vx = p.vy = 0;
    }
    montrerToast(perdues
      ? `Éteint — ${perdues} âme${perdues > 1 ? 's' : ''} lâchée${perdues > 1 ? 's' : ''} là où tu es tombé`
      : 'Éteint — tu repars du seuil');

    // On ne donne jamais l'outil avant le problème. La toute première fois
    // qu'un regard nous éteint, le bouton CAILLOU se signale — sans un mot
    // d'explication : il se met à battre, et c'est au joueur d'essayer.
    if (premiereMort) {
      premiereMort = false;
      elCaillou.classList.remove('evolue');
      void elCaillou.offsetWidth;
      elCaillou.classList.add('evolue');
    }
  }

  // À quoi servent les petites choses jaunes ? On ne l'avait jamais dit. La
  // première fois, une phrase le nomme ; ensuite, chaque ramassage fait monter
  // un « +4 » vers la barre du haut et la fait tressaillir — le lien entre
  // l'objet et la progression se voit, il n'a plus à être lu.
  let premiereLueur = true;
  let premiereReprise = true;
  let premiereMort = true;
  let seuilDit = false;              // le Seuil a-t-il déjà dit ce qu'il attend ?
  let nudgeCaillou = 0, nudgeArme = false;
  // La règle attachée à une espèce ne se dit qu'une fois : répétée à chaque
  // âme, elle redevient la modale intrusive qu'on a retirée.
  const regleDite = {};

  function ramasser(l) {
    l.prise = true;
    const b = BONUS[l.type];
    emettre(l.x, l.y, b.couleur, 10, 70);
    priseCount++;
    if (l.type === 'eclat') {
      flotter(l.x, l.y, '+4', b.couleur);
      pulserJauge();
      if (premiereLueur) {
        premiereLueur = false;
        montrerToast('Les lueurs remplissent ta confiance, en haut à droite — pleine, tu changes de forme', b.couleur);
      }
      gagnerEclat(4);
      return;
    }
    if (l.type === 'galet') {
      joueur.galets = rangCaillou().reserve;
      joueur.caillouDispo = 0;
      // et la poche reste intarissable quelques secondes : un bonus qu'on ne
      // sent pas n'est pas un bonus
      joueur.bonus = l.type;
      joueur.bonusT = b.duree;
      majBoutons();
      montrerToast(b.phrase, b.couleur);
      return;
    }
    if (l.type === 'souffle') joueur.souffle = 1;
    joueur.bonus = l.type;
    joueur.bonusT = b.duree;
    montrerToast(b.phrase, b.couleur);
    flotter(l.x, l.y, '+2', b.couleur);
    pulserJauge();
    gagnerEclat(2);
  }

  // Une porte s'ouvre pour QUI QUE CE SOIT — joueur comme sentinelle — et se
  // referme seule. C'est ce qui en fait un objet de tension et pas un verrou :
  // s'en approcher ouvre le couloir au regard d'en face, exactement au moment
  // où on voudrait rester caché.
  function majPortes(dt) {
    // l'éboulement d'un mur fêlé : la pierre s'efface en un tiers de seconde
    for (const f of zone.fissures) {
      if (f.casse > 0 && f.casse < 1) f.casse = Math.min(1, f.casse + dt * 3);
    }
    for (const pt of zone.portes) {
      // on retient QUI ouvre, et pas seulement qu'on ouvre : le battant doit
      // s'écarter de celui qui pousse
      let ouvreur = null, plusPres = CASE * 0.95;
      const tester = (q) => {
        const d = Math.hypot(q.x - pt.x, q.y - pt.y);
        if (d < plusPres) { plusPres = d; ouvreur = q; }
      };
      tester(joueur);
      // Un rouge ne pousse aucune porte : ni pour la franchir, ni même pour
      // l'entrouvrir et voir au travers.
      for (const q of zone.persos) if (!q.livre && q.emotion !== EMOTIONS.COLERE) tester(q);

      // Le sens est figé au moment où la porte s'entrouvre, et gardé jusqu'à ce
      // qu'elle soit refermée : sans ça le battant claquerait d'un côté à
      // l'autre pendant qu'on la traverse.
      if (ouvreur && pt.ouverte <= 0.02) {
        const ecart = pt.verticale ? ouvreur.x - pt.x : pt.y - ouvreur.y;
        pt.sens = ecart >= 0 ? 1 : -1;
      }
      const proche = !!ouvreur;
      const avant = pt.ouverte;
      pt.ouverte = clamp(pt.ouverte + (proche ? 3.2 : -1.3) * dt, 0, 1);
      // franchir le seuil change ce qui est solide : les ombres portées des
      // torches et des braises doivent être recalculées
      if ((avant < 0.5) !== (pt.ouverte < 0.5)) zone.versionPortes++;
      if (avant < 0.5 && pt.ouverte >= 0.5) emettre(pt.x, pt.y, '#c8b088', 5, 40);
    }
  }

  function majRegles(dt) {
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      if (Math.hypot(l.x - joueur.x, l.y - joueur.y) < D.taille * 0.9) { ramasser(l); continue; }
      // mémoire des points d'intérêt : on se souvient des objets, pas du terrain
      if (!l.vue && estEclaire(l.x, l.y)) l.vue = true;
    }
    if (!zone.sortie.vue && estEclaire(zone.sortie.x, zone.sortie.y)) zone.sortie.vue = true;

    // Arriver sur un portail fermé sans savoir ce qu'il attend, c'est rester
    // planté devant. On le dit une fois, la première fois qu'on s'en approche.
    if (!seuilDit && zone.sortie.ames < zone.requis
        && Math.hypot(zone.sortie.x - joueur.x, zone.sortie.y - joueur.y) < CASE * 2.4) {
      seuilDit = true;
      montrerToast(`Le Seuil est vide — il s'ouvre quand ${zone.requis} âmes s'y tiennent`, '#ffe9a8');
    }

    for (const t of zone.torches) {
      if (t.reste > 0) t.reste -= dt;
      // Une case et demie, pas trois quarts de case : le brandon est décalé vers
      // sa paroi, et à 0,75 il fallait lui rentrer dedans au pixel près. On
      // passait à côté d'un abri sans le reprendre, sans jamais savoir pourquoi.
      if (Math.hypot(t.x - joueur.x, t.y - joueur.y) < CASE * 1.15 && t.reste < t.duree * 0.6) {
        if (t.reste <= 0) emettre(t.x, t.y, '#ffb45c', 8, 55);
        t.reste = t.duree;
      }
    }

    // Les points de reprise. À la mort on repart à l'entrée de la salle en
    // cours, pas au seuil de l'étage : la mort doit coûter des secondes, pas de
    // la patience. Un niveau écrit à la main en pose un par salle ; les zones
    // tirées au sort n'en ont aucun et repartent du seuil, comme avant.
    for (const rp of zone.reprises) {
      if (rp.pris || Math.hypot(rp.x - joueur.x, rp.y - joueur.y) > CASE * 0.85) continue;
      rp.pris = true;
      zone.depart = { x: rp.x, y: rp.y };
      emettre(rp.x, rp.y, '#ffe9a8', 10, 45);
      ondes.push({ x: rp.x, y: rp.y, r: 0, max: CASE * 1.5, couleur: '#ffe9a8' });
      if (premiereReprise) {
        premiereReprise = false;
        montrerToast('Tu te souviendras d\'être passé ici', '#ffe9a8');
      }
    }

    // Les murmures : de la matière narrative posée exactement là où elle est
    // pertinente, et jamais en travers du chemin.
    for (const m of zone.murmures) {
      if (m.dit || Math.hypot(m.x - joueur.x, m.y - joueur.y) > CASE * 1.4) continue;
      m.dit = true;
      murmurer(m.x, m.y - CASE * 0.95, m.texte);
    }

    // Une âme qu'on ne peut pas encore rallumer laisse le joueur tourner autour
    // d'elle sans comprendre ce qu'elle attend. Elle le dit — une fois, et
    // seulement tant qu'on n'a pas de faisceau, c'est-à-dire tant que c'est vrai.
    if (!porteeFaisceau()) {
      for (const p of zone.persos) {
        if (p.emotion === EMOTIONS.COLERE || p.calme || p.livre || p.aDit) continue;
        if (Math.hypot(p.x - joueur.x, p.y - joueur.y) > CASE * 2.4) continue;
        p.aDit = true;
        murmurer(p.x, p.y - D.taille * 1.9, ETEINTS[numEteint++ % ETEINTS.length], '#8fd0ff', p);
      }
    }

    // Regarder un bonhomme assez longtemps le calme — n'importe lequel, pas
    // seulement les peureux. Il passe au vert et SON FAISCEAU DEVIENT
    // PERMANENT : c'est ce qui donne enfin un rôle aux personnages non joués.
    // Une lampe qu'on gagne en la regardant, et qu'on choisit où allumer.
    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE || p.calme || p.livre || !p.eclaire) continue;
      p.compteCalme += dt;
      if (p.compteCalme > DUREE_CALME) {
        p.calme = true;
        p.suit = true;
        p.rang = zone.persos.filter((q) => q.suit).length;   // sa place dans la file
        // Une âme ne paie QU'UNE FOIS. Paniquer et mourir remettent `calme` à
        // faux, donc recalmer la même âme repayait 6 d'éclat à chaque tour :
        // mesuré, une seule âme rapportait 30 d'éclat en cinq recalmages, sans
        // aucune limite. C'est ce qui faisait monter les formes bien plus vite
        // que le plafond d'une zone ne l'autorise. La récupérer reste gagnant —
        // on récupère sa cargaison et ses dix points de livraison.
        if (!p.prime) { p.prime = true; gagnerEclat(6); }
        emettre(p.x, p.y - D.taille * 0.7, '#a8f0c8', 12, 80);
        // La règle, une fois. Ensuite ce sont eux qui parlent : une phrase
        // au-dessus de la tête, sans bouton, pendant qu'on continue de jouer.
        if (!regleDite[p.emotion]) {
          regleDite[p.emotion] = true;
          montrerToast(p.emotion === EMOTIONS.PEUR
            ? 'Il te suit — mais seulement dans ta lumière'
            : 'Il te suit et éclaire devant lui', '#a8f0c8');
        }
        const pool = REPLIQUES[p.emotion];
        if (pool) murmurer(p.x, p.y - D.taille * 1.9, pool[numReplique++ % pool.length], '#a8f0c8', p);
      }
    }

    // LA RÈGLE. Entrer dans le faisceau ne te fait pas repérer : ça met la
    // sentinelle en alerte, et une zone rouge se met à grandir depuis elle le
    // long de son cône. Tant que ce front ne t'a pas rattrapé, tu peux encore
    // sortir. S'il t'atteint — ou si tu la touches — c'est fini. La distance
    // fait donc le délai toute seule, sans aucune formule.
    if (joueur.repit > 0) joueur.repit -= dt;
    const abri = aLAbri(joueur.x, joueur.y);
    joueur.abri = abri;                 // lu par le visage : voir `humeurDuJoueur`
    // Calculé UNE fois par image et non par sentinelle : la question ne dépend
    // que de la position de l'âme, pas de qui la regarde.
    for (const q of zone.persos) {
      q.abri = q.emotion !== EMOTIONS.COLERE && q.suit && !q.livre
        && aLAbri(q.x, q.y);
    }
    // quelques motes tièdes qui montent : le calme a son bruit de fond
    if (abri && Math.random() < dt * 7) {
      emettre(joueur.x + (Math.random() - 0.5) * D.taille * 1.4,
              joueur.y + D.taille * 0.3, '#ffd9a0', 1, 30);
    }
    let pire = 0, traque = false;

    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.livre) continue;

      // Hystérésis sur l'abri : une sentinelle arrêtée pile au bord d'une braise
      // basculait alerte / pas alerte plusieurs fois par seconde. Elle entre
      // dans l'état « gênée » plus loin qu'elle n'en sort.
      // Pendant qu'elle va voir un bruit, elle ne cherche plus personne. C'est
      // tout l'intérêt du caillou : il ne détourne pas seulement son regard, il
      // lui fait lâcher ce qu'elle tenait.
      p.gene = p.aveugle > 0 || p.curieuxT > 0
        || prochedUneBraise(p.x, p.y, p.gene ? 1.12 : 0.95);

      const d = Math.hypot(joueur.x - p.x, joueur.y - p.y);
      if (d < D.taille && joueur.repit <= 0 && p.aveugle <= 0) { eteindre(); return; }

      // Ce que la sentinelle peut voir : toi ET ton convoi. C'est le cœur de
      // l'arbitrage — chaque âme que tu escortes est une silhouette de plus
      // dans le faisceau, et la jauge monte d'autant plus vite.
      const exposable = (q) => !p.gene && p.cligne <= 0
        && Math.hypot(q.x - p.x, q.y - p.y) <= PORTEE_VUE
        && dansLeCone(p.x, p.y, p.regard, q.x, q.y, PORTEE_VUE, 0.42)
        && vueLibre(p.x, p.y, q.x, q.y);

      // Voilé couvre le convoi autant que le joueur : c'est ce qui en fait un
      // bonus d'escorte, et c'est le seul moment du jeu où l'on peut traverser
      // un faisceau à cinq sans rien perdre.
      const voile = aBonus('souffle');
      const joueurVu = !voile && !abri && joueur.repit <= 0 && exposable(joueur);
      const convoi = voile ? []
        : zone.persos.filter((q) => q.suit && !q.livre && !q.abri && exposable(q));
      const corps = (joueurVu ? 1 : 0) + convoi.length;
      p.corpsVus = corps;                       // exposé pour les mesures

      if (corps > 0) {
        traque = true;
        p.alerte = 2.8;                         // elle se doute, elle n'a pas vu
        p.charge = Math.min(1, p.charge + 0.34 * corps * dt);

        // Le front rouge rattrape quelqu'un : le joueur est éliminé, mais un
        // membre du convoi PANIQUE seulement. On perd la cargaison, pas la
        // partie — un échec qui coûte du temps plutôt qu'une punition sèche.
        const front = p.charge * PORTEE_VUE;
        if (joueurVu && front >= d) { eteindre(); return; }
        for (const q of convoi) {
          if (front < Math.hypot(q.x - p.x, q.y - p.y)) continue;
          paniquer(q);
        }
      } else {
        const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
        p.charge = Math.max(0, p.charge - (cache ? 0.7 : 0.45) * dt);
      }
      pire = Math.max(pire, p.charge);
    }

    // Le halo suit la jauge la plus pleine : la lumière rétrécit à mesure qu'une
    // sentinelle te verrouille, et revient quand tu lui échappes. Une seule
    // idée, deux lectures.
    // Le caillou ne sert que si on se souvient qu'il existe au moment où il
    // servirait. Quand un regard commence à nous tenir, le bouton se signale —
    // trois fois par partie au plus, et jamais deux fois sans être ressorti du
    // danger entre-temps.
    if (pire > 0.28 && !nudgeArme && nudgeCaillou < 3) {
      nudgeArme = true; nudgeCaillou++;
      elCaillou.classList.remove('evolue');
      void elCaillou.offsetWidth;
      elCaillou.classList.add('evolue');
    } else if (pire < 0.05) nudgeArme = false;

    joueur.souffle = 1 - pire;
    joueur.vu += ((traque ? 1 : 0) - joueur.vu) * Math.min(1, 6 * dt);
    // Ce que TOUT LE MONDE ressent : être dans un faisceau, ou simplement
    // savoir qu'un rouge cherche. C'est ce drapeau qui met la peur sur les
    // visages, celui du joueur comme ceux du convoi.
    menace = traque || zone.persos.some((p) =>
      p.emotion === EMOTIONS.COLERE && !p.livre && p.aveugle <= 0 && p.alerte > 0);
    if (traque && Math.random() < dt * 6) {
      emettre(joueur.x, joueur.y - D.taille * 0.75, '#ff7a6b', 1, 40, 'trait');
    }

    if (joueur.bonusT > 0) {
      joueur.bonusT -= dt;
      // traînée continue à la couleur du bonus : on voit qu'il est actif même
      // sans regarder la barre du haut
      if (Math.random() < dt * 14) {
        emettre(joueur.x + (Math.random() - 0.5) * D.taille,
                joueur.y + (Math.random() - 0.5) * D.taille,
                BONUS[joueur.bonus].couleur, 1, 18);
      }
      if (joueur.bonusT <= 0) joueur.bonus = null;      // sa jauge se vide, c'est assez
    }

    // Les galets reviennent un par un, au rythme du palier atteint.
    const rang = rangCaillou();
    if (joueur.galets < rang.reserve) {
      joueur.caillouDispo += dt / rang.delai;
      if (joueur.caillouDispo >= 1) { joueur.galets++; joueur.caillouDispo = 0; }
      majBoutons();
    } else joueur.caillouDispo = 0;

    // Livraison : tout membre du convoi qui touche le portail y entre.
    for (const q of zone.persos) {
      if (!q.suit || q.livre) continue;
      if (Math.hypot(zone.sortie.x - q.x, zone.sortie.y - q.y) > zone.sortie.r) continue;
      q.livre = true; q.suit = false;
      zone.sortie.ames++;
      gagnerEclat(10);
      emettre(zone.sortie.x, zone.sortie.y, '#ffe9a8', 16, 110);
      ondes.push({ x: zone.sortie.x, y: zone.sortie.y, r: 0, max: CASE * 2.6, couleur: '#ffe9a8' });
      montrerToast(zone.sortie.ames >= zone.requis
        ? 'Le portail est chargé — entre'
        : `Âme livrée — ${zone.sortie.ames}/${zone.requis}`, '#ffe9a8');
    }

    // On attend que le convoi soit RENTRÉ avant de changer de zone : le joueur
    // arrive au portail en même temps que ses suiveurs, et sans cette attente
    // les âmes amenées en plus du quota restaient dehors et étaient perdues.
    const enAspiration = zone.persos.some((q) => q.suit && !q.livre
      && Math.hypot(zone.sortie.x - q.x, zone.sortie.y - q.y) < CASE * 2.6);
    if (zone.sortie.ames >= zone.requis && !enAspiration &&
        Math.hypot(zone.sortie.x - joueur.x, zone.sortie.y - joueur.y) < zone.sortie.r) {
      ouvrirLeSeuil();
    }
  }

  // « est-ce que ce point est actuellement éclairé » — sert à la mémoire des objets
  function estEclaire(x, y) {
    if (Math.hypot(x - joueur.x, y - joueur.y) < rayonHalo()) return true;
    const portee = porteeFaisceau();
    if (portee && dansLeCone(joueur.x, joueur.y, joueur.regard, x, y, portee, coneFaisceau())
        && vueLibre(joueur.x, joueur.y, x, y)) return true;
    if (prochedUneBraise(x, y, 1) || procheDuneTorche(x, y)) return true;
    // un calmé éclaire en permanence : ce qu'il vise est visible pour toujours
    return zone.persos.some((p) => p.calme
      && dansLeCone(p.x, p.y, p.regard, x, y, D.portee * 5, D.cone)
      && vueLibre(p.x, p.y, x, y));
  }

  // Un caillou part devant toi en arc de cercle et tombe quelques cases plus
  // loin. Les sentinelles qui l'entendent vont VOIR ce que c'était — elles se
  // déplacent vers le bruit sans être alertées. C'est le seul outil du Peureux,
  // et il reste utile jusqu'au bout.
  // visée du caillou : on glisse le doigt depuis le bouton pour choisir la
  // direction et la distance
  const visee = { actif: false, ox: 0, oy: 0, dx: 0, dy: 0, force: 0, id: null };

  function lancerCaillou(angle, portion) {
    if (joueur.galets <= 0) return;
    if (!aBonus('galet')) joueur.galets--;      // poche intarissable
    majBoutons();
    const a = angle === undefined ? joueur.regard : angle;
    const portee = CASE * (1.6 + (portion === undefined ? 1 : portion) * 4.4);
    // il s'arrête au premier mur : un caillou ne traverse pas la pierre
    let d = CASE * 0.4;
    while (d < portee && !solide(Math.floor((joueur.x + Math.cos(a) * d) / CASE),
                                 Math.floor((joueur.y + Math.sin(a) * d) / CASE))) d += CASE * 0.2;
    d = Math.max(CASE * 0.6, d - CASE * 0.25);
    cailloux.push({
      x0: joueur.x, y0: joueur.y,
      x1: joueur.x + Math.cos(a) * d, y1: joueur.y + Math.sin(a) * d,
      x: joueur.x, y: joueur.y, t: 0, duree: 0.34 + d / (CASE * 16),
      rang: rangCaillou(),
    });
  }

  // trajectoire prévue, dessinée pendant la visée
  function dessinerVisee() {
    if (!visee.actif) return;
    const a = Math.atan2(visee.dy, visee.dx);
    const portee = CASE * (1.6 + visee.force * 4.4);
    let d = CASE * 0.4;
    while (d < portee && !solide(Math.floor((joueur.x + Math.cos(a) * d) / CASE),
                                 Math.floor((joueur.y + Math.sin(a) * d) / CASE))) d += CASE * 0.2;
    d = Math.max(CASE * 0.6, d - CASE * 0.25);
    const jx = joueur.x - cam.x, jy = joueur.y - cam.y;
    ctx.save();
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(178,186,204,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 16; i++) {
      const k = i / 16;
      const x = jx + Math.cos(a) * d * k;
      const y = jy + Math.sin(a) * d * k - Math.sin(k * Math.PI) * CASE * 0.55;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
    const cx = jx + Math.cos(a) * d, cy = jy + Math.sin(a) * d;
    ctx.strokeStyle = 'rgba(178,186,204,0.75)';
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(178,186,204,0.25)';
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function majCailloux(dt) {
    for (let i = traces.length - 1; i >= 0; i--) {
      traces[i].t += dt;
      if (traces[i].t >= traces[i].duree) traces.splice(i, 1);
    }
    for (let i = cailloux.length - 1; i >= 0; i--) {
      const c = cailloux[i];
      c.t += dt;
      const k = Math.min(1, c.t / c.duree);
      c.x = c.x0 + (c.x1 - c.x0) * k;
      c.y = c.y0 + (c.y1 - c.y0) * k;
      c.hauteur = Math.sin(k * Math.PI) * CASE * 0.55;     // l'arc de cercle
      if (k < 1) continue;
      cailloux.splice(i, 1);
      toucherLeSol(c);
    }
  }

  // Le caillou retombe. Ce qu'il déclenche dépend du palier atteint, mais le
  // geste, lui, n'a jamais changé depuis la première seconde de jeu.
  function toucherLeSol(c) {
    const r = c.rang;
    const teinte = r.eclate ? '#fff2c4' : r.couve ? '#ffc478' : '#b2bacc';
    ondes.push({ x: c.x1, y: c.y1, r: 0, max: CASE * (r.eclate ? 6 : 3.2), couleur: teinte });
    emettre(c.x1, c.y1, teinte, r.eclate ? 26 : 7, r.eclate ? 200 : 45);

    // Ce que Falot avait laissé dessus reste là un moment : une petite lueur
    // posée, qu'on voit de loin. C'est ce qui rend le jet lisible quand on lance
    // dans le noir, et c'est ce qui attire le regard.
    traces.push({ x: c.x1, y: c.y1, t: 0, duree: r.couve ? 1.2 : 3.4 });

    // il se met à brûler : c'est l'abri du Veilleur, posé à distance
    if (r.couve) zone.braises.push({ x: c.x1, y: c.y1, r: CASE * 2.3, phase: Math.random() * TAU });

    // Un caillou ne fait rien à la pierre saine. Sur une pierre déjà fendue, il
    // finit le travail : c'est le seul moyen d'ouvrir ces passages-là, et ça
    // donne au caillou un usage qui ne dépend d'aucune sentinelle.
    briserAutour(c.x1, c.y1);

    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE) continue;
      const d = Math.hypot(p.x - c.x1, p.y - c.y1);
      // l'éclat aveugle toute la salle, le coup au but n'étourdit que sa cible
      if (r.eclate && d <= CASE * 6) { p.aveugle = 5; p.alerte = 0; p.route = null; continue; }
      if (r.frappe && d <= CASE * 0.85) { p.aveugle = Math.max(p.aveugle, 2.6); p.alerte = 0; p.route = null; continue; }
      if (p.aveugle > 0) continue;                         // déjà étourdie
      // Un caillou s'entend de loin. À cinq cases et demie, on le lançait
      // souvent sans que personne ne bouge, et le leurre passait pour inutile.
      if (d > CASE * 9) continue;
      // ELLE OUBLIE TOUT. Alerte, jauge, poursuite : la pierre efface tout ça et
      // elle part au bruit. Un leurre qui ne marche que sur une sentinelle au
      // repos ne sert à rien au moment où l'on en a besoin.
      p.curiosite = { x: c.x1, y: c.y1 };
      p.curieuxT = 4.8;
      p.alerte = 0;
      p.charge = 0;
      p.enAlerte = false;
      p.route = null;
      emettre(p.x, p.y - D.taille * 0.8, '#b2bacc', 3, 40);
    }
    if (r.eclate) montrerToast('Éclat — les Guets n\'ont plus rien à distinguer');
  }

  /* ==================================================== rendu ============ */

  // La pierre fêlée cède quand un caillou tombe à côté d'elle. Le jet s'arrête
  // toujours AVANT le premier mur, donc viser la fissure fait tomber le caillou
  // sur la case d'à côté : une case de tolérance suffit, et elle évite de
  // demander une précision au pixel.
  function briserAutour(x, y) {
    const cx = Math.floor(x / CASE), cy = Math.floor(y / CASE);
    for (const f of zone.fissures) {
      if (f.casse > 0) continue;
      if (Math.abs(f.cx - cx) + Math.abs(f.cy - cy) > 1) continue;
      f.casse = 0.001;
      zone.mur[f.cy][f.cx] = 0;
      // `solide` vient de changer : les ombres portées des torches et des
      // braises sont à recalculer, exactement comme à l'ouverture d'une porte.
      zone.versionPortes++;
      ondes.push({ x: f.x, y: f.y, r: 0, max: CASE * 2.9, couleur: '#cdd3e0' });
      emettre(f.x, f.y, '#9aa1ac', 24, 140);
      emettre(f.x, f.y, '#6f7686', 14, 70);
    }
  }

  function carreArrondi(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // Un visage = deux yeux, deux sourcils, une bouche, et une seule humeur les
  // accorde tous les trois. Ce sont les SOURCILS qui portent l'expression : la
  // peur, c'est les pointes intérieures relevées et l'œil grand ouvert ;
  // l'acharnement, l'inverse exact, pointes intérieures baissées et œil plissé.
  // Tant que le peureux portait des sourcils d'intrigué, aucune bouche ne
  // pouvait rattraper ça — il avait l'air plus inquiet sans bouche du tout.
  // `recharge` va de 0 à 1 pendant qu'on rallume une âme. On lui verse la
  // lumière dans le corps, par le bas, comme on remplit une lampe : un simple
  // contour sombre au départ, plein et vert à l'arrivée. Sans ça le passage se
  // faisait d'un coup et on ne voyait pas qu'on était en train de réussir.
  function dessinerTete(p, couleur, taille, allume, opacite, humeur, temps, recharge) {
    const affole = humeur === HUMEURS.PEUR;          // le vrai danger
    const inquiet = humeur === HUMEURS.INQUIET;      // la peur au repos
    const peur = affole || inquiet;                  // mêmes yeux, mêmes sourcils
    const acharne = humeur === HUMEURS.ACHARNE;
    const visee = humeur === HUMEURS.VISEE;
    const apaise = humeur === HUMEURS.APAISE;
    const w = taille * p.sx, h = taille * p.sy;
    const arrondi = Math.min(w, h) * 0.32;
    const demi = taille * 0.5;

    ctx.save();
    ctx.translate(p.x - cam.x, p.y - cam.y);
    ctx.globalAlpha = opacite;

    const corps = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    if (allume) {
      corps.addColorStop(0, eclaircir(couleur, 0.42));
      corps.addColorStop(0.55, couleur);
      corps.addColorStop(1, assombrir(couleur, 0.3));
    } else {
      corps.addColorStop(0, '#23232f');
      corps.addColorStop(1, '#12121a');
    }
    ctx.fillStyle = corps;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();

    // le niveau qui monte, découpé par la silhouette du corps
    if (recharge > 0 && recharge < 1) {
      const haut = h / 2 - h * recharge;
      ctx.save();
      carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
      ctx.clip();
      const plein = ctx.createLinearGradient(0, haut, 0, h / 2);
      plein.addColorStop(0, eclaircir(RALLUME, 0.5));
      plein.addColorStop(1, assombrir(RALLUME, 0.18));
      ctx.fillStyle = plein;
      ctx.fillRect(-w / 2, haut, w, h);
      // le ménisque : la ligne vive à la surface, qui dit que ça monte
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-w / 2, haut); ctx.lineTo(w / 2, haut);
      ctx.stroke();
      ctx.restore();
    }

    ctx.strokeStyle = allume ? 'rgba(255,255,255,0.7)' : couleur;
    ctx.lineWidth = allume ? 2 : 1.5;
    ctx.stroke();

    const reflet = ctx.createRadialGradient(-w * 0.2, -h * 0.28, 0, -w * 0.2, -h * 0.28, w * 0.42);
    reflet.addColorStop(0, `rgba(255,255,255,${allume ? 0.45 : 0.1})`);
    reflet.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = reflet;
    carreArrondi(ctx, -w / 2, -h / 2, w, h, arrondi);
    ctx.fill();

    // --- yeux ---
    const ecart = demi * 0.36 * p.sx;
    const oeilY = -demi * 0.14 * p.sy;
    // l'œil s'ouvre grand quand on a peur, se plisse quand on s'acharne
    const rOeil = demi * 0.22 * (peur ? 1.22 : acharne ? 0.94 : apaise ? 0.92 : 1);
    // en visée on ferme un œil : c'est le geste universel de qui ajuste
    const clinDoeil = visee ? 1 : 0;
    const px = Math.cos(p.regard) * rOeil * 0.42;
    const py = Math.sin(p.regard) * rOeil * 0.42;
    const encre = allume ? '#0a0a10' : couleur;
    if (p.aveugle > 0 || p.cligne > 0) {
      // aveuglée : les yeux se ferment. C'est le seul signe qui dit « elle ne
      // te voit plus » — sans lui, l'éclat n'a aucun effet visible.
      ctx.strokeStyle = encre;
      ctx.lineWidth = Math.max(2, demi * 0.12);
      ctx.lineCap = 'round';
      for (const dx of [-ecart, ecart]) {
        ctx.beginPath();
        ctx.arc(dx, oeilY - rOeil * 0.35, rOeil, 0.5, Math.PI - 0.5);
        ctx.stroke();
      }
    } else {
      // La pupille rétrécit dans la peur : c'est ce contraste avec le blanc
      // grand ouvert qui fait l'œil affolé, bien plus que sa taille.
      const rPupille = rOeil * (peur ? 0.36 : acharne ? 0.58 : 0.5);
      // apaisé : l'œil se détend à demi. Pas fermé — fermé, c'est « aveuglé ».
      const hOeil = acharne ? rOeil * 0.62 : apaise ? rOeil * 0.72 : rOeil;
      const frisson = affole ? Math.sin(temps * 17 + (p.tremble || 0)) * rOeil * 0.07 : 0;
      for (const dx of [-ecart, ecart]) {
        if (clinDoeil && dx > 0) {                    // l'œil droit se ferme
          ctx.strokeStyle = encre;
          ctx.lineWidth = Math.max(2, demi * 0.12);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(dx, oeilY - rOeil * 0.35, rOeil, 0.5, Math.PI - 0.5);
          ctx.stroke();
          continue;
        }
        ctx.save();
        ctx.beginPath(); ctx.ellipse(dx, oeilY, rOeil, hOeil, 0, 0, TAU);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.clip();                                   // la pupille reste dans l'œil
        ctx.fillStyle = '#0a0a10';
        ctx.beginPath();
        ctx.arc(dx + px + frisson, oeilY + py, rPupille, 0, TAU);
        ctx.fill();
        ctx.restore();
      }
    }

    // --- sourcils ---
    ctx.strokeStyle = encre;
    ctx.lineWidth = Math.max(2, demi * 0.12);
    ctx.lineCap = 'round';
    const lg = rOeil * 1.15;
    if (apaise) {
      // sourcils hauts, droits et symétriques : ni froncés, ni inquiets.
      // C'est l'absence de tension qui fait lire le calme.
      const sy = oeilY - rOeil * 1.85;
      for (const cote of [-1, 1]) {
        const dx = ecart * cote;
        ctx.beginPath();
        ctx.moveTo(dx - lg * 0.5, sy);
        ctx.quadraticCurveTo(dx, sy - rOeil * 0.3, dx + lg * 0.5, sy);
        ctx.stroke();
      }
    } else if (visee) {
      // un sourcil remonté, l'autre baissé sur l'œil fermé : la concentration
      ctx.beginPath();
      ctx.moveTo(-ecart - lg * 0.5, oeilY - rOeil * 2.1);
      ctx.lineTo(-ecart + lg * 0.5, oeilY - rOeil * 2.35);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ecart - lg * 0.5, oeilY - rOeil * 1.5);
      ctx.lineTo(ecart + lg * 0.5, oeilY - rOeil * 1.25);
      ctx.stroke();
    } else if (peur) {
      // Pointes INTÉRIEURES relevées, extérieures qui tombent, et le tout
      // remonté loin au-dessus de l'œil : c'est le sourcil inquiet.
      const sy = oeilY - rOeil * 1.95;
      for (const cote of [-1, 1]) {
        const dx = ecart * cote;
        ctx.beginPath();
        ctx.moveTo(dx + lg * 0.55 * cote, sy + rOeil * 0.42);   // extérieur, bas
        ctx.quadraticCurveTo(dx, sy - rOeil * 0.1,
                             dx - lg * 0.55 * cote, sy - rOeil * 0.34); // intérieur, haut
        ctx.stroke();
      }
    } else if (acharne) {
      // L'exact miroir : intérieures baissées vers le nez, et posées bas.
      const sy = oeilY - rOeil * 1.35;
      for (const cote of [-1, 1]) {
        const dx = ecart * cote;
        ctx.beginPath();
        ctx.moveTo(dx + lg * 0.55 * cote, sy - rOeil * 0.45);   // extérieur, haut
        ctx.lineTo(dx - lg * 0.55 * cote, sy + rOeil * 0.45);   // intérieur, bas
        ctx.stroke();
      }
    } else {
      // intrigué : l'un levé, l'autre droit — l'asymétrie fait tout
      const sy = oeilY - rOeil * 1.6;
      ctx.beginPath();
      ctx.moveTo(-ecart - lg * 0.5, sy - rOeil * 0.5);
      ctx.lineTo(-ecart + lg * 0.5, sy - rOeil * 0.15);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ecart - lg * 0.5, sy - rOeil * 0.1);
      ctx.lineTo(ecart + lg * 0.5, sy - rOeil * 0.1);
      ctx.stroke();
    }

    // --- bouche ---
    // La bouche ne contredit jamais les sourcils, elle les appuie. Elle reste
    // petite : le personnage fait douze pixels de haut, une grande bouche y
    // devient une tache.
    const by = oeilY + rOeil * 2.4;
    const bl = demi * 0.42;
    ctx.lineWidth = Math.max(1.8, demi * 0.1);
    ctx.strokeStyle = encre;
    ctx.beginPath();
    if (apaise) {
      // le seul sourire du jeu. Il ne s'obtient qu'à l'abri, et il vaut donc
      // quelque chose : un peureux qui sourit tout le temps ne dit plus rien.
      ctx.arc(0, by - bl * 0.5, bl * 0.78, 0.62, Math.PI - 0.62);
    } else if (visee) {
      // bouche poussée sur le côté, comme on mord sa joue en ajustant
      ctx.moveTo(-bl * 0.1, by + bl * 0.06);
      ctx.quadraticCurveTo(bl * 0.22, by + bl * 0.02, bl * 0.46, by - bl * 0.12);
    } else if (affole) {
      // petite bouche ouverte qui tremble
      const t = Math.sin(temps * 18 + (p.tremble || 0)) * demi * 0.03;
      ctx.ellipse(0, by + t, bl * 0.3, bl * 0.4, 0, 0, TAU);
    } else if (inquiet) {
      // sage, à peine tombante : le visage dit l'inquiétude par les sourcils,
      // la bouche ne fait que ne pas la contredire
      ctx.moveTo(-bl * 0.34, by - bl * 0.04);
      ctx.quadraticCurveTo(0, by + bl * 0.1, bl * 0.34, by - bl * 0.04);
    } else if (acharne) {
      ctx.moveTo(-bl * 0.4, by + bl * 0.1);      // trait serré, un rien tombant
      ctx.quadraticCurveTo(0, by - bl * 0.12, bl * 0.4, by + bl * 0.1);
    } else {
      // intrigué : une vaguelette, ni sourire ni moue
      const t = Math.sin(temps * 2.5 + (p.tremble || 0)) * demi * 0.02;
      const w = bl * 0.52, h2 = bl * 0.34;
      ctx.moveTo(-w, by + t);
      ctx.quadraticCurveTo(-w * 0.5, by - h2 + t, 0, by + t);
      ctx.quadraticCurveTo(w * 0.5, by + h2 + t, w, by + t);
    }
    ctx.stroke();
    ctx.restore();
  }

  // Jusqu'où va le regard dans chaque direction du cône : on lance des rayons
  // et on s'arrête au premier mur. Sans ça un cône traversait la pierre et on
  // croyait se faire repérer à travers une cloison — la détection, elle, testait
  // déjà la ligne de vue, mais l'affichage mentait.
  // Un cône coupé par un mur n'est plus convexe, et une rastérisation logicielle
  // paie cher chaque segment. 22 -> 12 rayons : la marche d'escalier reste
  // lisible et le coût de dessin retombe.
  const RAYONS = 12;
  function portéesCone(wx, wy, angle, portee, demiAngle) {
    const out = new Array(RAYONS + 1);
    const pas = CASE * 0.22;
    for (let i = 0; i <= RAYONS; i++) {
      const a = angle - demiAngle + (2 * demiAngle * i) / RAYONS;
      const cx = Math.cos(a), cy = Math.sin(a);
      let d = 0;
      while (d + pas < portee) {
        if (solide(Math.floor((wx + cx * (d + pas)) / CASE), Math.floor((wy + cy * (d + pas)) / CASE))) break;
        d += pas;
      }
      // on s'arrête AVANT la pierre, pas dessus : garder le pas où le mur a été
      // trouvé faisait déborder chaque rayon d'un cran dans le mur
      out[i] = Math.min(d, portee);
    }
    return out;
  }

  // trace le polygone du cône réellement éclairé, en coordonnées écran
  function tracerCone(c, sx, sy, angle, demiAngle, portees) {
    c.beginPath();
    c.moveTo(sx, sy);
    for (let i = 0; i <= RAYONS; i++) {
      const a = angle - demiAngle + (2 * demiAngle * i) / RAYONS;
      c.lineTo(sx + Math.cos(a) * portees[i], sy + Math.sin(a) * portees[i]);
    }
    c.closePath();
  }

  function percerCone(c, wx, wy, angle, portee, demiAngle, force, dejaCalculees) {
    const portees = dejaCalculees || portéesCone(wx, wy, angle, portee, demiAngle);
    const x = wx - cam.x, y = wy - cam.y;
    const g = c.createRadialGradient(x, y, 0, x, y, portee);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.6, `rgba(0,0,0,${force * 0.7})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    tracerCone(c, x, y, angle, demiAngle, portees);
    c.fill();
  }

  // Une source fixe éclaire en rond, mais la pierre l'arrête. Sans occultation,
  // une torche collée à un mur illuminait la salle d'à côté, ce qui trahissait
  // tout le plan sans bouger.
  // Contrairement au cône de détection, on GARDE le pas où la pierre a été
  // touchée : ici on veut voir la face du mur allumée. Un pas vaut un cinquième
  // de case, la lumière mord donc la paroi sans jamais la traverser.
  // 40 rayons laissaient voir les facettes du polygone dans les angles. Pour
  // les sources fixes le calcul est mis en cache, donc la finesse est gratuite ;
  // pour le halo du joueur, qui se recalcule à chaque image, 64 rayons sur un
  // rayon d'une case et demie font environ 500 tests de case — le faisceau en
  // fait déjà autant.
  const RAYONS_ROND = 64;

  // Parcours de grille : on saute de frontière de case en frontière de case, si
  // bien qu'aucune case traversée n'est omise. Un pas fixe, lui, enjambe un coin
  // dès qu'il le rase en diagonale — mesuré au pas de 0,2 case, 7 rayons sur
  // 7680 passaient au travers d'un mur, jusqu'à 1,7 case de pierre.
  // On dépasse la paroi d'un cinquième de case en s'y arrêtant : on veut voir la
  // face du mur allumée, elle serait bizarrement noire sinon. Une case fait au
  // moins une case d'épaisseur, la lumière ne ressort donc jamais de l'autre côté.
  function distanceMur(wx, wy, dx, dy, portee) {
    let cx = Math.floor(wx / CASE), cy = Math.floor(wy / CASE);
    const versX = dx > 0 ? 1 : -1, versY = dy > 0 ? 1 : -1;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const sautX = adx < 1e-9 ? Infinity : CASE / adx;
    const sautY = ady < 1e-9 ? Infinity : CASE / ady;
    let tX = adx < 1e-9 ? Infinity
      : (dx > 0 ? (cx + 1) * CASE - wx : wx - cx * CASE) / adx;
    let tY = ady < 1e-9 ? Infinity
      : (dy > 0 ? (cy + 1) * CASE - wy : wy - cy * CASE) / ady;
    for (let garde = 0; garde < 400; garde++) {
      let t;
      if (tX < tY) { t = tX; cx += versX; tX += sautX; }
      else { t = tY; cy += versY; tY += sautY; }
      if (t >= portee) return portee;
      if (solide(cx, cy)) {
        // Un mur, on en mord la face. Une porte fermée, elle, est un panneau au
        // MILIEU de sa case : la lumière doit aller jusqu'à lui, sinon le
        // battant qui nous barre la route reste dans le noir et on ne comprend
        // pas ce qui nous arrête.
        // La morsure est bornée à la SORTIE de la case touchée (tX et tY
        // pointent déjà la frontière suivante) : un rayon qui ne fait que raser
        // un coin en diagonale n'y parcourt qu'une fraction de case, et une
        // morsure fixe le faisait alors ressortir de l'autre côté — mesuré,
        // 145 rayons sur 7680 filaient ainsi jusqu'à 2,7 cases dans la pierre.
        const porte = zone.porteDe[cy] && zone.porteDe[cy][cx];
        // Une pierre fêlée laisse entrer la lumière plus profond qu'une pierre
        // saine. C'est ce qui rend la fente lisible quand le halo l'atteint — et
        // ça ne l'éclaire toujours pas quand il ne l'atteint pas. Sans cette
        // morsure on ne voyait qu'un liseré du haut de la case.
        const fendue = !porte && zone.fissureDe && zone.fissureDe[cy] && zone.fissureDe[cy][cx];
        return Math.min(t + CASE * (porte ? 0.55 : fendue ? 0.95 : 0.2), tX, tY, portee);
      }
    }
    return portee;
  }

  function portéesRond(wx, wy, portee) {
    const out = new Array(RAYONS_ROND);
    for (let i = 0; i < RAYONS_ROND; i++) {
      const a = (i / RAYONS_ROND) * TAU;
      out[i] = distanceMur(wx, wy, Math.cos(a), Math.sin(a), portee);
    }
    return out;
  }

  // Les torches et les braises ne bougent pas : leur ombre portée ne change que
  // lorsqu'une porte s'ouvre ou se ferme. On la calcule une fois et on la garde,
  // sinon on relancerait quarante rayons par source à chaque image.
  function rayonsSource(src, portee) {
    if (!src.rayons || src.rayonsVersion !== zone.versionPortes) {
      src.rayons = portéesRond(src.x, src.y, portee);
      src.rayonsVersion = zone.versionPortes;
    }
    return src.rayons;
  }

  // le polygone de visibilité, tronqué au rayon courant : une torche qui
  // faiblit rétrécit sans qu'on ait à relancer les rayons
  function tracerRond(c, sx, sy, portees, portee) {
    c.beginPath();
    for (let i = 0; i < RAYONS_ROND; i++) {
      const a = (i / RAYONS_ROND) * TAU;
      const d = Math.min(portees[i], portee);
      const x = sx + Math.cos(a) * d, y = sy + Math.sin(a) * d;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath();
  }

  function percerRond(c, x, y, r, force, portees) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.62, `rgba(0,0,0,${force * 0.88})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    tracerRond(c, x, y, portees, r);
    c.fill();
  }

  function percerDisque(c, x, y, r, force) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${force})`);
    g.addColorStop(0.62, `rgba(0,0,0,${force * 0.88})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }

  // Le sol de TOUTES les cases à l'écran : le voile se charge de ne montrer que
  // ce qui est éclairé. Pas de brouillard de guerre — seule la lumière révèle.
  function dessinerSol(c0x, c1x, c0y, c1y) {
    ctx.fillStyle = '#1a1a26';
    for (let cy = c0y; cy <= c1y; cy++)
      for (let cx = c0x; cx <= c1x; cx++)
        if (!zone.mur[cy][cx]) ctx.fillRect(cx * CASE - cam.x, cy * CASE - cam.y, CASE + 1, CASE + 1);

    // Ces traits soulignent l'ARCHITECTURE, donc ils lisent la pierre seule et
    // pas `solide` : une porte fermée y devenait un mur, et sa case se
    // retrouvait cernée d'un rectangle qui clignotait à chaque ouverture.
    const pierre = (cx, cy) =>
      cx < 0 || cy < 0 || cx >= zone.cols || cy >= zone.lignes || zone.mur[cy][cx] === 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        if (zone.mur[cy][cx]) continue;
        const x = cx * CASE - cam.x, y = cy * CASE - cam.y;
        if (pierre(cx, cy - 1)) { ctx.moveTo(x, y); ctx.lineTo(x + CASE, y); }
        if (pierre(cx, cy + 1)) { ctx.moveTo(x, y + CASE); ctx.lineTo(x + CASE, y + CASE); }
        if (pierre(cx - 1, cy)) { ctx.moveTo(x, y); ctx.lineTo(x, y + CASE); }
        if (pierre(cx + 1, cy)) { ctx.moveTo(x + CASE, y); ctx.lineTo(x + CASE, y + CASE); }
      }
    }
    ctx.stroke();

    // --- les murs fêlés : de la pierre, mais fendue ---
    // Deux fentes claires et un peu de poussière : assez pour qu'on le remarque
    // en passant le halo dessus, pas assez pour que ça ressemble à un objet à
    // ramasser. Une fois cassée, la pierre s'efface en fondu sur la case.
    for (const f of zone.fissures) {
      if (f.cx < c0x - 1 || f.cx > c1x + 1 || f.cy < c0y - 1 || f.cy > c1y + 1) continue;
      const x = f.cx * CASE - cam.x, y = f.cy * CASE - cam.y;
      if (f.casse >= 1) continue;
      if (f.casse > 0) {                      // l'éboulement
        ctx.fillStyle = `rgba(10,10,16,${1 - f.casse})`;
        ctx.fillRect(x, y, CASE + 1, CASE + 1);
        continue;
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(x + 2, y + 2, CASE - 4, CASE - 4);
      ctx.clip();
      // Une vraie toile de fractures, pas deux traits : trois fentes qui
      // traversent la case de haut en bas, leurs branches, et les éclats
      // détachés autour. Deux traits ressemblaient à une décoration ; ça, ça
      // ressemble à de la pierre qui a déjà renoncé.
      const o = Math.sin(f.phase), o2 = Math.cos(f.phase * 1.7);
      const X = (u) => x + CASE * u, Y = (v) => y + CASE * v;
      ctx.beginPath();
      ctx.moveTo(X(0.13), Y(-0.04));
      ctx.lineTo(X(0.31 + o * 0.05), Y(0.25));
      ctx.lineTo(X(0.18), Y(0.52));
      ctx.lineTo(X(0.35 + o2 * 0.05), Y(0.77));
      ctx.lineTo(X(0.24), Y(1.04));
      ctx.moveTo(X(0.53 + o * 0.04), Y(-0.04));
      ctx.lineTo(X(0.43), Y(0.21));
      ctx.lineTo(X(0.61 + o2 * 0.04), Y(0.46));
      ctx.lineTo(X(0.46), Y(0.73));
      ctx.lineTo(X(0.59), Y(1.04));
      ctx.moveTo(X(0.87), Y(-0.04));
      ctx.lineTo(X(0.73 + o * 0.05), Y(0.29));
      ctx.lineTo(X(0.89), Y(0.57));
      ctx.lineTo(X(0.77 + o2 * 0.04), Y(1.04));
      // les branches : c'est elles qui font le réseau
      ctx.moveTo(X(0.31), Y(0.25)); ctx.lineTo(X(0.47), Y(0.14));
      ctx.moveTo(X(0.18), Y(0.52)); ctx.lineTo(X(-0.04), Y(0.61));
      ctx.moveTo(X(0.61), Y(0.46)); ctx.lineTo(X(0.74), Y(0.40));
      ctx.moveTo(X(0.46), Y(0.73)); ctx.lineTo(X(0.29), Y(0.87));
      ctx.moveTo(X(0.89), Y(0.57)); ctx.lineTo(X(1.04), Y(0.65));
      ctx.moveTo(X(0.35), Y(0.77)); ctx.lineTo(X(0.52), Y(0.90));
      // l'ombre de la fente d'abord, le bord éclairé par-dessus : c'est ce qui
      // donne du relief à deux traits
      ctx.strokeStyle = 'rgba(6,6,11,0.85)';
      ctx.lineWidth = 4.5;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(214,220,234,0.5)';
      ctx.lineWidth = 1.7;
      ctx.stroke();
      // les éclats détachés : de petits morceaux qui ne tiennent plus à rien
      const eclats = [[0.24, 0.38, 0.07], [0.68, 0.19, 0.055], [0.40, 0.60, 0.05],
                      [0.80, 0.80, 0.065], [0.12, 0.82, 0.045], [0.63, 0.66, 0.04]];
      for (let i = 0; i < eclats.length; i++) {
        const [u, v, t] = eclats[i];
        const a0 = f.phase + i * 1.1;
        ctx.beginPath();
        ctx.moveTo(X(u + Math.cos(a0) * t), Y(v + Math.sin(a0) * t));
        ctx.lineTo(X(u + Math.cos(a0 + 2.2) * t), Y(v + Math.sin(a0 + 2.2) * t));
        ctx.lineTo(X(u + Math.cos(a0 + 4.3) * t), Y(v + Math.sin(a0 + 4.3) * t));
        ctx.closePath();
        ctx.fillStyle = 'rgba(8,8,14,0.7)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(214,220,234,0.32)';
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
      ctx.restore();
    }

    // --- les battants ---
    for (const pt of zone.portes) {
      if (pt.cx < c0x - 1 || pt.cx > c1x + 1 || pt.cy < c0y - 1 || pt.cy > c1y + 1) continue;
      const x = pt.x - cam.x, y = pt.y - cam.y;
      const demi = CASE * 0.5;
      ctx.save();
      ctx.translate(x, y);
      if (pt.verticale) ctx.rotate(Math.PI / 2);
      // le battant pivote sur son gond : fermé il barre le couloir, ouvert il
      // se range le long de la paroi
      const angle = pt.ouverte * (Math.PI / 2) * 0.92 * (pt.sens || 1);
      ctx.translate(-demi, 0);
      ctx.rotate(angle);
      // Le battant reste dans les gris du décor : une porte en bois clair
      // attirait l'œil comme un objet à ramasser alors que c'est de
      // l'architecture. Seule la poignée a le droit d'être jaune.
      const g = ctx.createLinearGradient(0, -demi * 0.2, 0, demi * 0.2);
      g.addColorStop(0, '#31313d');
      g.addColorStop(1, '#191922');
      ctx.fillStyle = g;
      carreArrondi(ctx, 0, -CASE * 0.11, CASE * 0.96, CASE * 0.22, CASE * 0.06);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.16)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // poignée : elle dit de quel côté ça s'ouvre
      ctx.fillStyle = '#d6ba8c';
      ctx.beginPath();
      ctx.arc(CASE * 0.78, 0, CASE * 0.055, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function dessinerManche() {
    if (!manche.actif) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(manche.ox, manche.oy, RAYON_MANCHE, 0, TAU); ctx.stroke();
    const kx = manche.ox + manche.dx * manche.force * RAYON_MANCHE;
    const ky = manche.oy + manche.dy * manche.force * RAYON_MANCHE;
    const g = ctx.createRadialGradient(kx, ky, 0, kx, ky, 26);
    g.addColorStop(0, rgba(forme().couleur, 0.5));
    g.addColorStop(1, rgba(forme().couleur, 0.06));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(kx, ky, 26, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba(forme().couleur, 0.6);
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(kx, ky, 22, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  // Les rayons d'un cône servaient au voile, à la lueur chaude ET à la jauge :
  // trois lancers identiques par cône et par frame. Mesuré sous throttle ×4,
  // ça coûtait 86 ms de frame contre 44 avant les cônes occultés. On les calcule
  // une fois ici, tout le reste s'en sert. Une portée plus courte se déduit par
  // un simple minimum, sans relancer quoi que ce soit.
  const raccourcir = (portees, portee) => portees.map((d) => Math.min(d, portee));

  function preparerRayons(eclaires, portee, cone) {
    if (portee) joueur.rayons = portéesCone(joueur.x, joueur.y, joueur.regard, portee, cone);
    for (const p of eclaires) {
      p.rayonsRelais = portéesCone(p.x, p.y, p.regard, D.portee * 5, D.cone + 0.05);
    }
    for (const p of zone.persos) {
      p.rayonsVue = null;
      if (p.emotion !== EMOTIONS.COLERE || p.aveugle > 0 || p.cligne > 0) continue;
      const traque = p.alerte > 0 || p.charge > 0.04;
      if (Math.hypot(p.x - joueur.x, p.y - joueur.y) > CASE * (traque ? 8 : 4.2)) continue;
      // hors écran : inutile de lancer les rayons ni de peindre quoi que ce soit
      const ex = p.x - cam.x, ey = p.y - cam.y, marge = PORTEE_VUE;
      if (ex < -marge || ey < -marge || ex > W + marge || ey > H + marge) continue;
      p.rayonsVue = portéesCone(p.x, p.y, p.regard, PORTEE_VUE, 0.42);
    }
  }

  function dessiner(temps, eclaires) {
    const f = forme();
    const r = rayonHalo();
    const portee = porteeFaisceau();
    const cone = coneFaisceau();
    preparerRayons(eclaires, portee, cone);

    ctx.fillStyle = '#08080e';
    ctx.fillRect(0, 0, W, H);

    const c0x = Math.max(0, Math.floor(cam.x / CASE));
    const c1x = Math.min(zone.cols - 1, Math.floor((cam.x + W) / CASE));
    const c0y = Math.max(0, Math.floor(cam.y / CASE));
    const c1y = Math.min(zone.lignes - 1, Math.floor((cam.y + H) / CASE));
    dessinerSol(c0x, c1x, c0y, c1y);

    // --- torches murales ---
    for (const t of zone.torches) {
      if (Math.hypot(t.x - joueur.x, t.y - joueur.y) < CASE * 3) t.vue = true;
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);
      const h = (14 + Math.sin(temps * 9 + t.phase) * 3) * (0.5 + k * 0.5);
      const g = ctx.createRadialGradient(t.x - cam.x, t.y - cam.y, 0, t.x - cam.x, t.y - cam.y, h * 1.9);
      g.addColorStop(0, 'rgba(255,235,190,0.95)');
      g.addColorStop(1, 'rgba(255,140,50,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(t.x - cam.x, t.y - cam.y, h * 1.9, 0, TAU); ctx.fill();
      if (Math.random() < 0.10) emettre(t.x, t.y, '#ffb45c', 1, 26);
    }

    // --- braises ---
    for (const b of zone.braises) {
      const s = 1 + Math.sin(temps * 5 + b.phase) * 0.12;
      const g = ctx.createRadialGradient(b.x - cam.x, b.y - cam.y, 0, b.x - cam.x, b.y - cam.y, 26 * s);
      g.addColorStop(0, 'rgba(255,226,170,0.95)');
      g.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, 26 * s, 0, TAU); ctx.fill();
    }

    // --- sortie ---
    // Un anneau qui se REMPLIT, plus une encoche par âme demandée : on doit
    // pouvoir lire « il m'en manque une » d'un seul coup d'œil, sans compter.
    // La phrase passagère d'une livraison ne suffisait pas, elle s'efface.
    const ouverte = zone.sortie.ames >= zone.requis;
    const part = clamp(zone.sortie.ames / zone.requis, 0, 1);
    const pulse = 1 + Math.sin(temps * 3) * 0.07;
    const R = zone.sortie.r * pulse;
    ctx.save();
    ctx.translate(zone.sortie.x - cam.x, zone.sortie.y - cam.y);
    // le cercle vide, puis la part déjà chargée, en partant du haut
    ctx.strokeStyle = 'rgba(255,233,168,0.18)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
    if (part > 0) {
      ctx.strokeStyle = ouverte ? '#ffe9a8' : 'rgba(255,233,168,0.85)';
      ctx.lineWidth = ouverte ? 4.5 : 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, R, -Math.PI / 2, -Math.PI / 2 + TAU * part);
      ctx.stroke();
      ctx.lineCap = 'butt';
    }
    // les encoches : une par âme demandée, pour compter sans lire
    ctx.strokeStyle = 'rgba(8,8,14,0.85)';
    ctx.lineWidth = 2.5;
    for (let i = 0; i < zone.requis; i++) {
      const a = -Math.PI / 2 + (i / zone.requis) * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * (R - 5), Math.sin(a) * (R - 5));
      ctx.lineTo(Math.cos(a) * (R + 5), Math.sin(a) * (R + 5));
      ctx.stroke();
    }
    ctx.fillStyle = ouverte ? 'rgba(255,233,168,0.34)' : `rgba(255,233,168,${0.05 + part * 0.16})`;
    ctx.beginPath(); ctx.arc(0, 0, zone.sortie.r * 0.5, 0, TAU); ctx.fill();
    // Le compte, écrit SUR le portail. L'anneau dit déjà « il en manque », mais
    // il ne dit pas de quoi : on peut rester devant sans comprendre qu'on le
    // charge avec des âmes. Deux chiffres suffisent à nommer la règle.
    ctx.textAlign = 'center';
    ctx.font = '700 15px system-ui, sans-serif';
    texteCerne(ouverte ? 'ENTRE' : `${zone.sortie.ames} / ${zone.requis}`, 0, -R - 12,
               ouverte ? '#ffe9a8' : 'rgba(255,233,168,0.82)');
    if (!ouverte) {
      ctx.font = '600 9px system-ui, sans-serif';
      texteCerne('ÂMES', 0, -R - 25, 'rgba(255,233,168,0.42)', 2.5);
    }
    ctx.restore();

    // --- lueurs ---
    for (const l of zone.lueurs) {
      if (l.prise) continue;
      const b = BONUS[l.type];
      const s = 1 + Math.sin(temps * 4 + l.phase) * 0.18;
      const g = ctx.createRadialGradient(l.x - cam.x, l.y - cam.y, 0, l.x - cam.x, l.y - cam.y, 13 * s);
      g.addColorStop(0, rgba(b.couleur, 0.95));
      g.addColorStop(1, rgba(b.couleur, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(l.x - cam.x, l.y - cam.y, 13 * s, 0, TAU); ctx.fill();
      ctx.fillStyle = b.couleur;
      ctx.beginPath();
      if (l.type === 'eclat') ctx.arc(l.x - cam.x, l.y - cam.y, 4.5 * s, 0, TAU);
      else {                                   // les spéciales sont des losanges
        const k = 6.5 * s;
        ctx.moveTo(l.x - cam.x, l.y - cam.y - k);
        ctx.lineTo(l.x - cam.x + k, l.y - cam.y);
        ctx.lineTo(l.x - cam.x, l.y - cam.y + k);
        ctx.lineTo(l.x - cam.x - k, l.y - cam.y);
      }
      ctx.fill();
    }

    // --- bonhommes, coléreux au-dessus ---
    const ordre = [...zone.persos].filter((q) => !q.livre).sort((a, b) =>
      (a.emotion === EMOTIONS.COLERE ? 1 : 0) - (b.emotion === EMOTIONS.COLERE ? 1 : 0));
    for (const p of ordre) {
      const couleur = p.calme ? RALLUME : COULEURS[p.emotion];
      const repere = p.emotion === EMOTIONS.COLERE && (p.alerte > 0 || p.charge > 0.04);
      // une âme en train d'être rallumée : on voit le niveau monter en elle
      const recharge = p.emotion === EMOTIONS.COLERE ? 0
        : p.calme ? 1 : clamp((p.compteCalme || 0) / DUREE_CALME, 0, 1);
      dessinerTete(p, couleur, D.taille, p.eclaire || p.calme || repere, 1, p.humeur, temps, recharge);
    }

    // --- ce qu'un Guet a entendu ---
    // Un point d'interrogation au-dessus de la tête. Sans ça on lance un caillou
    // et on ne sait jamais s'il a servi : la seule arme du début n'avait aucune
    // réponse visible.
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.livre || p.curieuxT <= 0) continue;
      const k = clamp(p.curieuxT / 4.5, 0, 1);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '700 23px Georgia, serif';
      texteCerne('?', p.x - cam.x, p.y - cam.y - D.taille * 1.5 + Math.sin(temps * 6) * 3,
                 `rgba(255,214,132,${0.45 + k * 0.5})`, 3.5);
      ctx.restore();
    }

    // --- le joueur : exactement la règle des âmes, pas une autre ---
    // Il court : acharné. Il marche : intrigué. Un rouge cherche, ou on le
    // tient dans un faisceau : peur. Son niveau de forme n'y change rien —
    // une émotion vient de ce qui arrive, pas d'un palier de progression.
    const humeurJoueur = humeurDuJoueur();
    // un bonus actif teinte le corps et, pour « voilé », le rend translucide :
    // c'est ce qui fait comprendre l'effet sans lire un mot
    const teinte = joueur.bonus ? BONUS[joueur.bonus].couleur : f.couleur;
    const opac = aBonus('souffle') ? 0.5 : 1;
    // Pendant la scène d'ouverture il n'est pas encore là : on ne le dessine pas,
    // puis il gonfle depuis rien quand la lumière touche le sol.
    if (eclosion > 0.02) {
      dessinerTete(joueur, teinte, D.taille * 1.06 * eclosion, true, opac * eclosion,
                   humeurJoueur, temps, 0);
    }

    // --- la lumière qui tombe ---
    if (chute && !chute.pose) {
      const cx = chute.x - cam.x, cy = chute.y - cam.y;
      const tr = ctx.createLinearGradient(cx, cy - CASE * 1.1, cx, cy);
      tr.addColorStop(0, 'rgba(143,208,255,0)');
      tr.addColorStop(1, 'rgba(143,208,255,0.28)');
      ctx.fillStyle = tr;
      ctx.fillRect(cx - 2.5, cy - CASE * 1.1, 5, CASE * 1.1);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, CASE * 0.75);
      g.addColorStop(0, 'rgba(198,230,255,0.9)');
      g.addColorStop(0.35, 'rgba(143,208,255,0.42)');
      g.addColorStop(1, 'rgba(143,208,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx, cy, CASE * 0.75, 0, TAU); ctx.fill();
      ctx.fillStyle = '#eaf5ff';
      ctx.beginPath(); ctx.arc(cx, cy, 4.2, 0, TAU); ctx.fill();
    }

    // --- ce que le caillou a laissé là où il est tombé ---
    // La pierre ne brille pas. Ce qui brille, c'est ce que Falot y a laissé en
    // la tenant — et ça fait, quelques secondes, une petite lumière seule dans
    // le noir : le leurre est exactement ça.
    for (const t of traces) {
      const k = 1 - t.t / t.duree;
      const R = CASE * (0.3 + k * 0.55);
      const g = ctx.createRadialGradient(t.x - cam.x, t.y - cam.y, 0, t.x - cam.x, t.y - cam.y, R);
      g.addColorStop(0, rgba(f.couleur, 0.55 * k));
      g.addColorStop(0.5, rgba(f.couleur, 0.2 * k));
      g.addColorStop(1, rgba(f.couleur, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(t.x - cam.x, t.y - cam.y, R, 0, TAU); ctx.fill();
    }

    // --- cailloux en vol : une ombre au sol, le caillou en l'air, et sa lueur ---
    for (const c of cailloux) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(c.x - cam.x, c.y - cam.y, 4, 2, 0, 0, TAU); ctx.fill();
      const hx = c.x - cam.x, hy = c.y - cam.y - c.hauteur;
      const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, CASE * 0.42);
      g.addColorStop(0, rgba(f.couleur, 0.4));
      g.addColorStop(1, rgba(f.couleur, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(hx, hy, CASE * 0.42, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e4e9f5';
      ctx.beginPath(); ctx.arc(hx, hy, 3.6, 0, TAU); ctx.fill();
    }

    // --- ondes de choc ---
    for (const o of ondes) {
      ctx.strokeStyle = rgba(o.couleur, clamp(1 - o.r / o.max, 0, 1) * 0.6);
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(o.x - cam.x, o.y - cam.y, o.r, 0, TAU); ctx.stroke();
    }

    // --- particules ---
    for (const q of particules) {
      const a = clamp(q.vie / q.max, 0, 1);
      ctx.fillStyle = rgba(q.couleur, a * 0.9);
      if (q.forme === 'trait') ctx.fillRect(q.x - cam.x - 1, q.y - cam.y - 4, 2, 8);
      else { ctx.beginPath(); ctx.arc(q.x - cam.x, q.y - cam.y, 2.6 * a + 0.7, 0, TAU); ctx.fill(); }
    }

    /* ---- calque d'obscurité ---- */
    lctx.setTransform(DPR * QLUM, 0, 0, DPR * QLUM, 0, 0);
    lctx.globalCompositeOperation = 'source-over';
    lctx.fillStyle = 'rgba(8,8,14,0.975)';
    lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'destination-out';

    const jx = joueur.x - cam.x, jy = joueur.y - cam.y;
    // Le halo du joueur traversait la pierre comme les torches : on voyait le
    // couloir d'à côté à travers un mur. Il se recalcule à chaque image, lui,
    // puisqu'il se déplace.
    if (r > 1) {
      joueur.rayonsHalo = portéesRond(joueur.x, joueur.y, r);
      percerRond(lctx, jx, jy, r, 1, joueur.rayonsHalo);
    }
    if (portee) percerCone(lctx, joueur.x, joueur.y, joueur.regard, portee, cone, 0.95, joueur.rayons);
    for (const p of eclaires) percerCone(lctx, p.x, p.y, p.regard, D.portee * 5, D.cone + 0.05, 0.85, p.rayonsRelais);
    for (const b of zone.braises)
      percerRond(lctx, b.x - cam.x, b.y - cam.y, b.r, 0.92, rayonsSource(b, b.r));
    // Le caillou en vol et sa trace. Sans ça on lance dans le noir et on ne
    // sait jamais où c'est retombé — or c'est précisément l'information dont on
    // a besoin pour décider par où passer.
    if (chute && !chute.pose) percerDisque(lctx, chute.x - cam.x, chute.y - cam.y, CASE * 1.5, 0.92);
    for (const c of cailloux)
      percerDisque(lctx, c.x - cam.x, c.y - cam.y - c.hauteur, CASE * 0.5, 0.7);
    for (const t of traces) {
      const k = 1 - t.t / t.duree;
      percerDisque(lctx, t.x - cam.x, t.y - cam.y, CASE * (0.45 + k * 0.65), 0.45 + k * 0.45);
    }
    // Un calmé n'est pas qu'un faisceau : son corps et un petit halo restent
    // éclairés, sinon on ne voit qu'un cône sortir du néant.
    for (const p of zone.persos) {
      if (p.calme) percerDisque(lctx, p.x - cam.x, p.y - cam.y, D.taille * 2.1, 0.95);
      // Une sentinelle qui t'a repéré se montre en entier : c'est le signal le
      // plus important du jeu, il ne doit pas rester caché dans le noir.
      // Un Guet qui a entendu quelque chose se montre aussi : c'est la réponse
      // à un caillou, et elle ne doit pas rester dans le noir.
      else if (p.emotion === EMOTIONS.COLERE && (p.alerte > 0 || p.charge > 0.04 || p.curieuxT > 0)) {
        percerDisque(lctx, p.x - cam.x, p.y - cam.y, D.taille * 1.7, 0.95);
      }
    }
    // Une fissure ne s'éclaire PAS toute seule. Elle en avait le droit un temps,
    // parce qu'on ne la voyait pas ; mais une pierre qui brille dans le noir
    // dans un jeu où l'on ne voit que ce qu'on éclaire, ça se remarque tout de
    // suite. C'est le réseau de fractures qui la rend lisible, sous le halo.
    for (const t of zone.torches) {
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);       // elle faiblit en mourant
      percerRond(lctx, t.x - cam.x, t.y - cam.y, t.r * (0.55 + k * 0.45), 0.9,
                 rayonsSource(t, t.r));
    }
    // Le cône d'une sentinelle n'apparaît que DE PRÈS. De loin on ne voit que
    // ses yeux, et on ignore encore si c'est un ami ou une sentinelle : c'est
    // tout le suspense. D'assez près pour réagir, il se montre.
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.aveugle > 0 || p.cligne > 0) continue;
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      const traque = p.alerte > 0 || p.charge > 0.04;
      // Traquée, elle ne se cache plus : son faisceau devient franchement
      // visible et de plus loin. Discrète, elle ne fait que se deviner de près,
      // pour garder le suspense des yeux dans le noir.
      if (!p.rayonsVue) continue;
      const proximite = clamp(1 - (dj - CASE * 2.6) / (CASE * 1.6), 0, 1);
      const force = traque ? 0.72 : 0.14 + proximite * 0.2;
      percerCone(lctx, p.x, p.y, p.regard, PORTEE_VUE, 0.42, force, p.rayonsVue);
    }
    lctx.globalCompositeOperation = 'source-over';

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(lum, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    /* ---- ce qui reste visible par-dessus l'obscurité ---- */
    // On se souvient des OBJETS, jamais du terrain : le fil qu'on a tracé, les
    // lueurs déjà aperçues, la sortie une fois trouvée. Assez pour ne pas être
    // perdu, trop peu pour connaître le plan.
    if (fil.length > 1) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let i = 1; i < fil.length; i++) {
        // un `null` marque une téléportation (mort puis réapparition au seuil) :
        // relier les deux traçait un trait droit à travers les murs
        if (!fil[i] || !fil[i - 1]) continue;
        const t = i / fil.length;
        ctx.strokeStyle = rgba(f.couleur, 0.04 + t * 0.16);
        ctx.lineWidth = 1 + t * 1.6;
        ctx.beginPath();
        ctx.moveTo(fil[i - 1].x - cam.x, fil[i - 1].y - cam.y);
        ctx.lineTo(fil[i].x - cam.x, fil[i].y - cam.y);
        ctx.stroke();
      }
      ctx.restore();
    }

    for (const l of zone.lueurs) {
      if (l.prise || !l.vue) continue;
      ctx.fillStyle = rgba(BONUS[l.type].couleur, 0.42);
      ctx.beginPath(); ctx.arc(l.x - cam.x, l.y - cam.y, 3.2, 0, TAU); ctx.fill();
    }
    for (const b of zone.braises) {
      ctx.strokeStyle = 'rgba(255,196,120,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x - cam.x, b.y - cam.y, 9, 0, TAU); ctx.stroke();
    }

    // Les torches éteintes restent devinables une fois croisées : ce sont des
    // repères, et savoir où rallumer fait partie du jeu.
    for (const t of zone.torches) {
      if (t.reste > 0 || !t.vue) continue;
      ctx.strokeStyle = 'rgba(255,180,92,0.22)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(t.x - cam.x, t.y - cam.y - 7);
      ctx.lineTo(t.x - cam.x, t.y - cam.y + 7);
      ctx.stroke();
    }

    // LES YEUX DANS LE NOIR. La seule chose qu'on distingue d'un inconnu. On
    // garde EXACTEMENT la géométrie des yeux éclairés — blanc de l'œil et
    // pupille décalée par le regard — pour que ce soit le même personnage, juste
    // sans son corps.
    // Mesuré : 57 % des PNJ à l'écran étaient masqués par un mur, ce qui vidait
    // l'effet. À travers une paroi ils restent perceptibles, mais bien plus
    // faibles et de moins loin : on sent une présence, on ne cartographie pas.
    for (const p of zone.persos) {
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      if (p.eclaire || estEclaire(p.x, p.y)) continue;
      if (p.cligne > 0 || p.aveugle > 0) continue;
      // Tous les personnages existent dès la génération de la zone : aucun
      // n'apparaît en cours de route. On montre donc TOUS les yeux présents à
      // l'écran, sans limite de distance — c'est la carte des présences, et
      // c'est ce qui rend le noir habité plutôt que vide.
      const ex = p.x - cam.x, ey = p.y - cam.y;
      if (ex < -CASE || ey < -CASE || ex > W + CASE || ey > H + CASE) continue;
      const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
      const portee = Math.hypot(W, H);

      const demi = D.taille * 0.5;
      const ecart = demi * 0.36;
      const oeilY = -demi * 0.14;
      const rOeil = demi * 0.22;
      const px = Math.cos(p.regard) * rOeil * 0.42;
      const py = Math.sin(p.regard) * rOeil * 0.42;
      const a = (clamp(1 - dj / portee, 0, 1) * 0.5 + 0.35) * (cache ? 0.34 : 1);

      for (const dx of [-ecart, ecart]) {
        const ox = p.x - cam.x + dx, oy = p.y - cam.y + oeilY;
        // la lueur autour de l'œil, qui le fait exister dans le noir
        const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, rOeil * 3.2);
        g.addColorStop(0, `rgba(226,232,246,${a * 0.55})`);
        g.addColorStop(1, 'rgba(226,232,246,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(ox, oy, rOeil * 3.2, 0, TAU); ctx.fill();
        // blanc de l'œil + pupille : la même forme que de jour
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.beginPath(); ctx.arc(ox, oy, rOeil, 0, TAU); ctx.fill();
        ctx.fillStyle = `rgba(10,10,16,${a})`;
        ctx.beginPath(); ctx.arc(ox + px, oy + py, rOeil * 0.5, 0, TAU); ctx.fill();
      }
    }

    // --- les gains qui montent vers la jauge, et les phrases du décor ---
    for (const f of flottants) {
      ctx.save();
      ctx.textAlign = 'center';
      if (f.murmure) {
        // Un murmure apparaît en fondu et repart en fondu : il ne doit jamais
        // « claquer » à l'écran comme une notification.
        const a = clamp(Math.min(f.vie / 1.4, (f.max - f.vie) / 0.5), 0, 1) * 0.92;
        ctx.font = 'italic 400 14px Georgia, serif';
        const lignes = decouper(f.texte, 30);
        // Le bloc se construit VERS LE HAUT depuis son point d'ancrage, et il
        // est ramené dans l'écran : une phrase dite au bord de la carte partait
        // hors cadre, et une phrase dite sous les pieds recouvrait le visage.
        const sx = clamp(f.x - cam.x, 118, W - 118);
        const sy = f.y - cam.y;
        for (let i = 0; i < lignes.length; i++) {
          texteCerne(lignes[i], sx, sy + (i - lignes.length + 1) * 19, rgba(f.couleur, a), 3);
        }
      } else {
        const a = clamp(f.vie / f.max, 0, 1);
        ctx.font = '700 15px system-ui, sans-serif';
        texteCerne(f.texte, f.x - cam.x, f.y - cam.y, rgba(f.couleur, a), 3);
      }
      ctx.restore();
    }

    // La jauge de chaque sentinelle, dessinée DANS son cône : il se remplit
    // depuis la pointe tant qu'on est dedans, et se vide dès qu'on en sort.
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.charge <= 0.01) continue;
      const portee = PORTEE_VUE * p.charge;
      const g = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, portee);
      g.addColorStop(0, `rgba(255,60,50,${0.06 + p.charge * 0.14})`);
      g.addColorStop(0.72, `rgba(255,66,52,${0.12 + p.charge * 0.3})`);
      g.addColorStop(1, `rgba(255,86,66,${0.2 + p.charge * 0.45})`);
      const pj = p.rayonsVue ? raccourcir(p.rayonsVue, portee)
                             : portéesCone(p.x, p.y, p.regard, portee, 0.42);
      // Le front n'est plus un trait : le dégradé s'assombrit vers l'extérieur,
      // donc la limite se lit comme une zone dense qui avance vers toi. Tout
      // reste du faisceau, rien n'est un contour.
      ctx.fillStyle = g;
      tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, 0.42, pj);
      ctx.fill();
    }
    if (zone.sortie.vue) {
      ctx.strokeStyle = ouverte ? 'rgba(255,233,168,0.65)' : 'rgba(255,233,168,0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(zone.sortie.x - cam.x, zone.sortie.y - cam.y, zone.sortie.r * pulse, 0, TAU);
      ctx.stroke();
      // une fois le quota atteint, une flèche au bord de l'écran pour ne pas
      // finir la zone à errer
      if (ouverte) flecheVers(zone.sortie.x, zone.sortie.y, '#ffe9a8', temps);
    }

    /* ---- halo chaud ---- */
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const couleurLumiere = joueur.bonus ? BONUS[joueur.bonus].couleur : f.couleur;
    const chaud = ctx.createRadialGradient(jx, jy, 0, jx, jy, r);
    chaud.addColorStop(0, rgba(couleurLumiere, 0.16));
    chaud.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = chaud;
    tracerRond(ctx, jx, jy, joueur.rayonsHalo, r);
    ctx.fill();

    if (portee) {
      const gf = ctx.createRadialGradient(jx, jy, 0, jx, jy, portee);
      gf.addColorStop(0, rgba(couleurLumiere, 0.14));
      gf.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gf;
      tracerCone(ctx, jx, jy, joueur.regard, cone, joueur.rayons);
      ctx.fill();
    }
    for (const b of zone.braises) {
