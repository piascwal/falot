<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lux &amp; Paranoia</title>
<meta name="description" content="Aventure procédurale dans le noir : un petit peureux n'a qu'un caillou, et escorte des âmes jusqu'au portail sans croiser les regards rouges.">
<meta name="theme-color" content="#08080e">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    background: #08080e;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e8e8f0;
    -webkit-user-select: none;
    user-select: none;
  }

  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  /* ---- interface ---- */

  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: max(0.7rem, env(safe-area-inset-top)) 0.8rem 0.7rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    pointer-events: none;
    z-index: 10;
  }

  .hud > * { pointer-events: auto; }

  .back {
    color: rgba(232, 232, 240, 0.55);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.35rem 0.55rem;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.05);
  }

  .zone {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(232, 232, 240, 0.4);
    font-variant-numeric: tabular-nums;
  }

  .btn {
    font: inherit;
    font-size: 0.85rem;
    color: #e8e8f0;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
    cursor: pointer;
  }

  .btn:active { background: rgba(255, 255, 255, 0.14); }

  /* Les âmes livrées, en pastilles : « il m'en manque une » se lit d'un coup
     d'œil, alors qu'un « 1/3 » se compte. La même idée que l'anneau du portail,
     pour l'avoir sous les yeux même quand le portail est hors champ. */
  .ames {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    margin-left: 0.55rem;
  }

  .ames i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 233, 168, 0.5);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .ames i.pleine {
    background: #ffe9a8;
    box-shadow: 0 0 7px rgba(255, 233, 168, 0.8);
  }

  .jauge {
    margin-left: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }

  .jauge-mots { display: flex; align-items: baseline; gap: 0.4rem; }

  .forme {
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
    transition: color 0.4s ease;
  }

  /* la forme suivante, en creux : c'est elle qui donne un sens à la barre */
  .suite {
    font-style: normal;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: rgba(232, 232, 240, 0.32);
  }

  .barre {
    width: 148px;
    height: 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.13);
    overflow: hidden;
  }

  .barre i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 999px;
    box-shadow: inset 0 0 7px rgba(255, 255, 255, 0.45);
    transition: width 0.18s linear, background 0.4s ease;
  }

  /* toute la jauge encaisse le gain, pas seulement la barre : sur un grand
     écran le léger sursaut d'un trait de 7 px passait complètement inaperçu */
  @keyframes jaugeSursaut {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.07); }
    100% { transform: scale(1); }
  }

  .jauge.pulse { animation: jaugeSursaut 0.45s ease-out; transform-origin: right center; }

  /* la barre encaisse le gain : sans ça on ne fait pas le lien entre la lueur
     ramassée en bas de l'écran et la jauge en haut */
  @keyframes jaugePulse {
    0%   { transform: scale(1);            filter: brightness(1); }
    30%  { transform: scale(1.14, 1.5);    filter: brightness(1.9); }
    100% { transform: scale(1);            filter: brightness(1); }
  }

  .barre.pulse { animation: jaugePulse 0.45s ease-out; }

  /* bonus temporaire en cours */
  /* Le bonus : même barre, même largeur totale, mais son nom à gauche sur la
     même ligne. Empilé entre les deux barres il paraissait posé dessus. */
  .bonus {
    display: none;
    align-items: center;
    gap: 0.45rem;
    width: 148px;
  }

  .bonus.on { display: flex; }

  .bonus b {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .bonus .barre { flex: 1; height: 8px; }

  .bonus s {
    display: block;
    height: 3px;
    width: 46px;
    border-radius: 999px;
    background: currentColor;
    opacity: 0.55;
  }

  /* le bouton d'action : il n'y en a qu'un, et il ne change jamais */
  .actions {
    position: fixed;
    right: max(0.9rem, env(safe-area-inset-right));
    bottom: max(1.4rem, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column-reverse;
    gap: 0.6rem;
    z-index: 12;
  }

  .rond {
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid;
    background: rgba(255, 255, 255, 0.06);
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.07em;
    display: none;
    cursor: pointer;
    font-family: inherit;
    line-height: 1.25;
  }

  .rond.on { display: block; }
  .rond:disabled { opacity: 0.34; }
  /* anneau de recharge : sans lui, un bouton indisponible ressemble à un bouton
     cassé — c'est la même sensation que « ça ne marche pas » */
  .rond::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: conic-gradient(currentColor calc(var(--recharge, 1) * 360deg), transparent 0);
    opacity: 0.18;
    pointer-events: none;
  }

  /* `manipulation` laisse le navigateur revendiquer un glissement comme un
     défilement : il envoyait un pointercancel dès le premier mouvement, et la
     visée mourait avant qu'on ait pu orienter quoi que ce soit. Ce bouton-ci
     se garde le geste entier. */
  #caillou { border-color: rgba(178, 186, 204, 0.55); color: #b2bacc; touch-action: none; }

  /* Le caillou vient d'apprendre quelque chose. Une modale coupait le jeu pour
     le dire ; le bouton le dit tout seul, en prenant la couleur de la forme et
     en pulsant deux fois. On ne lit pas, on voit. */
  @keyframes caillouEvolue {
    0%   { transform: scale(1);    box-shadow: 0 0 0 0 currentColor; }
    18%  { transform: scale(1.22); box-shadow: 0 0 26px 8px currentColor; }
    45%  { transform: scale(1);    box-shadow: 0 0 0 0 currentColor; }
    63%  { transform: scale(1.14); box-shadow: 0 0 20px 5px currentColor; }
    100% { transform: scale(1);    box-shadow: 0 0 0 0 currentColor; }
  }

  #caillou.evolue { animation: caillouEvolue 1.5s ease-out; }

  /* un halo permanent, d'autant plus marqué que la forme est haute : le bouton
     porte la progression, elle n'a pas besoin d'être annoncée */
  #caillou { box-shadow: 0 0 var(--aura, 0px) rgba(255, 255, 255, 0.18); }

  .rond:active:not(:disabled) { background: rgba(255, 255, 255, 0.16); }


  /* bandeau passager : il informe sans arrêter le jeu */
  /* Le bandeau passager tenait dans une pastille à bord coloré, sur une seule
     ligne : ça jurait avec tout le reste, et ça débordait de l'écran d'un
     téléphone dès que la phrase dépassait cinq mots. C'est désormais la même
     voix que les murmures du décor : de l'écriture posée sur le noir. */
  .toast {
    position: fixed;
    left: 50%;
    /* Tout en haut, juste sous le bandeau d'état. Les murmures du décor montent
       depuis les objets et occupent la bande centrale ; deux textes de la même
       voix qui se chevauchent, on ne lit plus ni l'un ni l'autre. La caméra ne
       laisse jamais le joueur monter aussi haut, donc cette bande est libre. */
    top: 9%;
    transform: translateX(-50%);
    width: min(20rem, calc(100vw - 3rem));
    text-align: center;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 0.97rem;
    line-height: 1.5;
    color: #c6ccd8;
    text-shadow: 0 2px 12px rgba(6, 7, 12, 0.96), 0 0 24px rgba(6, 7, 12, 0.9);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 14;
  }

  .toast.on { opacity: 1; }
  /* passé son moment, la phrase reste lisible mais s'efface au second plan */
  .toast.on.pale { opacity: 0.42; transition: opacity 1.4s ease; }

  /* L'écran-titre. UN seul bouton : « Descendre ». On ne demande pas au joueur
     s'il veut apprendre un jeu qu'il n'a pas encore vu — la question avoue la
     faiblesse, et celui qui répond « non » en voudra au jeu. Le saut n'apparaît
     qu'à qui a déjà fini l'étage 1 : c'est le traitement qu'un prologue
     mérite. */
  .titre {
    position: fixed;
    inset: 0;
    z-index: 24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    text-align: center;
    padding: 2rem 1.6rem;
    background: radial-gradient(120% 90% at 50% 45%, #14141d 0%, #06060a 70%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .titre.on { opacity: 1; pointer-events: auto; }
  .titre em { font-style: normal; font-size: 0.68rem; letter-spacing: 0.22em;
              text-transform: uppercase; color: rgba(255, 233, 168, 0.5); }
  .titre strong { font-size: 2.1rem; letter-spacing: 0.02em; color: #ffe9a8;
                  text-shadow: 0 0 28px rgba(255, 200, 110, 0.28); }
  .titre p { max-width: 21rem; font-size: 0.85rem; line-height: 1.55;
             color: rgba(232, 232, 240, 0.5); margin: 0.2rem 0 1.1rem; }
  .titre .btn { font-size: 1rem; padding: 0.6rem 2.1rem; letter-spacing: 0.08em; }
  .titre .lien { font: inherit; font-size: 0.78rem; margin-top: 0.6rem;
                 background: none; border: 0; cursor: pointer;
                 color: rgba(232, 232, 240, 0.35);
                 text-decoration: underline; text-underline-offset: 3px; }
  .titre .lien[hidden] { display: none; }

  /* Le seul arrêt qu'on s'autorise avant la première image : deux lignes, pas
     de bouton, ça s'efface tout seul. Inside, Limbo, Journey ouvrent ainsi. */
  .ouverture {
    position: fixed;
    inset: 0;
    z-index: 23;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    text-align: center;
    padding: 2rem;
    background: #05050a;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }

  .ouverture.on { opacity: 1; pointer-events: auto; }
  .ouverture b { font-weight: 400; font-size: 0.95rem; font-family: Georgia, serif;
                 font-style: italic; color: rgba(232, 232, 240, 0.4);
                 opacity: 0; transition: opacity 1.4s ease; }
  .ouverture b.vu { opacity: 1; }
  .ouverture b + b { font-size: 1.35rem; color: rgba(255, 233, 168, 0.75); }

  /* le récit de la cage : deux à quatre phrases, sur un arrêt déjà prévu */
  .recit { max-width: 21rem; font-size: 0.82rem !important; line-height: 1.6;
           font-family: Georgia, serif; font-style: italic;
           color: rgba(232, 232, 240, 0.48) !important; margin: 0.5rem 0 0.2rem; }

  /* La cage d'escalier, seul écran plein du jeu. Le bandeau modal qui servait
     à l'évolution et au passage de zone a disparu : l'un se dit par le bouton
     caillou, l'autre par cette carte. */
  .cage {
    position: fixed;
    inset: 0;
    z-index: 21;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    text-align: center;
    padding: 1.6rem;
    background: rgba(8, 8, 14, 0.9);
    backdrop-filter: blur(7px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }

  .cage.on { opacity: 1; pointer-events: auto; }
  .cage em { font-style: normal; font-size: 0.7rem; letter-spacing: 0.16em;
             text-transform: uppercase; color: rgba(255, 233, 168, 0.55); }
  .cage strong { font-size: 1.7rem; color: #ffe9a8; letter-spacing: 0.02em; }
  .cage p { font-size: 0.85rem; color: rgba(232, 232, 240, 0.55); margin-top: 0.2rem; }

  /* le puits : les étages empilés, le plus bas d'abord en bas */
  .puits {
    display: flex;
    flex-direction: column-reverse;
    gap: 5px;
    width: min(19rem, 100%);
    margin: 0.7rem 0 0.2rem;
    max-height: 46vh;
    overflow-y: auto;
  }

  .etage {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.42rem 0.6rem;
    border-radius: 3px;
    border: 1px solid rgba(255, 233, 168, 0.13);
    background: rgba(255, 233, 168, 0.03);
  }

  .etage .no {
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: rgba(232, 232, 240, 0.35);
    min-width: 2.1rem;
    text-align: left;
  }

  /* les âmes remontées à cet étage */
  .etage .ames { display: flex; gap: 3px; flex-wrap: wrap; }
  .etage .ames i {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 6px rgba(255, 233, 168, 0.85);
  }

  /* franchi : on l'a vidé, il est éclairé derrière soi */
  .etage.franchi { border-color: rgba(255, 233, 168, 0.4); background: rgba(255, 233, 168, 0.09); }
  /* celui où l'on arrive */
  .etage.ici { border-color: rgba(143, 208, 255, 0.6); background: rgba(143, 208, 255, 0.1); }
  .etage.ici .no { color: #8fd0ff; }
  /* au-dessus : on ne sait pas combien il en reste */
  .etage.noir { border-style: dashed; border-color: rgba(232, 232, 240, 0.13); background: none; }
  .etage.noir .no { color: rgba(232, 232, 240, 0.22); }
  /* chaque étage inconnu est un peu plus effacé : le puits se perd vers le haut */
  .etage.noir:nth-last-child(2) { opacity: 0.6; }
  .etage.noir:nth-last-child(1) { opacity: 0.3; }

  .etage .mention {
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    color: rgba(232, 232, 240, 0.3);
  }
</style>
</head>
<body>

<canvas id="jeu"></canvas>

<div class="hud">
  <a class="back" href="../index.html" aria-label="Retour au hub">←</a>
  <span class="zone" id="zone">ZONE 1</span>
  <span class="ames" id="ames" aria-label="âmes livrées"></span>
  <!-- La jauge de confiance. Elle était un trait de 80 px sans légende : sur un
       grand écran on ramassait des lueurs sans voir qu'on remplissait quoi que
       ce soit, ni vers quoi. Elle dit maintenant d'où l'on part et où l'on va. -->
  <span class="jauge" id="jauge">
    <span class="jauge-mots">
      <b class="forme" id="forme">Peureux</b>
      <em class="suite" id="forme-suite"></em>
    </span>
    <span class="barre"><i id="barre"></i></span>
    <!-- Le bonus en cours, juste en dessous et sur UNE seule ligne : son nom
         coincé entre les deux barres semblait posé dessus. -->
    <span class="bonus" id="bonus">
      <b id="bonus-nom"></b>
      <span class="barre" id="bonus-barre"><i id="bonus-jauge"></i></span>
    </span>
  </span>
</div>



<div class="actions">
  <button type="button" class="rond on" id="caillou">CAILLOU<br><span id="caillou-n">1</span></button>
</div>


<div class="toast" id="toast"></div>

<!-- L'écran-titre et l'écran noir d'ouverture. Ils ne servent qu'une fois par
     partie : passé le premier Seuil, le jeu ne s'arrête plus. -->
<div class="titre" id="titre">
  <em>Les Dessous</em>
  <strong>Lux &amp; Paranoïa</strong>
  <p>Falot est la plus petite lampe d'ici. Il ne se souvient pas de qui il
     éclairait — seulement que quelqu'un, quelque part, avait moins peur grâce
     à lui.</p>
  <button type="button" class="btn" id="titre-descendre">Descendre</button>
  <button type="button" class="lien" id="titre-plus-haut" hidden>Passer le prologue — reprendre à l'étage 2</button>
</div>

<div class="ouverture" id="ouverture">
  <b id="ouverture-1">Une lumière qui s'éteint ne disparaît pas.</b>
  <b id="ouverture-2">Elle tombe.</b>
</div>

<!-- La cage d'escalier. Les Dessous sont un bâtiment : la lumière y tombe, et
     sortir c'est monter. Cet écran n'est pas une barre de progression, c'est un
     appel des noms — on y voit s'accumuler les âmes remontées, étage par étage,
     et le noir au-dessus dont on ignore la hauteur. -->
<div class="cage" id="cage">
  <em id="cage-sur">Seuil franchi</em>
  <strong id="cage-titre"></strong>
  <div class="puits" id="puits"></div>
  <p id="cage-bilan"></p>
  <p class="recit" id="cage-recit"></p>
  <button type="button" class="btn" id="cage-ok">Monter</button>
</div>

<script>
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function grainDepuisTexte(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }

  // Coupe une phrase en lignes courtes, sans couper les mots. Les murmures sont
  // dessinés dans le monde : une ligne trop longue sortirait de l'écran.
  function decouper(texte, max) {
    const mots = texte.split(' ');
    const out = [];
    let ligne = '';
    for (const m of mots) {
      if (ligne && (ligne + ' ' + m).length > max) { out.push(ligne); ligne = m; }
      else ligne = ligne ? ligne + ' ' + m : m;
    }
    if (ligne) out.push(ligne);
    return out;
  }

  function ecartAngle(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  function melange(hex, vers, t) {
    const n = parseInt(hex.slice(1), 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
      .map((v) => Math.round(v + (vers - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  const eclaircir = (hex, t) => melange(hex, 255, t);
  const assombrir = (hex, t) => melange(hex, 0, t);
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };

  /* ==================================================== formes =========== */

  // Une forme = une couleur, un halo, et EXACTEMENT UN verbe de plus. C'est la
  // règle : on ne découvre jamais deux mécaniques à la fois, sinon on n'en
  // comprend aucune.
  // Les seuils tiennent dans UNE zone, puisqu'on repart peureux à chaque fois.
  // Ils sont calés sur le PLAFOND réellement mesuré d'une zone — tout ramasser,
  // tout calmer, tout livrer : 108 en zone 1, 122 en zone 3, 177 en zone 6.
  // On montait quatre formes en une poignée de secondes ; chaque palier demande
  // maintenant un vrai bout de zone (25 %, 50 %, 80 % du plafond de la zone 1).
  // Solaire est au-delà du plafond des deux premières zones : c'est une
  // récompense de fin d'aventure, pas un passage obligé. Premier calage tenté à
  // 30/70/120/180 : Ardent passait au-dessus du plafond de la zone 1 et Solaire
  // au-dessus de celui de la zone 6 — deux formes purement décoratives.
  const FORMES = [
    { nom: 'Peureux', couleur: '#8fd0ff', seuil: 0, halo: 1.00, portee: 0, cone: 0,
      verbe: 'Le caillou',
      texte: "Tu n'as qu'un halo minuscule — mais tu peux lancer un caillou devant toi. La pierre ne brille pas ; ce que tu as laissé dessus, si. Là où elle tombe, une autre petite lumière apparaît, et les Guets vont la voir. C'est toute ton arme." },
    { nom: 'Curieux', couleur: '#ffd479', seuil: 26, halo: 1.28, portee: 5.2, cone: 0.34,
      verbe: 'Le faisceau',
      texte: "Un faisceau s'ouvre devant toi. Il porte loin, et il réveille les autres : un bonhomme éclairé relaie ta lumière avec son regard." },
    { nom: 'Veilleur', couleur: '#a8f0c8', seuil: 55, halo: 1.45, portee: 6.0, cone: 0.32,
      verbe: 'Le caillou couve',
      texte: "Ton caillou ne retombe plus éteint : là où il tombe, il se met à brûler pour toujours. Dans cette lumière-là tu n'as plus la forme qu'un regard cherche — tu poses tes abris à distance." },
    { nom: 'Ardent', couleur: '#ff9a6b', seuil: 88, halo: 1.62, portee: 7.0, cone: 0.30,
      verbe: 'Le caillou frappe',
      texte: "Vise un rouge, touche-le : il est étourdi et perd ta trace. Ce n'est plus seulement un leurre, c'est de quoi ouvrir un passage à ton convoi." },
    { nom: 'Solaire', couleur: '#fff2c4', seuil: 128, halo: 1.9, portee: 8.2, cone: 0.30,
      verbe: 'Le caillou éclate',
      texte: "À l'impact, le caillou se brise en un éclat qui aveugle tous les Guets autour du point de chute : plus rien à distinguer, ni lumière ni noir. Un seul lancer, et toute une salle cesse de te chercher." },
  ];

  // Tout le jeu tient sur UN bouton. Chaque forme ne donne pas un nouveau verbe
  // à apprendre : elle enrichit le seul geste qu'on connaît déjà. La réserve
  // grossit et le délai fond à chaque palier — c'est la progression qu'on sent
  // en jouant, avant même de lire ce que le caillou fait de plus.
  const CAILLOU = [
    { reserve: 1, delai: 2.6 },
    { reserve: 2, delai: 1.9 },
    { reserve: 2, delai: 1.5, couve: true },
    { reserve: 3, delai: 1.2, couve: true, frappe: true },
    { reserve: 3, delai: 0.9, couve: true, frappe: true, eclate: true },
  ];
  const rangCaillou = () => CAILLOU[joueur.niveau];

  const EMOTIONS = { PEUR: 'peur', COLERE: 'colere', CURIEUX: 'curieux' };

  // Un visage ne dit pas QUI on est, il dit CE QUI SE PASSE. Trois humeurs, la
  // même règle pour le joueur et pour les âmes qu'il escorte : on court, on
  // marche, ou quelque chose nous a repérés. Avant, le peureux portait des
  // sourcils d'intrigué en permanence et on ne lisait plus rien sur lui.
  // INQUIET est la peur au repos : mêmes sourcils relevés, mêmes grands yeux,
  // mais la bouche reste sage. La bouche ouverte qui tremble est réservée au
  // vrai danger — sans cette nuance, un peureux tranquille hurlait en
  // permanence et on ne voyait plus arriver le moment qui compte.
  const HUMEURS = { PEUR: 'peur', INQUIET: 'inquiet', INTRIGUE: 'intrigue',
                    ACHARNE: 'acharne', VISEE: 'visee', APAISE: 'apaise' };

  // Le vert d'une âme rallumée. Nommé une fois : il sert au corps qui se
  // remplit, au personnage une fois calmé, et à ses particules.
  const RALLUME = '#a8f0c8';

  // Le temps qu'il faut pour rallumer une âme. C'est aussi la durée pendant
  // laquelle on VOIT son corps se remplir : la barre de chargement, c'est elle.
  const DUREE_CALME = 1.1;
  // moitié de la vitesse de pointe du joueur : au-delà, on court vraiment
  const SEUIL_COURSE = 150;
  // `calme` distingue le repos serein du repos inquiet : une âme qu'on n'a pas
  // encore apprivoisée reste sur ses gardes.
  const humeurSelon = (p, menace, calme) => menace ? HUMEURS.PEUR
    : Math.hypot(p.vx, p.vy) > SEUIL_COURSE ? HUMEURS.ACHARNE
    : calme ? HUMEURS.INTRIGUE : HUMEURS.INQUIET;
  // Le joueur a peur des mêmes choses que ses âmes, plus une : sentir sa propre
  // lumière se faire manger. Et viser au caillou passe avant tout le reste :
  // c'est un geste volontaire, il mérite son visage à lui.
  // L'ABRI PASSE AVANT TOUT. Se tenir dans la lumière d'une torche ou d'une
  // braise coupe la détection, mais rien ne le disait : on continuait à jouer
  // la peur au ventre sans savoir qu'on ne risquait plus rien. C'est la seule
  // fois du jeu où Falot sourit, et ça se lit même avec un rouge en alerte à
  // deux pas — c'est précisément là que l'information a de la valeur.
  const humeurDuJoueur = () => joueur.abri ? HUMEURS.APAISE
    : visee.actif ? HUMEURS.VISEE
    : humeurSelon(joueur, menace || joueur.vu > 0.15 || joueur.souffle < 0.45,
                  joueur.niveau > 0);
  const COULEURS = {
    [EMOTIONS.PEUR]: '#8fd0ff',
    [EMOTIONS.COLERE]: '#ff7a6b',
    [EMOTIONS.CURIEUX]: '#ffd479',
  };

  // Les lueurs à effet. Chacune n'apparaît qu'à partir d'une forme donnée :
  // on n'introduit jamais un bonus avant que le joueur ait digéré le précédent.
  // Chaque bonus porte sa propre phrase : un nom seul ne dit rien. Et chacun se
  // VOIT sur le personnage — couleur du corps, du halo, particules — parce que
  // le mot dans la barre du haut n'est pas là où le joueur regarde.
  const BONUS = {
    eclat:   { couleur: '#ffe9a8', forme: 0, duree: 0,  nom: 'Lueur',
               phrase: '' },
    // Les trois bonus parlent tous d'ESCORTE, sinon on les ramasse sans rien
    // sentir. Voilé cache le convoi entier, Hâte presse le convoi entier, et
    // Galet rend la poche intarissable le temps de dégager une route.
    galet:   { couleur: '#b2bacc', forme: 0, duree: 6,  nom: 'Poche',
               phrase: 'Poche intarissable — lance sans compter' },
    souffle: { couleur: '#8fd0ff', forme: 1, duree: 7,  nom: 'Voilé',
               phrase: 'Voilé — ton convoi entier devient invisible' },
    hate:    { couleur: '#a8f0c8', forme: 2, duree: 8,  nom: 'Hâte',
               phrase: 'Hâte — tout le convoi file plus vite' },
  };

  /* ==================================================== le monde ========= */

  // Côté d'une case, en pixels monde. Le baisser revient à filmer de plus haut :
  // tout le jeu est exprimé en CASE, donc les proportions et les distances de
  // détection ne bougent pas d'un pouce — seul le cadrage s'élargit.
  const CASE = 62;                 // côté d'une case de la grille, en pixels monde

  // Portée du regard d'une sentinelle. Ramenée de 4.6 à 3.6 cases : elle
  // accrochait de trop loin. Mais l'essentiel est ailleurs — c'est la VITESSE
  // de verrouillage qui décroît avec la distance (voir majRegles), comme dans
  // un Metal Gear : au bord du cône elle te soupçonne, elle ne te tient pas.
  const PORTEE_VUE = CASE * 3.6;

  // Un personnage, quel qu'il soit. Extrait du générateur parce que les étages
  // écrits à la main ont besoin d'en poser exactement les mêmes : un PNJ du
  // premier étage doit obéir aux mêmes règles que ceux des étages suivants,
  // sinon l'étage 1 n'enseigne pas le jeu qu'on va jouer ensuite.
  // `fabriqueRonde` est appelée EN DERNIER, comme dans la version d'origine :
  // l'ordre des tirages décide des plans, et le changer regénérerait un autre
  // monde pour une graine donnée.
  function nouveauPerso(x, y, emotion, rnd, fabriqueRonde) {
    const regard = rnd() * TAU;
    const p = {
      x, y, baseX: x, baseY: y, vx: 0, vy: 0,
      sx: 1, sy: 1, vsx: 0, vsy: 0,
      regard, regardRepos: regard,
      balayage: (rnd() < 0.5 ? 1 : -1) * (0.35 + rnd() * 0.5),
      amplitude: 0.5 + rnd() * 0.9,
      phase: rnd() * TAU,
      emotion,
      eclaire: false, calme: false, suit: false, livre: false, rang: 0,
      aDit: false,                   // a-t-elle déjà dit qu'elle était vide ?
      prime: false,                  // a-t-elle déjà payé son calmage ?
      aveugle: 0, compteCalme: 0,
      tremble: rnd() * TAU, humeur: HUMEURS.INTRIGUE, fuit: 0,
      alerte: 0, etape: 0, charge: 0, route: null, immobile: 0, bouscule: 0,
      curiosite: null, curieuxT: 0,
      // Les sentinelles clignent des yeux : quelques dixièmes de seconde
      // où elles ne voient rien. C'est ce qui rend l'observation des yeux
      // dans le noir réellement utile, et donne une fenêtre pour passer.
      cligne: 0, prochainCligne: 1.5 + rnd() * 3.5,
      ronde: [],
    };
    p.ronde = fabriqueRonde ? fabriqueRonde() : [];
    return p;
  }

  // Une zone est un plan de salles reliées par des couloirs. C'est volontairement
  // une grille : la seule chose à garantir ici, c'est « peut-on aller d'ici à
  // là », et sur une grille un parcours en largeur y répond exactement.
  function construireZone(rnd, numero) {
    const cols = 15 + Math.min(6, numero);
    const lignes = 20 + Math.min(8, numero * 2);
    const mur = [];
    for (let y = 0; y < lignes; y++) mur.push(new Array(cols).fill(1));

    const salles = [];
    const vise = 6 + Math.min(5, Math.floor(numero * 0.8));
    for (let essai = 0; essai < 220 && salles.length < vise; essai++) {
      const w = 3 + Math.floor(rnd() * 4);
      const h = 3 + Math.floor(rnd() * 4);
      const x = 1 + Math.floor(rnd() * (cols - w - 2));
      const y = 1 + Math.floor(rnd() * (lignes - h - 2));
      const chevauche = salles.some((s) =>
        x < s.x + s.w + 1 && x + w + 1 > s.x && y < s.y + s.h + 1 && y + h + 1 > s.y);
      if (chevauche) continue;
      salles.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
    }
    if (salles.length < 3) return null;

    for (const s of salles) {
      for (let y = s.y; y < s.y + s.h; y++)
        for (let x = s.x; x < s.x + s.w; x++) mur[y][x] = 0;
    }

    const couloir = (a, b) => {
      let x = a.cx, y = a.cy;
      while (x !== b.cx) { mur[y][x] = 0; x += x < b.cx ? 1 : -1; }
      while (y !== b.cy) { mur[y][x] = 0; y += y < b.cy ? 1 : -1; }
      mur[y][x] = 0;
    };
    for (let i = 1; i < salles.length; i++) couloir(salles[i - 1], salles[i]);
    // deux raccourcis : sans ça le plan est un couloir unique et se parcourt bêtement
    for (let i = 0; i < 2; i++) {
      const a = salles[Math.floor(rnd() * salles.length)];
      const b = salles[Math.floor(rnd() * salles.length)];
      if (a !== b) couloir(a, b);
    }

    return { mur, cols, lignes, salles };
  }

  // Parcours en largeur sur les cases libres. Exact, et c'est tout l'intérêt :
  // ce que la génération promet, on le vérifie vraiment.
  // `sansPortes` sert aux sentinelles : elles ne franchissent AUCUNE porte,
  // ouverte ou fermée, donc leur monde s'arrête à ces cases-là. Sans cette
  // option elles calculeraient des rondes qui traversent une porte et iraient
  // pousser contre le battant jusqu'à la fin des temps.
  function distances(z, depart, sansPortes) {
    const { mur, cols, lignes } = z;
    const portes = sansPortes ? z.porteDe : null;
    const d = [];
    for (let y = 0; y < lignes; y++) d.push(new Array(cols).fill(-1));
    if (mur[depart.cy][depart.cx]) return d;
    d[depart.cy][depart.cx] = 0;
    const file = [depart.cx, depart.cy];
    for (let i = 0; i < file.length; i += 2) {
      const x = file[i], y = file[i + 1];
      for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
        if (nx < 0 || ny < 0 || nx >= cols || ny >= lignes) continue;
        if (portes && portes[ny][nx]) continue;
        if (mur[ny][nx] || d[ny][nx] !== -1) continue;
        d[ny][nx] = d[y][x] + 1;
        file.push(nx, ny);
      }
    }
    return d;
  }

  function genererZone(grainTexte, numero, formeJoueur) {
    const base = grainDepuisTexte(grainTexte);
    // types de lueurs disponibles à ce stade de la progression
    const types = Object.keys(BONUS).filter((k) => BONUS[k].forme <= formeJoueur);

    for (let variante = 0; variante < 30; variante++) {
      const rnd = mulberry32(base + variante * 7919 + numero * 104729);
      const z = construireZone(rnd, numero);
      if (!z) continue;

      const depart = z.salles[0];
      const d = distances(z, depart);

      let sortie = null, loin = -1;
      for (const s of z.salles) {
        if (d[s.cy][s.cx] > loin) { loin = d[s.cy][s.cx]; sortie = s; }
      }
      if (!sortie || loin < 12) continue;

      const lueurs = [];
      for (const s of z.salles) {
        if (s === depart) continue;
        const combien = 2 + Math.floor(rnd() * 3);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;
          // une lueur sur cinq est spéciale, tirée parmi ce qui est débloqué
          const special = types.length > 1 && rnd() < 0.22;
          const type = special ? types[1 + Math.floor(rnd() * (types.length - 1))] : 'eclat';
          lueurs.push({ x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE, type, prise: false, vue: false, phase: rnd() * TAU });
        }
      }
      if (lueurs.length < 14) continue;

      // PORTES. On ne les met que dans les couloirs, à la bouche d'une salle :
      // une case libre hors salle, avec exactement deux voisines libres et
      // opposées (donc un vrai couloir, pas un carrefour), dont l'une est dans
      // la salle. Fermée, elle coupe le regard d'une sentinelle qui balaye le
      // couloir — c'est là tout son intérêt : un abri qui existe sans lumière.
      const dansUneSalle = (cx, cy) => z.salles.some((s) =>
        cx >= s.x && cx < s.x + s.w && cy >= s.y && cy < s.y + s.h);
      const libreEn = (cx, cy) =>
        cx >= 0 && cy >= 0 && cx < z.cols && cy < z.lignes && !z.mur[cy][cx];
      const portes = [];
      const candidates = [];
      for (let cy = 1; cy < z.lignes - 1; cy++) {
        for (let cx = 1; cx < z.cols - 1; cx++) {
          if (z.mur[cy][cx] || d[cy][cx] < 0 || dansUneSalle(cx, cy)) continue;
          const h = [libreEn(cx - 1, cy), libreEn(cx + 1, cy)];
          const v = [libreEn(cx, cy - 1), libreEn(cx, cy + 1)];
          const nb = h.filter(Boolean).length + v.filter(Boolean).length;
          if (nb !== 2) continue;                       // carrefour ou cul-de-sac
          const couloirH = h[0] && h[1], couloirV = v[0] && v[1];
          if (!couloirH && !couloirV) continue;         // coude : le battant n'a pas d'axe
          const touche = couloirH
            ? dansUneSalle(cx - 1, cy) || dansUneSalle(cx + 1, cy)
            : dansUneSalle(cx, cy - 1) || dansUneSalle(cx, cy + 1);
          if (!touche) continue;                        // pas à la bouche d'une salle
          candidates.push({ cx, cy, couloirH });
        }
      }
      // Écartées les unes des autres, et jamais sur le seuil ni sur le portail :
      // une porte collée au départ enferme, une porte sur la sortie bloque la fin.
      const interdit = (cx, cy) =>
        (Math.abs(cx - depart.cx) <= 1 && Math.abs(cy - depart.cy) <= 1)
        || (Math.abs(cx - sortie.cx) <= 1 && Math.abs(cy - sortie.cy) <= 1);
      for (let k = candidates.length - 1; k > 0; k--) {   // mélange déterministe
        const j = Math.floor(rnd() * (k + 1));
        [candidates[k], candidates[j]] = [candidates[j], candidates[k]];
      }
      const maxPortes = 3 + Math.min(5, numero);
      for (const c of candidates) {
        if (portes.length >= maxPortes) break;
        if (interdit(c.cx, c.cy)) continue;
        if (portes.some((q) => Math.abs(q.cx - c.cx) + Math.abs(q.cy - c.cy) < 3)) continue;
        portes.push({
          cx: c.cx, cy: c.cy,
          x: (c.cx + 0.5) * CASE, y: (c.cy + 0.5) * CASE,
          // le couloir est horizontal -> le battant barre verticalement
          verticale: c.couloirH,
          ouverte: 0, sens: 1, phase: rnd() * TAU,
        });
      }

      // table de consultation : `solide` est appelé des milliers de fois par
      // image, il ne peut pas parcourir une liste à chaque fois. Elle est posée
      // sur `z` AVANT les personnages : c'est elle qui dit aux rondes des
      // sentinelles où elles n'ont pas le droit d'aller.
      const porteDe = [];
      for (let y = 0; y < z.lignes; y++) porteDe.push(new Array(z.cols).fill(null));
      for (const pt of portes) porteDe[pt.cy][pt.cx] = pt;
      z.porteDe = porteDe;

      // On pose d'abord les PLACES, on décide la composition ensuite. Tirer
      // l'émotion place par place ne garantissait rien : une zone pouvait naître
      // avec une seule âme à calmer — le portail en réclamait alors plus qu'il
      // n'en existait — ou, après qu'on eut écarté ces variantes-là, sans la
      // moindre sentinelle, c'est-à-dire sans le moindre danger.
      const places = [];
      for (const s of z.salles) {
        if (s === depart) continue;
        const combien = 1 + Math.floor(rnd() * 2);
        for (let i = 0; i < combien; i++) {
          const cx = s.x + Math.floor(rnd() * s.w);
          const cy = s.y + Math.floor(rnd() * s.h);
          if (d[cy][cx] < 0) continue;
          places.push({ cx, cy });
        }
      }
      // Il faut de quoi tenir les deux quotas à la fois. Sous ce seuil la zone
      // est trop peu peuplée pour être intéressante : variante suivante.
      const MINI_AMES = 4, MINI_ROUGES = 2;
      if (places.length < MINI_AMES + MINI_ROUGES) continue;

      // mélange déterministe, puis quotas garantis avant de compléter au hasard
      for (let k = places.length - 1; k > 0; k--) {
        const j = Math.floor(rnd() * (k + 1));
        [places[k], places[j]] = [places[j], places[k]];
      }
      const douces = [EMOTIONS.PEUR, EMOTIONS.CURIEUX];
      const reste = numero === 1
        ? [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE]
        : [EMOTIONS.PEUR, EMOTIONS.CURIEUX, EMOTIONS.COLERE, EMOTIONS.COLERE];
      const emotions = places.map((_, i) =>
        i < MINI_AMES ? douces[Math.floor(rnd() * douces.length)]
        : i < MINI_AMES + MINI_ROUGES ? EMOTIONS.COLERE
        : reste[Math.floor(rnd() * reste.length)]);

      const persos = [];
      {
        for (let iPlace = 0; iPlace < places.length; iPlace++) {
          const { cx, cy } = places[iPlace];
          const emotion = emotions[iPlace];
          persos.push(nouveauPerso((cx + 0.5) * CASE, (cy + 0.5) * CASE, emotion, rnd,
            // Points de ronde. Ils doivent être NETTEMENT écartés du poste et
            // les uns des autres : tirés sans distance minimale, ils pouvaient
            // tomber tous les trois dans la case de la sentinelle. Elle
            // « arrivait » alors à chaque frame, passait au point suivant, et
            // ne bougeait jamais — une sentinelle sur 29 restait ainsi plantée.
            () => {
              const pts = [];
              // Son monde s'arrête aux portes : un point de ronde de l'autre
              // côté d'un battant la ferait pousser contre le bois sans fin.
              // Le parcours part de SON poste, pas du seuil de la zone, puisque
              // les portes découpent le plan en quartiers.
              const sien = emotion === EMOTIONS.COLERE
                ? distances(z, { cx, cy }, true) : d;
              const loinDeTout = (ox, oy) => {
                if (Math.hypot(ox - cx, oy - cy) < 1.8) return false;
                return pts.every((q) => Math.hypot(ox - q.cx, oy - q.cy) >= 1.8);
              };
              for (let k = 0; k < 40 && pts.length < 3; k++) {
                const ox = cx + Math.floor(rnd() * 11) - 5;
                const oy = cy + Math.floor(rnd() * 11) - 5;
                if (ox < 0 || oy < 0 || ox >= z.cols || oy >= z.lignes) continue;
                if (z.mur[oy][ox] || sien[oy][ox] < 0) continue;
                if (!loinDeTout(ox, oy)) continue;
                pts.push({ cx: ox, cy: oy, x: (ox + 0.5) * CASE, y: (oy + 0.5) * CASE });
              }
              // moins de deux points utilisables : elle tient son poste et
              // balaye, ce qui est un garde statique parfaitement lisible
              return pts.length >= 2 ? pts : [];
            }));
        }
      }

      const joignable = (p) => {
        const cx = Math.floor(p.x / CASE), cy = Math.floor(p.y / CASE);
        return d[cy] && d[cy][cx] >= 0;
      };
      if (!lueurs.every(joignable)) continue;

      // Filet de sécurité : les quotas sont déjà garantis plus haut, mais une
      // place peut être perdue en chemin. Une zone sans assez d'âmes est
      // infinissable, une zone sans sentinelle est sans danger.
      const calmables = persos.filter((q) => q.emotion !== EMOTIONS.COLERE).length;
      if (calmables < MINI_AMES) continue;
      if (persos.length - calmables < MINI_ROUGES) continue;

      // Torches fixées aux murs : gratuites mais temporaires, contrairement aux
      // braises qu'on porte. En passant devant, on les allume pour un moment.
      const torches = [];
      for (const sl of z.salles) {
        for (let essai = 0; essai < 14 && torches.length < 3 + numero; essai++) {
          const cx = sl.x + Math.floor(rnd() * sl.w);
          const cy = sl.y + Math.floor(rnd() * sl.h);
          if (z.mur[cy][cx] || d[cy][cx] < 0) continue;
          // il faut un mur juste à côté : une torche se fixe à une paroi
          const cotes = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([ox, oy]) => {
            const nx = cx + ox, ny = cy + oy;
            return nx < 0 || ny < 0 || nx >= z.cols || ny >= z.lignes || z.mur[ny][nx];
          });
          if (!cotes.length) continue;
          const [ox, oy] = cotes[Math.floor(rnd() * cotes.length)];
          torches.push({
            x: (cx + 0.5 + ox * 0.36) * CASE,
            y: (cy + 0.5 + oy * 0.36) * CASE,
            r: CASE * 2.1, duree: 26, reste: 0, phase: rnd() * TAU,
          });
          break;
        }
      }

      // MURS FÊLÉS. De la pierre d'un seul rang entre deux endroits déjà
      // atteignables, mais LOIN l'un de l'autre par le chemin normal. Les
      // casser ouvre un raccourci et jamais un passage obligatoire : la zone
      // reste finissable par quelqu'un qui n'a pas compris le caillou.
      const fissures = [];
      {
        const candidates = [];
        for (let cy = 1; cy < z.lignes - 1; cy++) {
          for (let cx = 1; cx < z.cols - 1; cx++) {
            if (!z.mur[cy][cx] || porteDe[cy][cx]) continue;
            for (const [[ax, ay], [bx, by]] of
                 [[[cx - 1, cy], [cx + 1, cy]], [[cx, cy - 1], [cx, cy + 1]]]) {
              if (z.mur[ay][ax] || z.mur[by][bx]) continue;
              if (d[ay][ax] < 0 || d[by][bx] < 0) continue;
              const gain = Math.abs(d[ay][ax] - d[by][bx]);
              if (gain < 6) continue;                              // pas un vrai raccourci
              candidates.push({ cx, cy, gain });
              break;
            }
          }
        }
        for (let k = candidates.length - 1; k > 0; k--) {
          const j = Math.floor(rnd() * (k + 1));
          [candidates[k], candidates[j]] = [candidates[j], candidates[k]];
        }
        const maxF = 1 + Math.min(2, Math.floor(numero / 2));
        for (const c of candidates) {
          if (fissures.length >= maxF) break;
          if (Math.abs(c.cx - depart.cx) + Math.abs(c.cy - depart.cy) < 3) continue;
          if (Math.abs(c.cx - sortie.cx) + Math.abs(c.cy - sortie.cy) < 3) continue;
          if (fissures.some((q) => Math.abs(q.cx - c.cx) + Math.abs(q.cy - c.cy) < 4)) continue;
          fissures.push({
            cx: c.cx, cy: c.cy, x: (c.cx + 0.5) * CASE, y: (c.cy + 0.5) * CASE,
            casse: 0, phase: rnd() * TAU, gain: c.gain,
          });
        }
      }

      const fissureDe = [];
      for (let cy = 0; cy < z.lignes; cy++) fissureDe.push(new Array(z.cols).fill(null));
      for (const f of fissures) fissureDe[f.cy][f.cx] = f;

      return {
        ...z, numero, grain: grainTexte, lueurs, persos, torches, portes, porteDe,
        fissures, fissureDe,
        versionPortes: 0,
        braises: [],
        // Réservés aux étages écrits à la main. Vides ici, mais présents : le
        // reste du jeu les parcourt sans avoir à demander de quel type de zone
        // il s'agit.
        reprises: [], murmures: [],
        depart: { x: (depart.cx + 0.5) * CASE, y: (depart.cy + 0.5) * CASE },
        // Le portail ne compte plus des lueurs mais des ÂMES : il faut lui
        // amener des bonhommes calmés. Les lueurs redeviennent ce qu'elles
        // auraient toujours dû être — du carburant, pas un objectif.
        sortie: { x: (sortie.cx + 0.5) * CASE, y: (sortie.cy + 0.5) * CASE, r: CASE * 0.55,
                  vue: false, ames: 0 },
        // Nombre d'âmes à livrer. Il en reste toujours au moins une de rab :
        // une âme rattrapée par un rouge panique et redevient à calmer, et on
        // ne doit jamais se retrouver coincé pour autant.
        requis: Math.max(2, Math.min(calmables - 1, 2 + Math.floor(numero / 2))),
        largeur: z.cols * CASE, hauteur: z.lignes * CASE, longueur: loin,
      };
    }
    return null;
  }

  /* ============================================ les étages écrits ======== */

  // L'étage 1 n'est pas un tutoriel : c'est le premier étage du vrai jeu, écrit
  // à la main pour que sa GÉOGRAPHIE enseigne. Aucun panneau, aucune question
  // posée au joueur — une salle, un problème, une seule issue.
  //
  //   #  mur         .  sol          @  départ       S  Seuil
  //   o  lueur       g  poche de cailloux           T  torche
  //   b  Frileux     r  Guet         %  mur fêlé (à casser au caillou)
  //   |  porte (battant vertical)    =  porte (battant horizontal)
  //   *  point de reprise            1-9  murmure
  //
  // Déplacer une lettre suffit à retoucher le niveau : rien ici n'est du code.
  const ETAGES_ECRITS = {
    1: {
      carte: [
        '#########################',   //  0
        '##############.........##',   //  1   la salle de la torche
        '##...#########.........##',   //  2
        '##.@..o.o.o.o.*8.......##',   //  3   le réveil, puis le couloir des lueurs
        '##.6.#########.........##',   //  4
        '###%##########.........##',   //  5   la pierre fendue, sous la salle du réveil
        '##.g.#########...T2....##',   //  6   la niche, et la poche de cailloux qu'on y trouve
        '##################*######',   //  7
        '##################=######',   //  8
        '############......1....##',   //  9   le Guet nommé, et ce que fait le caillou
        '############..r........##',   // 10   la SALLE du premier Guet : de la place pour lancer
        '############...........##',   // 11
        '############...........##',   // 12
        '##################=######',   // 13
        '##############....*....##',   // 14   la salle du Frileux qu'on ne peut pas aider
        '##############.......b.##',   // 15
        '##############.........##',   // 16
        '######.......|.*.......##',   // 17   le couloir calme, et sa porte
        '######=##################',   // 18
        '##....*.########......###',   // 19
        '##......##5T####......###',   // 20   l'alcôve de la torche, sur le trajet de l'escorte
        '##..S...|o.o.or|*.....###',   // 21   le Seuil, les fragments, le Guet de l'escorte
        '##....4.####..##....b.###',   // 22   le renfoncement de la première âme, sous le nez du Guet
        '##......####.b##......###',   // 23
        '#########################',   // 24
      ],
      // Une ronde par « r », dans l'ordre de lecture de la carte. Écrites et non
      // tirées : un premier étage doit se relire à l'identique d'une partie sur
      // l'autre, sinon on ne peut ni l'équilibrer ni le déboguer.
      rondes: [
        [[13, 10], [21, 12], [14, 12]],   // celui de la salle la balaye en entier
        [[9, 21], [13, 21]],           // celui de l'escorte fait l'aller-retour du couloir
      ],
      murmures: {
        '1': 'En bas, un Guet. Ton caillou garde un peu de toi : là où il tombe, il fait une autre petite lumière — et c\'est elle qu\'il ira voir.',
        '2': 'Un Guet ne voit pas les corps. Il cherche une petite lumière seule dans le noir. Dans une plus grande que lui, il ne distingue plus rien.',
        '4': 'Sortir, c\'est monter. Mais un Seuil ne s\'ouvre pas avec une clé : il cède quand assez d\'âmes se tiennent dedans.',
        '5': 'Tant que la flamme tient, il ne te voit pas. Ni toi, ni ceux qui se serrent contre toi.',
        '6': 'Le mur, juste en dessous, est fendu. Un caillou suffirait.',
        '8': 'Un brandon mort au mur, laissé par qui passait avant toi. Ce qu\'il te reste de lumière suffit à le reprendre.',
      },
      // Deux âmes, et les deux sont dans la même salle, au bout du couloir des
      // fragments. Elles ont d'abord été posées aux deux bouts du niveau : il
      // fallait alors retraverser la moitié de l'étage pour la seconde, et ce
      // demi-tour ne se devinait pas — rien sur le chemin ne le demandait.
      // Le Frileux de la salle 5 reste donc ce qu'il est : la démonstration
      // qu'il manque quelque chose. On peut revenir le chercher une fois le
      // faisceau ouvert, personne n'y oblige.
      requis: 2,
    },
  };

  // Lit une carte écrite et rend exactement la même structure de zone que le
  // générateur : lumière, portes, détection et convoi ne savent pas — et n'ont
  // pas à savoir — si le plan a été tiré ou dessiné.
  function zoneEcrite(numero) {
    const modele = ETAGES_ECRITS[numero];
    if (!modele) return null;
    const src = modele.carte;
    const lignes = src.length, cols = src[0].length;
    // Une graine fixe : elle ne décide d'aucun plan, seulement des déphasages
    // d'animation. Écrite en dur pour que l'étage soit identique à chaque essai.
    const rnd = mulberry32(0x1EC7);

    const mur = [];
    const lueurs = [], torches = [], portes = [], reprises = [], murmures = [];
    const bleus = [], rouges = [], fissures = [];
    let depart = null, sortie = null;
    for (let cy = 0; cy < lignes; cy++) {
      const rang = new Array(cols).fill(1);
      for (let cx = 0; cx < cols; cx++) {
        const c = src[cy][cx];
        if (c === '#') continue;
        // Un mur fêlé RESTE de la pierre : il barre le passage, il arrête la
        // lumière et le parcours en largeur ne le traverse pas. Il ne devient un
        // couloir qu'une fois cassé.
        if (c === '%') { fissures.push({ cx, cy }); continue; }
        rang[cx] = 0;                       // tout ce qui n'est pas mur est sol
        const x = (cx + 0.5) * CASE, y = (cy + 0.5) * CASE;
        if (c === '@') depart = { cx, cy };
        else if (c === 'S') sortie = { cx, cy };
        else if (c === 'o') lueurs.push({ x, y, type: 'eclat', prise: false, vue: false, phase: rnd() * TAU });
        else if (c === 'g') lueurs.push({ x, y, type: 'galet', prise: false, vue: false, phase: rnd() * TAU });
        else if (c === 'T') torches.push({ cx, cy });
        else if (c === 'b') bleus.push({ cx, cy });
        else if (c === 'r') rouges.push({ cx, cy });
        else if (c === '*') reprises.push({ x, y, pris: false });
        else if (c === '|' || c === '=') portes.push({
          cx, cy, x, y, verticale: c === '|', ouverte: 0, sens: 1, phase: rnd() * TAU,
        });
        else if (c >= '1' && c <= '9') murmures.push({ x, y, texte: modele.murmures[c], dit: false });
      }
      mur.push(rang);
    }
    if (!depart || !sortie) return null;

    const z = { mur, cols, lignes, salles: [] };
    const fissuresPosees = fissures.map(({ cx, cy }) =>
      ({ cx, cy, x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE, casse: 0, phase: rnd() * TAU }));
    // table de consultation : `distanceMur` est appelée des milliers de fois par
    // image, elle ne peut pas parcourir une liste à chaque rayon
    const fissureDe = [];
    for (let cy = 0; cy < lignes; cy++) fissureDe.push(new Array(cols).fill(null));
    for (const f of fissuresPosees) fissureDe[f.cy][f.cx] = f;
    const porteDe = [];
    for (let cy = 0; cy < lignes; cy++) porteDe.push(new Array(cols).fill(null));
    for (const pt of portes) porteDe[pt.cy][pt.cx] = pt;
    z.porteDe = porteDe;

    // Une torche se fixe à une paroi : on cherche le mur voisin et on décale le
    // brandon vers lui, exactement comme le fait le générateur.
    const torchesPosees = torches.map(({ cx, cy }) => {
      const cotes = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([ox, oy]) => {
        const nx = cx + ox, ny = cy + oy;
        return nx < 0 || ny < 0 || nx >= cols || ny >= lignes || mur[ny][nx];
      });
      const [ox, oy] = cotes.length ? cotes[0] : [0, 0];
      return {
        x: (cx + 0.5 + ox * 0.36) * CASE, y: (cy + 0.5 + oy * 0.36) * CASE,
        r: CASE * 2.1, duree: 26, reste: 0, phase: rnd() * TAU,
      };
    });

    const persos = [];
    for (const b of bleus) {
      persos.push(nouveauPerso((b.cx + 0.5) * CASE, (b.cy + 0.5) * CASE, EMOTIONS.PEUR, rnd, null));
    }
    rouges.forEach((r, i) => {
      const pts = (modele.rondes[i] || []).map(([cx, cy]) =>
        ({ cx, cy, x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE }));
      persos.push(nouveauPerso((r.cx + 0.5) * CASE, (r.cy + 0.5) * CASE, EMOTIONS.COLERE, rnd, () => pts));
    });

    const d = distances(z, depart);
    return {
      ...z, numero, grain: 'ÉCRIT-' + numero,
      lueurs, persos, torches: torchesPosees, portes, porteDe,
      fissures: fissuresPosees, fissureDe,
      versionPortes: 0, braises: [],
      reprises, murmures,
      depart: { x: (depart.cx + 0.5) * CASE, y: (depart.cy + 0.5) * CASE },
      sortie: { x: (sortie.cx + 0.5) * CASE, y: (sortie.cy + 0.5) * CASE, r: CASE * 0.55,
                vue: false, ames: 0 },
      requis: modele.requis,
      largeur: cols * CASE, hauteur: lignes * CASE,
      longueur: d[sortie.cy][sortie.cx],
    };
  }

  /* ==================================================== état ============= */

  const canvas = document.getElementById('jeu');
  const ctx = canvas.getContext('2d');

  // Le calque d'obscurité n'est que du dégradé : demi-résolution, invisible à
  // l'œil et quatre fois moins cher à rastériser.
  const QLUM = 0.5;
  const lum = document.createElement('canvas');
  const lctx = lum.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  // Le dernier palier passe sous le pixel d'écran : sur une machine qui peine,
  // mieux vaut une image légèrement floue qu'une image en retard.
  const PALIERS = [2, 1.5, 1, 0.8];
  let palier = 0, fenetre = [];

  let zone = null;
  const cam = { x: 0, y: 0 };
  let particules = [];
  let ondes = [];                  // ondes de choc de la charge et de l'éclat
  let cailloux = [];               // les cailloux en vol
  // Ce que Falot laisse sur le caillou. La pierre ne brille pas — c'est la
  // règle — mais il la tient dans la main, et un peu de lui reste dessus. En
  // vol ça se voit à peine ; là où elle tombe, ça fait pendant quelques secondes
  // une petite lumière seule dans le noir, c'est-à-dire exactement ce qu'un Guet
  // passe son existence à attendre. Le leurre n'a jamais eu d'autre mécanique.
  let traces = [];                 // { x, y, t, duree }
  let fil = [];                    // la trace du joueur : sa seule mémoire du terrain
  let flottants = [];              // les « +4 » qui montent d'une lueur ramassée
  // La vidange au Seuil : Falot donne au portail tout ce qu'il a retrouvé. On
  // le VOIT partir — sinon la règle la plus dure du jeu (repartir peureux) ne
  // ressemble qu'à une remise à zéro arbitraire.
  let vidange = null;              // { t, duree, eclat0, suivante }
  // La scène d'ouverture. « Elle tombe », dit l'écran noir : alors on la voit
  // tomber. Une petite lumière bleue traverse le plafond, touche le sol, et
  // Falot est là — il regarde à gauche, à droite, et seulement après il peut
  // partir. Tant que la scène dure, il n'existe pas : ni corps, ni halo.
  let chute = null;                // { t, x, y, y0, pose }
  let eclosion = 1;                // 0 = Falot n'est pas encore là, 1 = il y est
  const CHUTE = { tombe: 1.5, pose: 0.5, gauche: 0.8, droite: 0.8, fin: 0.45 };
  // Les étages déjà vidés, et combien d'âmes y sont remontées. C'est la seule
  // chose que Falot garde d'une zone à l'autre — d'où la carte.
  let montee = [];                 // [{ etage, ames }]
  let menace = false;              // un rouge cherche, ou un faisceau nous tient

  const joueur = {
    x: 0, y: 0, vx: 0, vy: 0,
    sx: 1, sy: 1, vsx: 0, vsy: 0,
    regard: -Math.PI / 2,
    eclat: 0, sommet: 0, niveau: 0,
    souffle: 1, repit: 0, vu: 0,
    tremble: 0,                    // sans lui, sin(temps + undefined) = NaN et
                                   // la bouche du joueur ne se dessinait pas
    galets: 1,                     // cailloux en poche
    caillouDispo: 1,               // fraction de recharge du prochain galet
    bonus: null, bonusT: 0,
  };

  // Joystick flottant : il naît sous le doigt, où qu'on le pose.
  const manche = { actif: false, ox: 0, oy: 0, dx: 0, dy: 0, force: 0, id: null };
  // Au clavier, les flèches valent un joystick poussé à fond. Elles ne passent
  // pas par `manche` : sinon le cercle du joystick s'afficherait au milieu de
  // l'écran sans qu'aucun doigt ne le tienne.
  const touches = { gauche: false, droite: false, haut: false, bas: false };
  const RAYON_MANCHE = 56;

  let numeroZone = 1;
  let grain = 'LUX-1042';
  let priseCount = 0;

  const el = (id) => document.getElementById(id);
  const elZone = el('zone'), elForme = el('forme'), elBarre = el('barre');
  const elAmes = el('ames');
  const elBarreBoite = document.querySelector('.barre');
  const elJauge = el('jauge'), elFormeSuite = el('forme-suite');

  function pulserJauge() {
    elBarreBoite.classList.remove('pulse');
    elJauge.classList.remove('pulse');
    void elBarreBoite.offsetWidth;              // pour rejouer l'animation
    elBarreBoite.classList.add('pulse');
    elJauge.classList.add('pulse');
  }
  const elToast = el('toast');
  const elCaillou = el('caillou'), elCaillouN = el('caillou-n');
  const elBonus = el('bonus'), elBonusNom = el('bonus-nom');
  const elBonusJauge = el('bonus-jauge');

  const forme = () => FORMES[joueur.niveau];
  const aBonus = (k) => joueur.bonus === k && joueur.bonusT > 0;

  function dims() {
    // la taille d'un bonhomme suit la case, sinon reculer la caméra ne
    // l'aurait pas rapetissé et il aurait paru énorme à l'écran
    const t = CASE * 0.5;
    // Le halo se mesure en CASES, pas en pixels d'écran : à 0.17 du petit côté
    // il valait 66 px pour des cases de 74, donc on ne voyait même pas les murs
    // de son propre couloir. Il faut au minimum une case et demie pour que
    // l'obscurité soit une contrainte et pas un aveuglement.
    return { taille: t, halo: CASE * 1.5, portee: CASE, cone: 0.20 };
  }
  let D = dims();

  // Le halo EST la jauge de santé : se faire fixer le fait rétrécir, se cacher
  // le fait revenir. Ça dit la règle sans un mot, et évite une deuxième barre.
  // Le plancher est haut (0.68) : à jauge presque pleine on doit encore y voir
  // assez pour s'enfuir. Mesuré à 0.5, le halo tombait sous une case pile au
  // moment où il fallait courir.
  // Pendant la vidange le halo se referme jusqu'à presque rien : c'est la
  // lumière qui s'en va, et c'est le seul moment où on la voit quitter le corps.
  const rayonHalo = () => D.halo * forme().halo * (0.68 + joueur.souffle * 0.32)
    * (vidange ? Math.max(0.04, 1 - vidange.t / vidange.duree) : 1) * eclosion;
  const porteeFaisceau = () => forme().portee * CASE;
  const coneFaisceau = () => forme().cone;

  /* ==================================================== collisions ======= */

  // Une porte fermée est un mur : collision, ligne de vue, propagation de la
  // lumière et découpe des cônes passent TOUTES par ici, donc il suffit de le
  // dire une fois. Le parcours en largeur, lui, ne lit que `mur` — une porte
  // s'ouvre, donc elle ne rend jamais rien inatteignable.
  const solide = (cx, cy) => {
    if (cx < 0 || cy < 0 || cx >= zone.cols || cy >= zone.lignes) return true;
    if (zone.mur[cy][cx] === 1) return true;
    const pt = zone.porteDe[cy] && zone.porteDe[cy][cx];
    return !!pt && pt.ouverte < 0.5;
  };

  // `muréParLesPortes` : pour une sentinelle, une case de porte est un mur même
  // battant grand ouvert. C'est ce qui fait d'une porte un abri sur lequel on
  // peut compter — un rouge ne la franchit jamais, quoi qu'on ait laissé
  // ouvert derrière soi.
  function degager(p, demi, mureParLesPortes) {
    const c0x = Math.floor((p.x - demi) / CASE), c1x = Math.floor((p.x + demi) / CASE);
    const c0y = Math.floor((p.y - demi) / CASE), c1y = Math.floor((p.y + demi) / CASE);
    for (let cy = c0y; cy <= c1y; cy++) {
      for (let cx = c0x; cx <= c1x; cx++) {
        const barre = mureParLesPortes
          && cx >= 0 && cy >= 0 && cx < zone.cols && cy < zone.lignes
          && zone.porteDe[cy][cx];
        if (!barre && !solide(cx, cy)) continue;
        const mx = cx * CASE, my = cy * CASE;
        const gauche = (mx - demi) - p.x, droite = (mx + CASE + demi) - p.x;
        const haut = (my - demi) - p.y, bas = (my + CASE + demi) - p.y;
        const dx = Math.abs(gauche) < Math.abs(droite) ? gauche : droite;
        const dy = Math.abs(haut) < Math.abs(bas) ? haut : bas;
        // Le choc se voit sur la matière : on s'écrase sur l'axe de l'impact et
        // on se gonfle sur l'autre. Sans ça `degager` annulait la vitesse, la
        // cible du jelly revenait à 1 et le mur ne se sentait pas du tout.
        // À 0,006 l'écrasement plafonnait à peine à 10 % et personne ne le
        // voyait : la matière encaisse maintenant trois fois plus, et l'échelle
        // elle-même est bornée pour que ça reste une gelée et pas une flaque.
        if (Math.abs(dx) < Math.abs(dy)) {
          const choc = Math.abs(p.vx);
          p.x += dx; p.vx = 0;
          if (choc > 30) { p.vsx -= choc * 0.02; p.vsy += choc * 0.02; }
        } else {
          const choc = Math.abs(p.vy);
          p.y += dy; p.vy = 0;
          if (choc > 30) { p.vsy -= choc * 0.02; p.vsx += choc * 0.02; }
        }
      }
    }
  }

  /* ==================================================== vision =========== */

  function vueLibre(x1, y1, x2, y2) {
    const d = Math.hypot(x2 - x1, y2 - y1);
    const pas = Math.max(1, Math.ceil(d / (CASE * 0.45)));
    for (let i = 1; i < pas; i++) {
      const t = i / pas;
      if (solide(Math.floor((x1 + (x2 - x1) * t) / CASE), Math.floor((y1 + (y2 - y1) * t) / CASE))) return false;
    }
    return true;
  }

  const dansLeCone = (sx, sy, angle, tx, ty, portee, demi) => {
    const d = Math.hypot(tx - sx, ty - sy);
    if (d > portee || d < 1) return false;
    const a = Math.atan2(ty - sy, tx - sx);
    return Math.abs(ecartAngle(angle, a)) <= demi + Math.min(0.45, 30 / Math.max(d, 1));
  };

  // Relais : ton faisceau réveille un bonhomme, qui éclaire à son tour dans la
  // direction de son regard. Ça ne décide de rien — ça sert à voir plus loin.
  function propager() {
    const eclaires = new Set();
    // un calmé brille tout seul, faisceau ou pas
    for (const p of zone.persos) if (p.calme && !p.livre) eclaires.add(p);
    const portee = porteeFaisceau();
    if (!portee) return eclaires;
    const cone = coneFaisceau();

    for (const p of zone.persos) {
      if (p.emotion === EMOTIONS.COLERE) continue;
      if (!dansLeCone(joueur.x, joueur.y, joueur.regard, p.x, p.y, portee, cone)) continue;
      if (!vueLibre(joueur.x, joueur.y, p.x, p.y)) continue;
      eclaires.add(p);
    }
    for (let tour = 0; tour < 4; tour++) {
      let ajout = false;
      for (const src of [...eclaires]) {
        for (const cible of zone.persos) {
          if (cible === src || eclaires.has(cible)) continue;
          if (cible.emotion === EMOTIONS.COLERE) continue;
          if (!dansLeCone(src.x, src.y, src.regard, cible.x, cible.y, D.portee * 5, D.cone)) continue;
          if (!vueLibre(src.x, src.y, cible.x, cible.y)) continue;
          eclaires.add(cible);
          ajout = true;
        }
      }
      if (!ajout) break;
    }
    return eclaires;
  }

  // Une braise tient les rouges à distance : c'est ce qui en fait un abri et
  // pas seulement un lampadaire.
  // Chemin case par case entre deux points du monde, en descendant le gradient
  // du parcours en largeur. Les sentinelles allaient tout droit vers leur point
  // de ronde : mesuré, elles visaient un point derrière un mur 46 % du temps et
  // 5 sur 23 restaient plantées contre la paroi plus de 60 % du temps.
  function routeVers(x0, y0, x1, y1, sansPortes) {
    const dep = { cx: Math.floor(x0 / CASE), cy: Math.floor(y0 / CASE) };
    if (solide(dep.cx, dep.cy)) return null;
    const d = distances(zone, dep, sansPortes);
    let cx = Math.floor(x1 / CASE), cy = Math.floor(y1 / CASE);
    if (!d[cy] || d[cy][cx] < 0) return null;
    const route = [];
    let garde = 0;
    while (d[cy][cx] > 0 && garde++ < 400) {
      route.push({ x: (cx + 0.5) * CASE, y: (cy + 0.5) * CASE });
      const voisins = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]
        .filter(([x, y]) => d[y] !== undefined && d[y][x] >= 0);
      if (!voisins.length) break;
      const suivant = voisins.reduce((a, [x, y]) => (d[y][x] < d[a[1]][a[0]] ? [x, y] : a), voisins[0]);
      cx = suivant[0]; cy = suivant[1];
    }
    return route.reverse();
  }

  const prochedUneBraise = (x, y, marge) =>
    zone.braises.some((b) => Math.hypot(b.x - x, b.y - y) < b.r * (marge || 1));

  // L'abri protège QUI S'Y TIENT, pas un statut. Le joueur et chaque suiveur
  // posent donc la même question depuis leur propre position : celui qui est
  // dans la lumière est couvert, celui qui traîne dehors reste attrapable.
  const aLAbri = (x, y) => prochedUneBraise(x, y, 1) || procheDuneTorche(x, y);

  const procheDuneTorche = (x, y) =>
    zone.torches.some((t) => t.reste > 0 && Math.hypot(t.x - x, t.y - y) < t.r);

  /* ==================================================== particules ======= */

  // Petites particules au-dessus de la tête : c'est le canal qui dit l'émotion
  // sans texte — danger, joie, peur.
  function emettre(x, y, couleur, n, vitesse, forme2) {
    for (let i = 0; i < n && particules.length < 140; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
      particules.push({
        x, y, vx: Math.cos(a) * vitesse * (0.5 + Math.random()),
        vy: Math.sin(a) * vitesse * (0.5 + Math.random()),
        vie: 0.5 + Math.random() * 0.5, max: 1, couleur, forme: forme2 || 'point',
      });
    }
  }

  // Un chiffre qui monte de la lueur vers le haut de l'écran. C'est le seul
  // moyen de dire « cette petite chose jaune remplit ta jauge » sans une ligne
  // de texte : on voit le gain partir de l'objet et rejoindre la barre.
  function flotter(x, y, texte, couleur) {
    flottants.push({ x, y, texte, couleur, vie: 1.1, max: 1.1 });
  }

  // Les mots du jeu ne coûtent JAMAIS un clic. Un murmure est une phrase pâle
  // posée dans le décor, à l'endroit exact où elle veut dire quelque chose ;
  // elle monte lentement et s'efface seule pendant qu'on continue de jouer.
  // C'est le canal de fond du récit — celui de Dark Souls, pas celui du panneau
  // à valider.
  // Une phrase du décor n'a plus de position : c'est une explication, elle passe
  // par le bandeau comme les autres. Seule une phrase attachée à quelqu'un reste
  // dans le monde — et elle le SUIT, sinon on ne sait plus qui a parlé.
  function murmurer(x, y, texte, couleur, sujet) {
    dire(sujet ? { x, y, texte, couleur, sujet, duree: 4.2 } : { texte, duree: 5.4 });
  }

  // Ce que disent les âmes qu'on rallume. Le meilleur canal possible : il est
  // mérité — on ne l'entend qu'après avoir sauvé quelqu'un —, il est diégétique
  // — ce sont des gens qui parlent —, et il est inépuisable.
  const REPLIQUES = {
    [EMOTIONS.PEUR]: [
      'Je croyais que j\'étais éteinte pour de bon.',
      'Tu es tout petit. C\'est pour ça que je te suis.',
      'Reste devant moi. Je ne vois plus rien sans toi.',
      'J\'ai oublié qui j\'éclairais. Toi aussi ?',
      'On ne m\'avait pas regardé depuis très longtemps.',
    ],
    [EMOTIONS.CURIEUX]: [
      'Il y en a d\'autres. Plus haut. Beaucoup d\'autres.',
      'Ne les regarde pas trop longtemps. C\'est comme ça qu\'on tombe.',
      'Je marchais. Je ne sais plus vers quoi.',
      'Je peux éclairer devant. Ça te coûtera d\'être vu.',
      'En haut, il paraît qu\'il y a des fenêtres.',
    ],
  };
  let numReplique = 0;

  // Ce que dit une âme qu'on ne peut pas ENCORE rallumer. Sans ça on tourne
  // autour d'elle en cherchant quoi faire, et l'échec n'apprend rien.
  const ETEINTS = [
    'On m\'a vidé de ma lumière. Il m\'en faudrait un peu de la tienne — mais la tienne est trop petite.',
    'Regarde-moi assez longtemps et je me rallumerai. Tu ne sais pas encore le faire.',
    'Je ne peux pas marcher sans lumière. Reviens quand tu en auras assez.',
  ];
  let numEteint = 0;

  function majFlottants(dt) {
    for (let i = flottants.length - 1; i >= 0; i--) {
      const f = flottants[i];
      f.vie -= dt;
      if (f.sujet && !f.sujet.livre) {
        f.x = f.sujet.x;
        f.y = f.sujet.y - D.taille * 1.9 - (f.max - f.vie) * 5;
      } else {
        f.y -= (f.murmure ? 5 : 34) * dt;
      }
      if (f.vie <= 0) flottants.splice(i, 1);
    }
  }

  function majParticules(dt) {
    for (let i = particules.length - 1; i >= 0; i--) {
      const q = particules[i];
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vy += 32 * dt;
      q.vie -= dt;
      if (q.vie <= 0) particules.splice(i, 1);
    }
    for (let i = ondes.length - 1; i >= 0; i--) {
      const o = ondes[i];
      o.r += (o.max - o.r) * Math.min(1, 7 * dt) + 40 * dt;
      if (o.r >= o.max * 0.97) ondes.splice(i, 1);
    }
  }

  /* ==================================================== physique ========= */

  function majJelly(p, dt) {
    const cibleX = clamp(1 + p.vy * 0.00055 - p.vx * 0.00055, 0.84, 1.19);
    const cibleY = clamp(1 + p.vx * 0.00055 - p.vy * 0.00055, 0.84, 1.19);
    p.vsx += (cibleX - p.sx) * 190 * dt;
    p.vsy += (cibleY - p.sy) * 190 * dt;
    p.vsx -= p.vsx * 13 * dt;
    p.vsy -= p.vsy * 13 * dt;
    p.sx = clamp(p.sx + p.vsx * dt, 0.55, 1.5);
    p.sy = clamp(p.sy + p.vsy * dt, 0.55, 1.5);
  }

  let filDernier = { x: 0, y: 0 };

  function majJoueur(dt) {
    const demi = D.taille * 0.5;

    // clavier d'abord : sur ordinateur c'est lui qui commande
    const kx = (touches.droite ? 1 : 0) - (touches.gauche ? 1 : 0);
    const ky = (touches.bas ? 1 : 0) - (touches.haut ? 1 : 0);
    if (kx || ky) {
      const kd = Math.hypot(kx, ky) || 1;
      joueur.vx += (kx / kd) * 1700 * dt;
      joueur.vy += (ky / kd) * 1700 * dt;
    } else if (manche.actif && manche.force > 0.06) {
      const accel = 1700 * manche.force;
      joueur.vx += manche.dx * accel * dt;
      joueur.vy += manche.dy * accel * dt;
    }

    const frottement = Math.pow(0.0009, dt);
    joueur.vx *= frottement;
    joueur.vy *= frottement;

    let vmax = 300 + joueur.niveau * 26;
    if (aBonus('hate')) vmax *= 1.55;
    const v = Math.hypot(joueur.vx, joueur.vy);
    if (v > vmax) { joueur.vx = (joueur.vx / v) * vmax; joueur.vy = (joueur.vy / v) * vmax; }

    joueur.x += joueur.vx * dt;
    joueur.y += joueur.vy * dt;
    joueur.x = clamp(joueur.x, demi, zone.largeur - demi);
    joueur.y = clamp(joueur.y, demi, zone.hauteur - demi);
    degager(joueur, demi);

    if (v > 26) joueur.regard += ecartAngle(joueur.regard, Math.atan2(joueur.vy, joueur.vx)) * Math.min(1, 12 * dt);

    // le fil : un point tous les vingt pixels parcourus
    if (Math.hypot(joueur.x - filDernier.x, joueur.y - filDernier.y) > 20) {
      fil.push({ x: joueur.x, y: joueur.y });
      filDernier = { x: joueur.x, y: joueur.y };
      if (fil.length > 900) fil.shift();
    }

    majJelly(joueur, dt);
  }

  // Le convoi. Chacun suit celui qui le précède, à la queue leu leu, pour ne pas
  // s'empiler sur le joueur. Les deux couleurs n'obéissent pas à la même règle,
  // et c'est tout l'arbitrage du jeu :
  //   BLEU — timide : il n'avance que tant qu'il est DANS la lumière. Discret,
  //          mais il colle et il ralentit.
  //   OR   — curieux : il suit partout et garde son faisceau allumé devant lui.
  //          Il éclaire la route, et il dénonce.
  function suivre(p, dt) {
    // Le portail aspire : sans ça un suiveur gardait son espacement derrière le
    // joueur et n'entrait jamais dans le rayon de livraison, même collé dessus.
    // Le portail aspire quoi qu'il arrive, même une fois le quota atteint : une
    // âme amenée jusque-là ne doit jamais rester plantée devant la porte sous
    // prétexte que le compte est bon. Elle entre, et ce qu'on a sauvé de plus
    // est sauvé quand même.
    const versPortail = Math.hypot(zone.sortie.x - p.x, zone.sortie.y - p.y);
    if (versPortail < CASE * 2.6) {
      const ax = zone.sortie.x - p.x, ay = zone.sortie.y - p.y;
      const ad = versPortail || 1;
      p.vx += (ax / ad) * 2400 * dt;
      p.vy += (ay / ad) * 2400 * dt;
      p.regard += ecartAngle(p.regard, Math.atan2(ay, ax)) * 5 * dt;
      return;
    }

    const file = zone.persos.filter((q) => q.suit && !q.livre).sort((a, b) => a.rang - b.rang);
    const i = file.indexOf(p);
    const devant = i <= 0 ? joueur : file[i - 1];
    const dx = devant.x - p.x, dy = devant.y - p.y;
    const d = Math.hypot(dx, dy) || 1;
    const ecart = D.taille * 1.5;

    const timide = p.emotion === EMOTIONS.PEUR;
    const auClair = !timide || estEclaire(p.x, p.y);

    // Hors de la lumière, le bleu TRAÎNE — il ne se fige pas. Mesuré avec la
    // règle « il n'avance que s'il est éclairé » : un bleu sorti du halo ne
    // pouvait plus jamais revenir et restait planté à onze cases du convoi.
    // Et l'accélération doit être d'un tout autre ordre que celle d'un PNJ
    // immobile : à 320 le frottement la plafonnait à 50 px/s, six fois moins
    // que le joueur, donc le convoi décrochait systématiquement.
    if (d > ecart) {
      const vitesse = (timide ? 2100 : 2700) * (auClair ? 1 : 0.3) * (aBonus('hate') ? 1.55 : 1);
      p.vx += (dx / d) * vitesse * dt;
      p.vy += (dy / d) * vitesse * dt;
      if (!timide) p.regard += ecartAngle(p.regard, Math.atan2(dy, dx)) * 5 * dt;
    }
    if (timide) {
      p.regard += ecartAngle(p.regard, Math.atan2(joueur.y - p.y, joueur.x - p.x)) * 3 * dt;
      if (!auClair && Math.random() < dt * 3) emettre(p.x, p.y - D.taille * 0.7, '#8fd0ff', 1, 24);
    }
  }

  function majPersos(dt, temps, eclaires) {
    const demi = D.taille * 0.5;
    for (const p of zone.persos) {
      if (p.livre) continue;                      // absorbé par le portail
      p.eclaire = eclaires.has(p);
      if (p.aveugle > 0) p.aveugle -= dt;
      if (p.emotion === EMOTIONS.COLERE) {
        p.cligne = (p.cligne || 0) - dt;
        p.prochainCligne -= dt;
        if (p.prochainCligne <= 0) { p.cligne = 0.42; p.prochainCligne = 2.2 + Math.random() * 3.6; }
      }
      if (p.fuit > 0) p.fuit -= dt;
      const dx = joueur.x - p.x, dy = joueur.y - p.y;
      const d = Math.hypot(dx, dy) || 1;
      // Un peureux ou un curieux te remarque de partout : ils ne te chassent pas.
      // Un coléreux, lui, est une SENTINELLE : il ne te voit que dans son cône.
      const voit = p.emotion === EMOTIONS.COLERE
        ? dansLeCone(p.x, p.y, p.regard, joueur.x, joueur.y, PORTEE_VUE, 0.42)
            && vueLibre(p.x, p.y, joueur.x, joueur.y)
        : d < CASE * 5 && vueLibre(p.x, p.y, joueur.x, joueur.y);

      // Une âme ne porte pas une humeur de naissance : elle porte celle de la
      // situation, exactement comme le joueur. Calculée avant son déplacement,
      // donc sur la vitesse de l'image précédente — un retard invisible.
      // Une âme à l'abri porte le même visage apaisé que Falot : d'un coup
      // d'œil on voit lesquels de ses suiveurs sont couverts et lesquels
      // dépassent de la lumière.
      if (p.emotion !== EMOTIONS.COLERE) {
        p.humeur = p.abri ? HUMEURS.APAISE
          : humeurSelon(p, menace || p.fuit > 0, p.calme);
      }

      if (p.emotion === EMOTIONS.CURIEUX) {
        if (p.calme) {
          suivre(p, dt);
        } else {
          p.phase += p.balayage * (p.eclaire ? 0.18 : 1) * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * p.amplitude;
        }

      } else if (p.emotion === EMOTIONS.PEUR) {
        if (p.calme) { suivre(p, dt); } else if (voit && d < CASE * 2.6) {
          p.vx -= (dx / d) * 300 * dt;
          p.vy -= (dy / d) * 300 * dt;
          p.regard = Math.atan2(-dy, -dx);
          p.fuit = 0.6;                          // il a peur de TOI, pas des rouges
          if (Math.random() < dt * 3) emettre(p.x, p.y - D.taille * 0.7, '#8fd0ff', 1, 26);
        } else {
          p.vx += (p.baseX - p.x) * 1.6 * dt;
          p.vy += (p.baseY - p.y) * 1.6 * dt;
          p.phase += p.balayage * 0.5 * dt;
          p.regard = p.regardRepos + Math.sin(p.phase) * 0.5;
        }

      } else {
        // SENTINELLE. Elle fait sa ronde et balaye du regard. Elle ne te
        // détecte QUE si tu entres dans son cône — donc on peut la contourner,
        // passer dans son dos, attendre que son balayage s'éloigne. La laisse
        // reste : sans elle, un seul rouge suivait le joueur à travers toute la
        // zone et le revidait à chaque réapparition.
        const loin = Math.hypot(p.x - p.baseX, p.y - p.baseY) > CASE * 5.5;
        if (p.alerte > 0) p.alerte -= dt;         // l'alerte est posée par majRegles
        if (p.gene) p.alerte = 0;

        // LE BRUIT PASSE AVANT TOUT. Un caillou qui tombe à portée lui fait
        // oublier ce qu'elle était en train de faire, alerte comprise : elle se
        // tourne et elle y va. C'est la seule arme du début du jeu, elle ne peut
        // pas dépendre de l'humeur où on la surprend.
        if (p.curiosite && p.curieuxT > 0) {
          p.enAlerte = false;
          p.curieuxT -= dt;
          const cd = Math.hypot(p.curiosite.x - p.x, p.curiosite.y - p.y);
          if (cd < CASE * 0.8 || p.curieuxT <= 0) { p.curiosite = null; p.route = null; p.curieuxT = 0; }
          else {
            if (!p.route || !p.route.length) p.route = routeVers(p.x, p.y, p.curiosite.x, p.curiosite.y, true);
            // Pas de chemin — le caillou est tombé derrière une porte, ou dans un
            // recoin qu'elle ne peut pas atteindre : elle y va quand même, tout
            // droit. Mieux vaut qu'elle bute contre un mur en regardant ailleurs
            // que de rester plantée comme si elle n'avait rien entendu.
            let vx = p.curiosite.x - p.x, vy = p.curiosite.y - p.y;
            if (!p.route || !p.route.length) {
              const vd = Math.hypot(vx, vy) || 1;
              p.vx += (vx / vd) * 300 * dt;
              p.vy += (vy / vd) * 300 * dt;
            }
            if (p.route && p.route.length) {
              const w = p.route[0];
              const rx = w.x - p.x, ry = w.y - p.y, rd = Math.hypot(rx, ry) || 1;
              if (rd < CASE * 0.45) p.route.shift();
              else { p.vx += (rx / rd) * 430 * dt; p.vy += (ry / rd) * 430 * dt; vx = rx; vy = ry; }
            }
            // elle REGARDE où elle va : sans ça son cône restait braqué sur le
            // couloir d'avant et on ne voyait pas qu'elle s'était détournée
            // `ecartAngle(a, b)` rend b moins a : pour tourner le regard VERS la
            // cible, c'est (regard, cible) et pas l'inverse. À l'envers, elle se
            // détournait du bruit tout en marchant dessus — mesuré à 171 degrés.
            const vise = Math.atan2(vy, vx);
            p.regard += ecartAngle(p.regard, vise) * Math.min(1, 7 * dt);
          }
          p.humeur = HUMEURS.INTRIGUE;

        } else if (p.alerte > 0) {
          // EN ALERTE, ELLE N'A PAS VU LE HÉROS. Elle se doute de quelque chose
          // et fouille sa zone : elle balaye largement et avance dans la
          // direction qu'elle regarde. Elle ne fonce surtout pas sur le joueur —
          // c'est le front rouge de son cône qui menace, pas elle.
          p.route = null;
          if (!p.enAlerte) { p.enAlerte = true; p.capAlerte = p.regard; p.phase = 0; }
          p.phase += 1.5 * dt;
          p.regard = p.capAlerte + Math.sin(p.phase) * 0.9;
          if (!loin) {
            p.vx += Math.cos(p.regard) * 130 * dt;
            p.vy += Math.sin(p.regard) * 130 * dt;
          }
          p.humeur = HUMEURS.ACHARNE;          // elle cherche, et ça se voit
