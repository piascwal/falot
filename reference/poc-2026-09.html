      const gb = ctx.createRadialGradient(b.x - cam.x, b.y - cam.y, 0, b.x - cam.x, b.y - cam.y, b.r);
      gb.addColorStop(0, 'rgba(255,190,110,0.17)');
      gb.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gb;
      // même polygone que le trou d'obscurité : les deux passes doivent
      // s'arrêter au même mur, sinon la chaleur bave toute seule au travers
      tracerRond(ctx, b.x - cam.x, b.y - cam.y, rayonsSource(b, b.r), b.r);
      ctx.fill();
    }
    // le balayage rouge, en lumière additive : sans ça ce n'était qu'un trou
    // dans l'obscurité, on ne le lisait pas comme un faisceau
    for (const p of zone.persos) {
      if (p.emotion !== EMOTIONS.COLERE || p.aveugle > 0 || p.cligne > 0) continue;
      if (!p.rayonsVue) continue;
      const traque = p.alerte > 0 || p.charge > 0.04;
      const pr = PORTEE_VUE;
      const gr = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, pr);
      gr.addColorStop(0, `rgba(255,90,74,${traque ? 0.2 : 0.07})`);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      const portees = p.rayonsVue;
      // traquée, la jauge dessine déjà un cône coloré par-dessus : inutile d'en
      // peindre un second, c'est un polygone dégradé plein écran de gagné
      if (!traque) {
        ctx.fillStyle = gr;
        tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, 0.42, portees);
        ctx.fill();
      }
      // Pas de contour : tout doit rester du faisceau. Traquée, le cône est
      // simplement plus dense — la jauge par-dessus fait le reste.
      if (traque) {
        const g2 = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, pr);
        g2.addColorStop(0, 'rgba(255,96,78,0.17)');
        g2.addColorStop(1, 'rgba(255,96,78,0)');
        ctx.fillStyle = g2;
        tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, 0.42, portees);
        ctx.fill();
      }
    }
    for (const p of zone.persos) {
      if (!p.calme) continue;
      const rc = D.taille * 2.1;
      const gc = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, rc);
      gc.addColorStop(0, 'rgba(168,240,200,0.2)');
      gc.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gc;
      ctx.beginPath(); ctx.arc(p.x - cam.x, p.y - cam.y, rc, 0, TAU); ctx.fill();
    }
    for (const t of zone.torches) {
      if (t.reste <= 0) continue;
      const k = clamp(t.reste / (t.duree * 0.35), 0, 1);
      const rt = t.r * (0.55 + k * 0.45);
      const gt = ctx.createRadialGradient(t.x - cam.x, t.y - cam.y, 0, t.x - cam.x, t.y - cam.y, rt);
      gt.addColorStop(0, 'rgba(255,180,92,0.19)');
      gt.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gt;
      tracerRond(ctx, t.x - cam.x, t.y - cam.y, rayonsSource(t, t.r), rt);
      ctx.fill();
    }
    for (const p of eclaires) {
      const pp = D.portee * 5;
      const gp = ctx.createRadialGradient(p.x - cam.x, p.y - cam.y, 0, p.x - cam.x, p.y - cam.y, pp);
      // un calmé éclaire en vert : c'est une lampe que le joueur a allumée,
      // elle doit se distinguer d'un simple relais de passage
      gp.addColorStop(0, rgba(p.calme ? '#a8f0c8' : COULEURS[p.emotion], p.calme ? 0.2 : 0.16));
      gp.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gp;
      tracerCone(ctx, p.x - cam.x, p.y - cam.y, p.regard, D.cone, p.rayonsRelais);
      ctx.fill();
    }
    ctx.restore();

    // on se fait fixer : le bord de l'écran rougit
    const alerte = joueur.vu * (1 - joueur.souffle * 0.55);
    if (alerte > 0.02) {
      // concentré sur le bord : au centre on doit continuer à voir le jeu
      const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.62);
      v.addColorStop(0, 'rgba(255,60,50,0)');
      v.addColorStop(1, `rgba(255,60,50,${clamp(alerte * 0.3, 0, 0.3)})`);
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, W, H);
    }

    dessinerVidange();
    dessinerManche();
    dessinerVisee();
  }

  // `shadowBlur` sur du texte est ce qui coûte le plus cher de toute l'image :
  // mesuré, les deux lignes du portail à elles seules prenaient 11 ms sur 60
  // (processeur étranglé six fois), et elles sont dessinées à CHAQUE image. Un
  // liseré sombre donne la même lisibilité pour presque rien.
  function texteCerne(txt, x, y, couleur, epaisseur) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = epaisseur || 3.5;
    ctx.strokeStyle = 'rgba(6,7,12,0.92)';
    ctx.strokeText(txt, x, y);
    ctx.fillStyle = couleur;
    ctx.fillText(txt, x, y);
  }

  function flecheVers(wx, wy, couleur, temps) {
    const x = wx - cam.x, y = wy - cam.y;
    if (x > 30 && x < W - 30 && y > 80 && y < H - 30) return;   // déjà à l'écran
    const a = Math.atan2(y - H / 2, x - W / 2);
    const rx = Math.min(W, H) * 0.38;
    const px = W / 2 + Math.cos(a) * rx, py = H / 2 + Math.sin(a) * rx;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(a);
    ctx.fillStyle = rgba(couleur, 0.5 + Math.sin(temps * 4) * 0.2);
    ctx.beginPath();
    ctx.moveTo(12, 0); ctx.lineTo(-8, 7); ctx.lineTo(-8, -7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ==================================================== interface ======== */

  // UNE seule voix. Le bandeau passager et les phrases du décor disaient la
  // même chose, de deux couleurs et à deux endroits différents, et se
  // recouvraient l'une l'autre. Tout ce qui EXPLIQUE passe désormais par le
  // bandeau, d'un seul ton ; seules les répliques des âmes restent dans le
  // monde, attachées à qui parle — là, la couleur dit qui, pas quoi.
  let filVoix = [];
  let voixT = 0;

  function dire(v) {
    if (voixT > 0.25) { if (filVoix.length < 3) filVoix.push(v); return; }
    poserVoix(v);
  }

  function poserVoix(v) {
    voixT = v.duree;
    if (v.sujet) {
      flottants.push({ x: v.x, y: v.y, texte: v.texte, couleur: v.couleur || RALLUME,
                       vie: v.duree, max: v.duree, murmure: true, sujet: v.sujet });
    } else {
      elToast.textContent = v.texte;
      elToast.classList.remove('pale');
      elToast.classList.add('on');
    }
  }

  function majVoix(dt) {
    if (voixT > 0) {
      voixT -= dt;
      if (voixT > 0) return;
      // Le bandeau ne disparaît PAS : il pâlit et il reste. Une règle qui
      // s'efface au bout de quatre secondes, on ne la lit qu'à moitié ; là on
      // peut y revenir quand on veut, et elle ne gêne personne.
      elToast.classList.add('pale');
    }
    if (filVoix.length) poserVoix(filVoix.shift());
  }

  // Le bandeau : tout ce que le jeu explique. La couleur ne lui sert plus à
  // rien, elle est ignorée — les appels la passent encore par habitude.
  function montrerToast(texte) { dire({ texte, duree: 4.4 }); }

  let flashEnCours = false;        // un écran plein arrête le monde

  const elCage = el('cage'), elPuits = el('puits');

  // Le récit de fond. La cage est un arrêt de toute façon : deux à quatre
  // phrases y passent sans rien coûter, et sur dix étages cela fait une
  // histoire complète. C'est le seul endroit du jeu où l'on s'autorise un
  // paragraphe.
  const RECIT_CAGE = {
    2: 'Elles sont entrées avant toi. Un Seuil ne s\'ouvre pas avec une clé : '
     + 'il s\'ouvre quand assez de lumière se tient dedans — et cette lumière, '
     + 'c\'était la tienne. Tu viens de tout lui donner. Tu ne te souviens déjà '
     + 'plus de ce que tu savais faire il y a un instant.',
    3: 'Il n\'y a pas de jour dans les Dessous, seulement des lampes et ce '
     + 'qu\'elles montrent. Personne n\'a construit cet endroit. On y a entassé '
     + 'ce qui ne servait plus, jusqu\'à ce que ça ressemble à une prison.',
    4: 'Les Guets ne montent pas derrière toi. Ils n\'ont nulle part '
     + 'où aller : ils sont ce qui reste quand une lampe a renoncé, et c\'est une '
     + 'lampe qu\'ils attendent — pas un corps. Une petite lumière seule dans le '
     + 'noir, exactement la forme que tu as. C\'est pour ça qu\'une flamme posée '
     + 'les désarme : dedans, tu n\'as plus cette forme-là.',
  };
  const RECIT_PLUS_HAUT = [
    'Tu ne comptes plus les étages. Elles, si.',
    'Plus haut, paraît-il, il y a des fenêtres. Personne n\'en a vu.',
    'Tu recommences petit à chaque fois, et tu ne te souviens pas assez pour '
      + 't\'en lasser.',
  ];

  function montrerCage(arrivee) {
    el('cage-titre').textContent = `Étage ${arrivee}`;
    const total = montee.reduce((a, m) => a + m.ames, 0);
    el('cage-bilan').textContent = total === 1
      ? '1 âme remontée derrière toi'
      : `${total} âmes remontées derrière toi`;

    elPuits.innerHTML = '';
    // trois étages de noir au-dessus : on ne sait jamais combien il en reste
    for (let e = 1; e <= arrivee + 3; e++) {
      const fait = montee.find((m) => m.etage === e);
      const ligne = document.createElement('div');
      ligne.className = 'etage ' + (fait ? 'franchi' : e === arrivee ? 'ici' : e < arrivee ? 'franchi' : 'noir');
      const no = document.createElement('span');
      no.className = 'no';
      // le vrai numéro d'étage, pas une profondeur : « −1 » laissait croire
      // qu'on touchait à la surface, alors qu'on ignore la hauteur du puits
      no.textContent = e > arrivee ? '?' : e;
      ligne.appendChild(no);
      if (fait && fait.ames > 0) {
        const ames = document.createElement('span');
        ames.className = 'ames';
        for (let i = 0; i < fait.ames; i++) ames.appendChild(document.createElement('i'));
        ligne.appendChild(ames);
      } else {
        const m = document.createElement('span');
        m.className = 'mention';
        // la mention du vide ne se dit qu'UNE fois, sur le premier étage
        // inconnu : répétée à chaque ligne, elle devenait du bruit
        m.textContent = e === arrivee ? 'tu arrives ici'
          : e === arrivee + 1 ? 'personne n\'est jamais monté si haut'
          : e > arrivee ? '' : 'vidé';
        ligne.appendChild(m);
      }
      elPuits.appendChild(ligne);
    }
    el('cage-recit').textContent = RECIT_CAGE[arrivee]
      || RECIT_PLUS_HAUT[(arrivee - 5) % RECIT_PLUS_HAUT.length];

    // l'étage courant doit être visible même quand la liste s'allonge
    elCage.classList.add('on');
    flashEnCours = true;
    requestAnimationFrame(() => { elPuits.scrollTop = elPuits.scrollHeight; });
  }

  el('cage-ok').addEventListener('click', () => {
    elCage.classList.remove('on');
    flashEnCours = false;
  });

  function majInterface() {
    const f = forme();
    const suivant = FORMES[joueur.niveau + 1];
    const bas = f.seuil;
    const haut = suivant ? suivant.seuil : f.seuil + 60;
    elForme.textContent = f.nom;
    elForme.style.color = f.couleur;
    // vers quoi cette barre mène : sans ça elle se remplit sans rien promettre
    elFormeSuite.textContent = suivant ? `→ ${suivant.nom}` : '';
    elBarre.style.width = `${clamp((joueur.eclat - bas) / (haut - bas), 0, 1) * 100}%`;
    elBarre.style.background = f.couleur;
    elZone.textContent = `ZONE ${zone.numero}`;
    // on ne reconstruit les pastilles que si le compte a bougé
    if (elAmes.dataset.etat !== `${zone.sortie.ames}/${zone.requis}`) {
      elAmes.dataset.etat = `${zone.sortie.ames}/${zone.requis}`;
      elAmes.innerHTML = '';
      for (let i = 0; i < zone.requis; i++) {
        const pastille = document.createElement('i');
        if (i < zone.sortie.ames) pastille.className = 'pleine';
        elAmes.appendChild(pastille);
      }
    }

    if (joueur.bonus && joueur.bonusT > 0) {
      const b = BONUS[joueur.bonus];
      elBonus.classList.add('on');
      elBonusNom.style.color = b.couleur;
      elBonusJauge.style.background = b.couleur;
      elBonusNom.textContent = b.nom;
      elBonusJauge.style.width = `${clamp(joueur.bonusT / b.duree, 0, 1) * 100}%`;
    } else {
      elBonus.classList.remove('on');
    }
  }

  /* ==================================================== zones ============ */

  function chargerZone(numero) {
    // Les lueurs spéciales ne dépendent plus de la forme courante — elle repart
    // à zéro à chaque zone — mais du NUMÉRO de zone : la variété s'ouvre au fil
    // de l'aventure, la puissance se regagne à chaque fois.
    // Un étage écrit à la main passe avant le générateur. Il n'y en a qu'un
    // aujourd'hui — le premier — et c'est voulu : la fiction commence à sa
    // place, et tout ce qui suit est tiré au sort.
    const z = ETAGES_ECRITS[numero]
      ? zoneEcrite(numero)
      : genererZone(grain, numero, Math.min(FORMES.length - 1, numero));
    if (!z) return;
    zone = z;
    if (numero === 1) montee = [];   // nouvelle aventure, nouvelle cage
    numeroZone = numero;
    priseCount = 0;
    seuilDit = false;                // chaque Seuil redit ce qu'il attend
    chute = null;
    eclosion = 1;
    particules = [];
    ondes = [];
    cailloux = [];
    traces = [];
    flottants = [];
    filVoix = [];
    voixT = 0;
    elToast.classList.remove('on');
    elToast.classList.remove('pale');
    fil = [];
    // On redevient peureux à chaque nouvelle zone : tout se regagne sur place.
    joueur.eclat = 0; joueur.sommet = 0; joueur.niveau = 0;
    joueur.bonus = null; joueur.bonusT = 0;
    joueur.souffle = 1; joueur.repit = 0;
    joueur.galets = CAILLOU[0].reserve; joueur.caillouDispo = 0;
    joueur.x = zone.depart.x;
    joueur.y = zone.depart.y;
    joueur.vx = joueur.vy = 0;
    filDernier = { x: joueur.x, y: joueur.y };
    cadrer(true);
    majBoutons();
    majInterface();
  }

  // Franchir un Seuil ne se fait plus d'un coup : Falot s'y vide d'abord. La
  // zone suivante ne se charge qu'une fois la dernière étincelle partie.
  // Le saut du prologue ne s'ouvre qu'à qui l'a déjà fini une fois. On ne
  // demande jamais au joueur s'il veut apprendre un jeu qu'il n'a pas vu.
  const CLE_PROLOGUE = 'lux-etage1-fini';
  const prologueFini = () => {
    try { return localStorage.getItem(CLE_PROLOGUE) === 'oui'; } catch (e) { return false; }
  };

  function ouvrirLeSeuil() {
    if (vidange) return;
    if (numeroZone === 1) {
      try { localStorage.setItem(CLE_PROLOGUE, 'oui'); } catch (e) { /* navigation privée */ }
    }
    montee.push({ etage: numeroZone, ames: zone.sortie.ames });
    vidange = { t: 0, duree: 2.2, eclat0: joueur.eclat, suivante: numeroZone + 1, motes: [] };
    joueur.vx = joueur.vy = 0;
    manche.actif = false; manche.force = 0;
    touches.gauche = touches.droite = touches.haut = touches.bas = false;
  }

  // Elle tombe, elle touche, il apparaît, il regarde autour de lui. Rien d'autre
  // ne tourne pendant ce temps : ni règles, ni sentinelles, ni commandes.
  function majChute(dt) {
    chute.t += dt;
    const t = chute.t;
    if (t < CHUTE.tombe) {
      const k = t / CHUTE.tombe;
      chute.y = chute.y0 + (joueur.y - chute.y0) * (k * k);   // elle accélère
      eclosion = 0;
      if (Math.random() < dt * 26) emettre(chute.x, chute.y, '#8fd0ff', 1, 16);
      return;
    }
    if (!chute.pose) {
      chute.pose = true;
      chute.y = joueur.y;
      ondes.push({ x: joueur.x, y: joueur.y, r: 0, max: CASE * 2.6, couleur: '#8fd0ff' });
      emettre(joueur.x, joueur.y, '#8fd0ff', 24, 95);
      emettre(joueur.x, joueur.y, '#c6e6ff', 12, 45);
    }
    const a = t - CHUTE.tombe;
    const vers = (cible, vitesse) => {
      joueur.regard += ecartAngle(joueur.regard, cible) * Math.min(1, (vitesse || 5) * dt);
    };
    if (a < CHUTE.pose) { eclosion = a / CHUTE.pose; joueur.regard = Math.PI / 2; return; }
    eclosion = 1;
    const b = a - CHUTE.pose;
    if (b < CHUTE.gauche) { vers(Math.PI); return; }         // il regarde à gauche
    const c = b - CHUTE.gauche;
    if (c < CHUTE.droite) { vers(0); return; }               // puis à droite
    const d = c - CHUTE.droite;
    if (d < CHUTE.fin) { vers(Math.PI / 2); return; }        // puis devant lui
    chute = null;                                            // il peut partir
  }

  function majVidange(dt) {
    vidange.t += dt;
    const k = clamp(vidange.t / vidange.duree, 0, 1);
    // la jauge du haut se vide au même rythme que le halo se referme
    joueur.eclat = vidange.eclat0 * (1 - k);
    majInterface();

    // Des motes montent hors du corps en spirale. Elles ont leur propre liste
    // parce qu'elles sont peintes PAR-DESSUS le voile : les particules
    // ordinaires sont dessinées dessous, et le halo qui se referme les aurait
    // effacées au fur et à mesure — c'est-à-dire exactement quand il faut les
    // voir.
    const cadence = 74 * (1 - k * 0.45);
    let aNaitre = cadence * dt + (vidange.reste || 0);
    vidange.reste = aNaitre % 1;
    for (let i = 0; i < Math.floor(aNaitre); i++) {
      vidange.motes.push({
        a: Math.random() * TAU,
        r: D.taille * (0.15 + Math.random() * 0.45),
        h: 0,
        vh: 46 + Math.random() * 70,
        va: (Math.random() < 0.5 ? -1 : 1) * (1.4 + Math.random() * 2.2),
        vie: 1, max: 0.8 + Math.random() * 0.5,
        taille: 1.4 + Math.random() * 2.2,
      });
    }
    for (let i = vidange.motes.length - 1; i >= 0; i--) {
      const m = vidange.motes[i];
      m.h += m.vh * dt;
      m.a += m.va * dt;
      m.r *= 1 - 0.55 * dt;                 // la spirale se resserre en montant
      m.vie -= dt / m.max;
      if (m.vie <= 0) vidange.motes.splice(i, 1);
    }

    // et le sol rend ce qu'on lui a pris : des ondes qui partent du corps
    if (Math.random() < dt * 9) {
      ondes.push({ x: joueur.x, y: joueur.y, r: D.taille * 0.5,
                   max: D.taille * (2.4 + Math.random() * 2.4), couleur: forme().couleur });
    }

    if (vidange.t >= vidange.duree) {
      const n = vidange.suivante;
      vidange = null;
      chargerZone(n);
      montrerCage(n);
    }
  }

  // Peinte après le voile d'obscurité, en lumière additive : c'est de la
  // lumière qui s'en va, elle ne peut pas être masquée par le noir.
  function dessinerVidange() {
    if (!vidange) return;
    const k = clamp(vidange.t / vidange.duree, 0, 1);
    const jx = joueur.x - cam.x, jy = joueur.y - cam.y;
    const teinte = forme().couleur;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // la colonne : ce qui sort de lui et monte
    const haut = D.taille * 5.5;
    const col = ctx.createLinearGradient(jx, jy, jx, jy - haut);
    col.addColorStop(0, rgba(teinte, 0.34 * (1 - k * 0.5)));
    col.addColorStop(0.45, rgba(teinte, 0.12 * (1 - k * 0.5)));
    col.addColorStop(1, rgba(teinte, 0));
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(jx - D.taille * 0.62, jy + D.taille * 0.2);
    ctx.lineTo(jx + D.taille * 0.62, jy + D.taille * 0.2);
    ctx.lineTo(jx + D.taille * 0.22, jy - haut);
    ctx.lineTo(jx - D.taille * 0.22, jy - haut);
    ctx.closePath();
    ctx.fill();

    for (const m of vidange.motes) {
      const x = jx + Math.cos(m.a) * m.r;
      const y = jy - m.h;
      const a = clamp(m.vie, 0, 1);
      const g = ctx.createRadialGradient(x, y, 0, x, y, m.taille * 4);
      g.addColorStop(0, rgba(teinte, a * 0.95));
      g.addColorStop(1, rgba(teinte, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, m.taille * 4, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba('#ffffff', a * 0.8);
      ctx.beginPath(); ctx.arc(x, y, m.taille * 0.55, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // le corps s'assombrit : la lumière le quitte pour de bon
    ctx.save();
    ctx.globalAlpha = k * 0.72;
    ctx.fillStyle = 'rgba(8,8,14,1)';
    carreArrondi(ctx, jx - D.taille * 0.55, jy - D.taille * 0.55,
                 D.taille * 1.1, D.taille * 1.1, D.taille * 0.34);
    ctx.fill();
    ctx.restore();
  }

  function cadrer(immediat) {
    const cx = clamp(joueur.x - W / 2, 0, Math.max(0, zone.largeur - W));
    const cy = clamp(joueur.y - H / 2, 0, Math.max(0, zone.hauteur - H));
    if (immediat) { cam.x = cx; cam.y = cy; return; }
    cam.x += (cx - cam.x) * 0.14;
    cam.y += (cy - cam.y) * 0.14;
  }

  /* ==================================================== boucle =========== */

  function surveillerCadence(dt) {
    if (palier >= PALIERS.length - 1) return;
    fenetre.push(dt);
    if (fenetre.length < 60) return;                 // une seconde, pas une et demie
    const median = [...fenetre].sort((a, b) => a - b)[30];
    fenetre = [];
    if (median > 0.021) { palier++; redimensionner(); }
  }

  // Le coût d'une image est proportionnel au NOMBRE DE PIXELS à remplir, pas à
  // la finesse de l'écran. Plafonner la densité ne suffit donc pas : sur une
  // tablette, 1,5 fois 1024x1366 fait encore trois millions de pixels, et on
  // mesurait 108 images sur 300 au-dessus de 20 ms alors que le même jeu sur
  // téléphone en ratait une. On se donne un budget en pixels et on en déduit la
  // densité : un téléphone garde toute sa finesse, un grand écran rend un peu
  // moins fin plutôt que de saccader.
  const BUDGET_PIXELS = 2.1e6;

  function redimensionner() {
    W = window.innerWidth;
    H = window.innerHeight;
    const tenable = Math.sqrt(BUDGET_PIXELS / Math.max(1, W * H));
    DPR = clamp(Math.min(window.devicePixelRatio || 1, PALIERS[palier], tenable), 0.75, 3);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    lum.width = Math.ceil(canvas.width * QLUM);
    lum.height = Math.ceil(canvas.height * QLUM);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    D = dims();
  }

  let dernier = performance.now();

  // Coût réel du corps de la boucle, sur les deux cent quarante dernières
  // images. L'écart entre deux images ne dit rien tant qu'on est calé sur les
  // 60 Hz : il vaut 16,7 ms qu'on ait trois fois trop de marge ou pas assez.
  // Ce que ça coûte VRAIMENT de dessiner une image, c'est ça.
  const coutsImage = [];
  function boucle(maintenant) {
    requestAnimationFrame(boucle);
    const _t0 = performance.now();
    try { corpsBoucle(maintenant); } finally {
      coutsImage.push(performance.now() - _t0);
      if (coutsImage.length > 240) coutsImage.shift();
    }
  }

  function corpsBoucle(maintenant) {
    const dt = Math.min((maintenant - dernier) / 1000, 1 / 30);
    dernier = maintenant;
    const temps = maintenant / 1000;
    if (!zone) return;

    // La cadence se surveille TOUT LE TEMPS. Elle ne l'était qu'avec le doigt sur
    // le joystick : au clavier, ou pendant qu'on vise, une machine qui peine ne
    // se rattrapait jamais.
    surveillerCadence(dt);
    majVoix(dt);

    if (chute) {
      majChute(dt);
      majParticules(dt);
      majFlottants(dt);
      cadrer(false);
      dessiner(temps, propager());
      return;
    }

    if (vidange) {
      // Le monde se tait : plus de sentinelles, plus de règles. Il ne reste que
      // la lumière qui s'en va — mais il faut bien la DESSINER. Cette branche
      // ne rendait rien du tout : le canvas gardait la dernière image et
      // l'effet était rigoureusement invisible.
      majVidange(dt);
      majParticules(dt);
      majFlottants(dt);
      cadrer(false);
      dessiner(temps, propager());
    } else if (!flashEnCours) {
      majPortes(dt);              // avant tout le reste : `solide` doit être stable
      majJoueur(dt);
      const eclaires = propager();
      majPersos(dt, temps, eclaires);
      majRegles(dt);
      majCailloux(dt);
      majParticules(dt);
      majFlottants(dt);
      cadrer(false);
      majInterface();
      dessiner(temps, eclaires);
    } else {
      dessiner(temps, new Set());
    }
  }

  /* ==================================================== entrées ========== */

  // Joystick flottant : il naît exactement sous le doigt, où qu'on le pose.
  function pointCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function majManche(p) {
    const dx = p.x - manche.ox, dy = p.y - manche.oy;
    const d = Math.hypot(dx, dy);
    manche.force = clamp(d / RAYON_MANCHE, 0, 1);
    if (d > 0.01) { manche.dx = dx / d; manche.dy = dy / d; }
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (manche.id !== null) return;
    canvas.setPointerCapture(e.pointerId);
    const p = pointCanvas(e);
    manche.id = e.pointerId;
    manche.actif = true;
    manche.ox = p.x; manche.oy = p.y;
    manche.dx = 0; manche.dy = 0; manche.force = 0;

  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== manche.id) return;
    majManche(pointCanvas(e));
  });

  ['pointerup', 'pointercancel'].forEach((t) =>
    canvas.addEventListener(t, (e) => {
      if (e.pointerId !== manche.id) return;
      manche.actif = false;
      manche.force = 0;
      manche.id = null;
    }));

  // Un seul bouton, et il garde le doigt : on appuie, on glisse pour viser, on
  // relâche pour lancer. Mesuré, un `click` n'agirait qu'au relâchement — ici
  // c'est voulu, puisque c'est le relâchement qui valide la direction.
  elCaillou.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    if (elCaillou.disabled || visee.id !== null) return;
    elCaillou.setPointerCapture(e.pointerId);
    visee.id = e.pointerId; visee.actif = true;
    visee.ox = e.clientX; visee.oy = e.clientY;
    visee.dx = Math.cos(joueur.regard); visee.dy = Math.sin(joueur.regard);
    visee.force = 0.55;
  });
  elCaillou.addEventListener('pointermove', (e) => {
    if (e.pointerId !== visee.id) return;
    const dx = e.clientX - visee.ox, dy = e.clientY - visee.oy;
    const d = Math.hypot(dx, dy);
    if (d > 8) { visee.dx = dx / d; visee.dy = dy / d; visee.force = clamp(d / 110, 0.15, 1); }
  });
  // Le lancer part au RELÂCHEMENT, jamais à l'appui : c'est ce qui laisse
  // ajuster la direction tant que le doigt est posé.
  elCaillou.addEventListener('pointerup', (e) => {
    if (e.pointerId !== visee.id) return;
    visee.id = null; visee.actif = false;
    lancerCaillou(Math.atan2(visee.dy, visee.dx), visee.force);
  });
  // Une annulation n'est pas un lâcher : on abandonne la visée sans rien lancer.
  elCaillou.addEventListener('pointercancel', (e) => {
    if (e.pointerId !== visee.id) return;
    visee.id = null; visee.actif = false;
  });
  elCaillou.addEventListener('click', (e) => e.preventDefault());

  // Clavier : les flèches pour marcher, l'espace pour lancer un caillou droit
  // devant. On ne gêne pas le défilement de la page — il n'y en a pas — mais on
  // empêche les flèches de faire défiler quoi que ce soit.
  const CAP_TOUCHES = {
    ArrowLeft: 'gauche', ArrowRight: 'droite', ArrowUp: 'haut', ArrowDown: 'bas',
  };
  window.addEventListener('keydown', (e) => {
    const t = CAP_TOUCHES[e.key];
    // la consigne ne s'effaçait qu'au premier toucher de l'écran : au clavier
    // elle restait affichée par-dessus le personnage pour toujours
    if (t) { touches[t] = true; e.preventDefault(); return; }
    if (e.key === ' ' && !e.repeat) { lancerCaillou(joueur.regard, 0.55); e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => {
    const t = CAP_TOUCHES[e.key];
    if (t) { touches[t] = false; e.preventDefault(); }
  });
  // une fenêtre qui perd le focus garde les touches enfoncées : on relâche tout
  window.addEventListener('blur', () => {
    touches.gauche = touches.droite = touches.haut = touches.bas = false;
  });

  window.addEventListener('resize', () => {
    redimensionner();
    if (zone) cadrer(true);
  });

  redimensionner();

  // Raccourci de développement : ?etage=4 démarre directement à cet étage,
  // ?graine=LUX-1234 fixe le plan. Sans ça il faudrait retraverser tout le
  // début à chaque essai — et un niveau d'introduction écrit à la main rendra
  // ça franchement pénible. Rien d'autre ne lit l'URL, le jeu démarre
  // normalement quand elle est vide.
  const elTitre = el('titre'), elOuverture = el('ouverture');

  // L'écran noir d'ouverture : deux lignes, aucun bouton, il s'efface tout
  // seul. C'est le seul arrêt qu'on s'autorise avant la première image — et on
  // peut l'écourter d'un geste, parce qu'on le reverra à chaque partie.
  function ouvrir() {
    elOuverture.classList.add('on');
    flashEnCours = true;
    let clos = false;
    const fermer = () => {
      if (clos) return;
      clos = true;
      minuteries.forEach(clearTimeout);
      removeEventListener('pointerdown', fermer);
      removeEventListener('keydown', fermer);
      elOuverture.classList.remove('on');
      // La lumière part AVANT que le noir ait fini de s'effacer : on la voit
      // déjà descendre à travers les derniers mots.
      chute = { t: 0, x: joueur.x, y: joueur.y - CASE * 3.5,
                y0: joueur.y - CASE * 3.5, pose: false };
      eclosion = 0;
      flashEnCours = false;
      setTimeout(() => {
        el('ouverture-1').classList.remove('vu');
        el('ouverture-2').classList.remove('vu');
      }, 900);
    };
    const minuteries = [
      setTimeout(() => el('ouverture-1').classList.add('vu'), 400),
      setTimeout(() => el('ouverture-2').classList.add('vu'), 2200),
      setTimeout(fermer, 5400),
      // on laisse le temps de lire avant d'autoriser le saut
      setTimeout(() => {
        if (clos) return;
        addEventListener('pointerdown', fermer);
        addEventListener('keydown', fermer);
      }, 1300),
    ];
  }

  function descendre(etage) {
    elTitre.classList.remove('on');
    chargerZone(etage);
    if (etage > 1) { flashEnCours = false; eclosion = 1; return; }
    eclosion = 0;            // il ne doit pas apparaître derrière l'écran noir
    ouvrir();
  }

  {
    const reglages = new URLSearchParams(location.search);
    const g = reglages.get('graine');
    if (g) grain = g;
    const demande = parseInt(reglages.get('etage'), 10);
    const e = Math.max(1, Math.min(99, demande || 1));
    chargerZone(e);
    if (demande) {
      // raccourci de développement : on saute l'écran-titre, sinon il faudrait
      // le cliquer à chaque essai
      montrerToast(e > 1 ? `Départ direct à l'étage ${e}` : 'Départ direct', '#ffe9a8');
    } else {
      flashEnCours = true;
      elTitre.classList.add('on');
      // Le saut reste visible en permanence. La règle « débloqué après une
      // première fin » est la bonne pour un jeu publié, mais elle rend l'étage 1
      // obligatoire à chaque essai pendant qu'on le construit. Pour la
      // rétablir : `= !prologueFini()`.
      el('titre-plus-haut').hidden = false;
    }
  }

  el('titre-descendre').addEventListener('click', () => descendre(1));
  el('titre-plus-haut').addEventListener('click', () => descendre(2));

  requestAnimationFrame(boucle);

  // Exposé pour les mesures automatisées. L'accessibilité du plan se vérifie
  // exactement — parcours en largeur sur la grille — et c'est précisément ce
  // que le solveur de lumière du mode puzzle ne savait qu'approximer.
  window.__lux = {
    info: () => zone && {
      zone: zone.numero, grain: zone.grain,
      cols: zone.cols, lignes: zone.lignes, salles: zone.salles.length,
      lueurs: zone.lueurs.length, requis: zone.requis,
      ames: zone.sortie.ames, convoi: zone.persos.filter((q) => q.suit && !q.livre).length,
      calmables: zone.persos.filter((q) => q.emotion !== EMOTIONS.COLERE && !q.livre).length,
      speciales: zone.lueurs.filter((l) => l.type !== 'eclat').length,
      persos: zone.persos.length, longueur: zone.longueur,
      niveau: joueur.niveau, eclat: Math.round(joueur.eclat), prises: priseCount,
      galets: joueur.galets, posees: zone.braises.length,
      souffle: +joueur.souffle.toFixed(2),
    },
    accessible: () => {
      const d = distances(zone, { cx: Math.floor(zone.depart.x / CASE), cy: Math.floor(zone.depart.y / CASE) });
      const ok = (p) => {
        const cx = Math.floor(p.x / CASE), cy = Math.floor(p.y / CASE);
        return d[cy] && d[cy][cx] >= 0;
      };
      return { sortie: ok(zone.sortie), lueurs: zone.lueurs.every(ok), persos: zone.persos.every(ok) };
    },
    // Charger une zone à la main, c'est entrer dans le jeu : on referme
    // l'écran-titre au passage. Sans ça le monde reste gelé derrière lui et
    // plus rien ne bouge — ce qui a fait passer deux mesures au rouge sans que
    // le jeu ait le moindre problème.
    couts: () => coutsImage.slice(),
    scene: () => (chute ? { t: +chute.t.toFixed(2), pose: chute.pose, eclosion: +eclosion.toFixed(2), regard: +joueur.regard.toFixed(2) } : { fini: true, eclosion: +eclosion.toFixed(2) }),
    charger: (n) => { elTitre.classList.remove('on'); flashEnCours = false; chargerZone(n); },
    // La graine ne décide plus du premier étage — il est écrit à la main — mais
    // de tous les suivants. On repart donc du premier étage PROCÉDURAL.
    graine: (g, etage) => {
      grain = g;
      elTitre.classList.remove('on'); flashEnCours = false;
      chargerZone(etage || 2);
    },
    joueur: () => ({ ...joueur }),
    toast: () => elToast.classList.contains('on'),
    // pousse le joystick vers un point du monde, comme un doigt le ferait
    viser: (wx, wy) => {
      const dx = wx - joueur.x, dy = wy - joueur.y;
      const d = Math.hypot(dx, dy) || 1;
      manche.actif = true; manche.id = -1;
      manche.ox = W / 2; manche.oy = H / 2;
      manche.dx = dx / d; manche.dy = dy / d;
      manche.force = 1;
    },
    lacher: () => { manche.actif = false; manche.force = 0; manche.id = null; },
    manche: () => ({ ...manche }),
    monter: (n) => {
      joueur.sommet = joueur.eclat = n;
      joueur.niveau = 0;
      for (let i = 0; i < FORMES.length; i++) evoluer();
      elCage.classList.remove('on'); flashEnCours = false;
      majBoutons();
    },
    humeurJoueur: humeurDuJoueur,
    // dessine un visage agrandi sur le canvas du jeu, avec le vrai code
    dessinerVisageTest: (ecranX, ecranY, taille, humeur, couleur) =>
      dessinerTete({ x: cam.x + ecranX, y: cam.y + ecranY, sx: 1, sy: 1,
                     regard: -Math.PI / 2, tremble: 0, aveugle: 0, cligne: 0 },
                   couleur, taille, true, 1, humeur, 0.3),
    menace: () => menace,
    solide: (x, y) => solide(Math.floor(x / CASE), Math.floor(y / CASE)),
    vueLibre,
    camera: () => ({ x: cam.x, y: cam.y }),
    touches: () => ({ ...touches }),
    porteesRond: portéesRond,
    rayonHalo,
    dureeCalme: () => DUREE_CALME,
    // les seuils, lus depuis le jeu : un test qui les recopie devient faux au
    // premier rééquilibrage, et c'est arrivé
    seuils: () => FORMES.map((f) => f.seuil),
    RAYONS_ROND: () => RAYONS_ROND,
    lancerCaillou,
    // fait retomber un caillou à un endroit précis : c'est le vrai code
    // d'impact, pas une imitation
    bruit: (x, y) => toucherLeSol({ x1: x, y1: y, rang: rangCaillou() }),
    visee: () => ({ ...visee }),
    recharger: () => { joueur.galets = rangCaillou().reserve; joueur.caillouDispo = 0; majBoutons(); },
    cailloux: () => cailloux,
    porteesCone: portéesCone,
    CASE: () => CASE,
    regarder: (a) => { joueur.regard = a; },
    cheminInterne: (x0, y0, x1, y1) => routeVers(x0, y0, x1, y1),
    fil: () => fil,
    traces: () => traces,
    flottants: () => flottants,
    estEclaire,
    // pour chaque PNJ à portée d'écran : ses yeux sont-ils dessinés, et sinon pourquoi
    // le même filtre que le rendu des yeux, pour pouvoir le mesurer
    diagYeux: () => zone.persos.map((p) => {
      const dj = Math.hypot(p.x - joueur.x, p.y - joueur.y);
      const cache = !vueLibre(p.x, p.y, joueur.x, joueur.y);
      const ex = p.x - cam.x, ey = p.y - cam.y;
      const aEcran = ex >= -CASE && ey >= -CASE && ex <= W + CASE && ey <= H + CASE;
      const eclaire = p.eclaire || estEclaire(p.x, p.y);
      const ferme = p.cligne > 0 || p.aveugle > 0;
      return {
        emotion: p.emotion, cases: +(dj / CASE).toFixed(1), cache, aEcran,
        dejaEclaire: eclaire, cligne: p.cligne > 0, aveugle: p.aveugle > 0,
        dessine: aEcran && !eclaire && !ferme,
        raison: !aEcran ? 'hors écran' : eclaire ? 'déjà éclairé' : ferme ? 'yeux fermés' : null,
      };
    }),
    soigner: () => { joueur.souffle = 1; joueur.repit = 0; },
    poser: (x, y) => { joueur.x = x; joueur.y = y; joueur.vx = joueur.vy = 0; cadrer(true); },
    // ce que la boucle de drain calcule réellement, pour un perso donné
    sonde: (q) => ({
      emotion: q.emotion, aveugle: +q.aveugle.toFixed(1), alerte: +q.alerte.toFixed(2),
      regard: +q.regard.toFixed(3),
      angleVersJoueur: +Math.atan2(joueur.y - q.y, joueur.x - q.x).toFixed(3),
      ecart: +Math.abs(ecartAngle(q.regard, Math.atan2(joueur.y - q.y, joueur.x - q.x))).toFixed(3),
      dist: Math.round(Math.hypot(joueur.x - q.x, joueur.y - q.y)),
      dansCone: dansLeCone(q.x, q.y, q.regard, joueur.x, joueur.y, PORTEE_VUE, 0.42),
      vueLibre: vueLibre(q.x, q.y, joueur.x, joueur.y),
      abri: prochedUneBraise(joueur.x, joueur.y, 1),
    }),
    tuer: () => eteindre(),
    chemin: (wx, wy) => {
      const dep = { cx: Math.floor(joueur.x / CASE), cy: Math.floor(joueur.y / CASE) };
      const d = distances(zone, dep);
      let cx = Math.floor(wx / CASE), cy = Math.floor(wy / CASE);
      if (!d[cy] || d[cy][cx] < 0) return null;
      const route = [];
      while (d[cy][cx] > 0) {
        route.push([(cx + 0.5) * CASE, (cy + 0.5) * CASE]);
        const n = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]
          .filter(([x, y]) => d[y] !== undefined && d[y][x] >= 0);
        const suivant = n.reduce((a, [x, y]) => (d[y][x] < d[a[1]][a[0]] ? [x, y] : a), n[0]);
        cx = suivant[0]; cy = suivant[1];
      }
      return route.reverse();
    },
    etat: () => zone,
  };
})();
</script>
</body>
</html>
