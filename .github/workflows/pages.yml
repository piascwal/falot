# Déploiement du jeu sur GitHub Pages.
#
# À activer une fois dans les réglages du dépôt : Settings → Pages → Source =
# « GitHub Actions ». Tant que ce n'est pas fait, ce workflow échoue et c'est
# normal — la CI (`ci.yml`), elle, tourne sans rien demander.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # le POC gelé et la bible partent avec : ce sont des pages du projet
      - run: |
          mkdir -p dist/reference dist/docs
          cp reference/*.html dist/reference/
          cp docs/*.md dist/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
