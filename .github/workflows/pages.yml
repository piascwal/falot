# Déploiement du jeu sur GitHub Pages.
#
# Rien à faire pour que ce workflow reste vert : tant que Pages n'est pas activé
# sur le dépôt, il le constate et s'arrête là. Pour publier pour de bon :
# Settings → Pages → Source = « GitHub Actions ». Le prochain push déploie.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Un workflow qui échoue à chaque push pour un réglage non coché, c'est du
  # bruit : on pose la question à l'API plutôt que de laisser l'étape planter.
  verifier:
    runs-on: ubuntu-latest
    outputs:
      actif: ${{ steps.pages.outputs.actif }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "actif=oui" >> "$GITHUB_OUTPUT"
          else
            echo "actif=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages n'est pas activé (HTTP $code). Settings → Pages → Source : GitHub Actions."
          fi

  construire:
    needs: verifier
    if: needs.verifier.outputs.actif == 'oui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # le POC gelé et la bible partent avec : ce sont des pages du projet
      - run: |
          mkdir -p dist/reference dist/docs
          cp reference/*.html dist/reference/
          cp docs/*.md dist/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
