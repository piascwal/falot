<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lux &amp; Paranoïa</title>
<meta name="description" content="Aventure procédurale dans le noir : un petit peureux n'a qu'une pierre, et escorte des âmes jusqu'au portail sans croiser les regards rouges.">
<meta name="theme-color" content="#08080e">
<link rel="stylesheet" href="./src/interface/styles.css">
</head>
<body>
<canvas id="jeu"></canvas>

<div class="hud" id="hud">
  <!-- Lien absolu, et non plus « ../index.html » : le jeu vivait dans le repo du
       hub, il a son propre site maintenant. -->
  <a class="back" href="https://piascwal.github.io/hub/" aria-label="Retour au hub">←</a>
  <span class="zone" id="zone">ZONE 1</span>
  <span class="ames" id="ames" aria-label="âmes livrées"></span>
  <!-- La jauge de confiance. Elle était un trait de 80 px sans légende : sur un
       grand écran on ramassait des lueurs sans voir qu'on remplissait quoi que
       ce soit, ni vers quoi. Elle dit maintenant d'où l'on part et où l'on va. -->
  <span class="jauge" id="jauge">
    <span class="jauge-mots">
      <b class="forme" id="forme">Peureux</b>
      <em class="suite" id="forme-suite"></em>
    </span>
    <span class="barre"><i id="barre"></i></span>
    <!-- Le bonus en cours, juste en dessous et sur UNE seule ligne : son nom
         coincé entre les deux barres semblait posé dessus. -->
    <span class="bonus" id="bonus">
      <b id="bonus-nom"></b>
      <span class="barre" id="bonus-barre"><i id="bonus-jauge"></i></span>
    </span>
  </span>
</div>



<div class="actions" id="actions">
  <!-- Le souffle n'apparaît qu'une fois que Falot s'en est souvenu (étage 3).
       Il se MAINTIENT : on le garde le temps d'un passage, on respire après. -->
  <button type="button" class="rond souffle" id="souffle" hidden
          aria-label="Souffler sa lumière">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
      <path class="barre" d="M4.2 19.8 19.8 4.2"/>
    </svg>
  </button>
  <!-- Le fanal ne s'affiche que quand il y a une torche à portée de main, ou
       qu'on en tient une : un bouton qui ne sert à rien n'a rien à faire là. -->
  <button type="button" class="rond fanal" id="fanal" hidden>FANAL</button>
  <button type="button" class="rond on" id="pierre">PIERRE<br><span id="pierre-n">1</span></button>
</div>


<div class="toast" id="toast"></div>

<!-- L'écran-titre et l'écran noir d'ouverture. Ils ne servent qu'une fois par
     partie : passé le premier Seuil, le jeu ne s'arrête plus. -->
<div class="titre" id="titre">
  <em>Les Dessous</em>
  <strong>Lux &amp; Paranoïa</strong>
  <p>Falot est la plus petite lampe d'ici. Il ne se souvient pas de qui il
     éclairait — seulement que quelqu'un, quelque part, avait moins peur grâce
     à lui.</p>
  <button type="button" class="btn" id="titre-descendre">Descendre</button>
  <button type="button" class="lien" id="titre-plus-haut" hidden>Passer le prologue — reprendre à l'étage 2</button>
  <!-- Raccourci d'essai : la dernière salle sans traverser les onze étages. -->
  <button type="button" class="lien" id="titre-fin">Voir la fin — raccourci d'essai</button>
  <!-- La grille des étages : ce qu'on a fait de chacun, et de quoi y retourner.
       Elle sert de tableau de progression ET de raccourci de mise au point. -->
  <button type="button" class="lien" id="titre-etages">Choisir un étage</button>
  <div class="etages" id="etages" hidden></div>
</div>

<div class="ouverture" id="ouverture">
  <b id="ouverture-1">Une lumière qui s'éteint ne disparaît pas.</b>
  <b id="ouverture-2">Elle tombe.</b>
</div>

<!-- La cage d'escalier a disparu d'ici : l'ascension entre deux étages se
     joue maintenant sur le canvas (voir `coeur/regles/puits.ts`). On ne sort
     plus du jeu pour apprendre qu'on a progressé. -->

<script type="module" src="./src/main.ts"></script>
</body>
</html>
